<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Detail — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .admin-page{padding:24px 20px 40px;max-width:760px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .action-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .detail-title{font-family:var(--font-display);font-size:clamp(26px,5vw,32px);font-weight:600;color:var(--maroon);line-height:1.15;margin-bottom:10px;}
  .detail-meta{font-size:15px;color:var(--ink-soft);line-height:1.65;margin-bottom:8px;}
  .detail-recurring{font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .badge-row{margin-bottom:20px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge-scheduled{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-cancelled{background:rgba(92,58,68,0.12);color:var(--ink-soft);}
  .badge-attending{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-not-attending{background:rgba(180,35,24,0.1);color:var(--error);}
  .badge-maybe{background:rgba(183,121,31,0.15);color:var(--amber);}
  .badge-none{background:rgba(92,58,68,0.12);color:var(--ink-soft);}
  .detail-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--maroon);border-radius:10px;padding:22px 24px;margin-bottom:20px;}
  .detail-card h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:14px;}
  .detail-body{font-size:15px;line-height:1.75;color:var(--ink-soft);white-space:pre-wrap;}
  .rsvp-summary{font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:12px;line-height:1.6;}
  .rsvp-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(107,31,53,0.1);margin-bottom:20px;}
  .rsvp-bar-seg{height:100%;min-width:0;transition:width .3s ease;}
  .rsvp-bar-seg.attending{background:var(--success);}
  .rsvp-bar-seg.not-attending{background:var(--error);}
  .rsvp-bar-seg.maybe{background:var(--amber);}
  .rsvp-bar-seg.none{background:rgba(92,58,68,0.3);}
  .section-heading{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-list{display:flex;flex-direction:column;gap:8px;}
  .member-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--ivory);border:1px solid rgba(107,31,53,0.1);border-radius:8px;flex-wrap:wrap;}
  .member-row .name{font-size:15px;font-weight:600;color:var(--ink);flex:1;min-width:120px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);white-space:nowrap;}
  .btn-danger{background:var(--error);color:var(--ivory);}
  .btn-danger:hover,.btn-danger:focus-visible{background:#9a1e14;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);background:var(--ivory);border:1px solid rgba(107,31,53,0.1);border-radius:10px;}
  .empty-state p{font-size:15px;margin-bottom:20px;line-height:1.6;}
  .error-banner{display:none;background:rgba(180,35,24,0.08);border:1px solid rgba(180,35,24,0.25);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--error);margin-bottom:16px;}
  .error-banner.visible{display:block;}
  .success-banner{display:none;position:relative;background:rgba(240,204,92,0.18);border:1px solid rgba(201,162,39,0.45);border-radius:8px;padding:12px 40px 12px 14px;font-size:14px;color:var(--maroon-deep);margin-bottom:16px;}
  .success-banner.visible{display:block;}
  .success-banner-dismiss{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--maroon);font-size:18px;padding:4px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);z-index:100;background:var(--ivory);border-radius:12px;border-top:3px solid var(--maroon);padding:28px 24px;width:calc(100% - 40px);max-width:400px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 20px 48px -12px rgba(36,16,25,0.35);}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:12px;}
  .modal p{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:24px;}
  .modal-actions{display:flex;gap:12px;}
  .modal-actions button{flex:1;padding:14px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:var(--font-body);}
  .modal-cancel{background:transparent;border:1px solid rgba(107,31,53,0.3)!important;color:var(--maroon);}
  .modal-confirm{background:var(--error);color:var(--ivory);}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.action-row{flex-direction:column;}.action-row .btn{width:100%;}}
  @media (prefers-reduced-motion:reduce){.modal,.modal-backdrop,.rsvp-bar-seg{transition:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <div id="not-found" hidden>
    <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Events</a>
    <div class="empty-state"><p>Event not found</p><a href="index.html" class="btn">Back to Manage Events</a></div>
  </div>
  <div id="page-content" hidden>
    <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Events</a>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <div id="success-banner" class="success-banner" role="status"><span id="toast-message">Event updated.</span><button type="button" class="success-banner-dismiss" id="dismiss-success" aria-label="Dismiss">&times;</button></div>
    <div class="action-row">
      <a href="#" class="btn" id="edit-link">Edit</a>
      <button type="button" class="btn btn-danger" id="cancel-event-btn">Cancel Event</button>
    </div>
    <h1 class="detail-title" id="event-title"></h1>
    <p class="detail-meta" id="event-meta"></p>
    <p class="detail-recurring" id="event-recurring" hidden></p>
    <div class="badge-row" id="status-badge-row"></div>
    <div class="detail-card" id="description-section" hidden>
      <h2>Description</h2>
      <div class="detail-body" id="event-description"></div>
    </div>
    <div id="rsvp-section" hidden>
      <h2 class="section-heading">RSVP Summary</h2>
      <p class="rsvp-summary" id="rsvp-summary"></p>
      <div class="rsvp-bar" id="rsvp-bar" role="img" aria-label="RSVP breakdown"></div>
      <h2 class="section-heading">Member Responses</h2>
      <div class="member-list" id="member-list"></div>
    </div>
  </div>
</main>
<div class="modal-backdrop" id="modal-backdrop" hidden></div>
<div class="modal" id="cancel-modal" role="dialog" aria-hidden="true" hidden>
  <h2>Cancel Event?</h2>
  <p>This will cancel the event. Members will no longer see it. This cannot be undone.</p>
  <div class="modal-actions">
    <button type="button" class="modal-cancel" id="cancel-dismiss">Cancel</button>
    <button type="button" class="modal-confirm" id="cancel-confirm">Confirm</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  var eventId=new URLSearchParams(window.location.search).get("id");
  var event=null;
  var supabaseClient=null;

  if(new URLSearchParams(window.location.search).get("updated")==="success"){
    document.getElementById("success-banner").classList.add("visible");
    if(window.history.replaceState)window.history.replaceState({},document.title,window.location.pathname+"?id="+encodeURIComponent(eventId||""));
  }
  document.getElementById("dismiss-success").addEventListener("click",function(){document.getElementById("success-banner").classList.remove("visible");});

  document.title="Event Detail — "+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function formatDate(iso){return new Date(iso).toLocaleString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});}
  function patternLabel(p){return p==="weekly"?"Weekly":p==="monthly"?"Monthly":p==="annually"?"Annually":p;}

  function responseBadge(response){
    if(response==="attending")return'<span class="badge badge-attending">Attending</span>';
    if(response==="not_attending")return'<span class="badge badge-not-attending">Not Attending</span>';
    if(response==="maybe")return'<span class="badge badge-maybe">Maybe</span>';
    return'<span class="badge badge-none">No Response</span>';
  }

  function renderStatusBadge(){
    var scheduled=event.status==="scheduled";
    document.getElementById("status-badge-row").innerHTML=scheduled
      ?'<span class="badge badge-scheduled">Scheduled</span>'
      :'<span class="badge badge-cancelled">Cancelled</span>';
    document.getElementById("cancel-event-btn").hidden=!scheduled;
  }

  function renderEventInfo(){
    document.getElementById("event-title").textContent=event.title;
    document.getElementById("event-meta").textContent=formatDate(event.event_date)+(event.location?" · "+event.location:"");
    document.getElementById("edit-link").href="create.html?id="+encodeURIComponent(event.id);
    document.title=(event.title||"Event")+" — Admin";
    if(event.is_recurring&&event.recurrence_pattern){
      document.getElementById("event-recurring").textContent="Recurring: "+patternLabel(event.recurrence_pattern);
      document.getElementById("event-recurring").hidden=false;
    }
    if(event.description&&event.description.trim()){
      document.getElementById("event-description").textContent=event.description.trim();
      document.getElementById("description-section").hidden=false;
    }
    renderStatusBadge();
  }

  function renderRsvp(members,rsvps){
    var map={};
    rsvps.forEach(function(r){map[r.member_id]=r.response;});
    var counts={attending:0,not_attending:0,maybe:0,none:0};
    members.forEach(function(m){
      var resp=map[m.id];
      if(resp==="attending")counts.attending++;
      else if(resp==="not_attending")counts.not_attending++;
      else if(resp==="maybe")counts.maybe++;
      else counts.none++;
    });
    var total=members.length||1;
    document.getElementById("rsvp-summary").textContent=
      "Attending "+counts.attending+" · Not Attending "+counts.not_attending+" · Maybe "+counts.maybe+" · No Response "+counts.none;
    document.getElementById("rsvp-bar").innerHTML=
      (counts.attending?'<div class="rsvp-bar-seg attending" style="width:'+(counts.attending/total*100)+'%"></div>':"")+
      (counts.not_attending?'<div class="rsvp-bar-seg not-attending" style="width:'+(counts.not_attending/total*100)+'%"></div>':"")+
      (counts.maybe?'<div class="rsvp-bar-seg maybe" style="width:'+(counts.maybe/total*100)+'%"></div>':"")+
      (counts.none?'<div class="rsvp-bar-seg none" style="width:'+(counts.none/total*100)+'%"></div>':"");
    document.getElementById("member-list").innerHTML=members.map(function(m){
      return'<div class="member-row"><span class="name">'+escapeHtml(m.full_name)+'</span>'+responseBadge(map[m.id])+'</div>';
    }).join("");
    document.getElementById("rsvp-section").hidden=false;
  }

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../../index.html");});

  async function adminGuard(){
    if(!supabaseClient||!eventId){return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../../auth/login.html");return null;}
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);
    return p;
  }

  var backdrop=document.getElementById("modal-backdrop"),cancelModal=document.getElementById("cancel-modal");
  function openCancelModal(){cancelModal.hidden=false;backdrop.hidden=false;requestAnimationFrame(function(){cancelModal.classList.add("open");backdrop.classList.add("open");});}
  function closeCancelModal(){cancelModal.classList.remove("open");backdrop.classList.remove("open");setTimeout(function(){cancelModal.hidden=true;backdrop.hidden=true;},200);}

  document.getElementById("cancel-event-btn").addEventListener("click",openCancelModal);
  document.getElementById("cancel-dismiss").addEventListener("click",closeCancelModal);
  backdrop.addEventListener("click",closeCancelModal);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cancelModal.classList.contains("open"))closeCancelModal();});

  document.getElementById("cancel-confirm").addEventListener("click",async function(){
    closeCancelModal();
    var r=await supabaseClient.from("events").update({status:"cancelled"}).eq("id",eventId);
    if(r.error){document.getElementById("error-banner").textContent=r.error.message;document.getElementById("error-banner").classList.add("visible");return;}
    event.status="cancelled";
    renderStatusBadge();
  });

  (async function init(){
    if(!await adminGuard()||!eventId){
      document.getElementById("not-found").hidden=false;revealPage();return;
    }
    var r=await supabaseClient.from("events").select("id, title, event_date, location, description, status, is_recurring, recurrence_pattern, rsvp_required").eq("id",eventId).maybeSingle();
    if(r.error||!r.data){
      document.getElementById("not-found").hidden=false;revealPage();return;
    }
    event=r.data;
    renderEventInfo();

    if(event.rsvp_required){
      var results=await Promise.all([
        supabaseClient.from("profiles").select("id, full_name").eq("status","active").order("full_name",{ascending:true}),
        supabaseClient.from("event_rsvps").select("member_id, response").eq("event_id",eventId)
      ]);
      renderRsvp(results[0].data||[],results[1].data||[]);
    }

    document.getElementById("page-content").hidden=false;
    revealPage();
  })();
})();
</script>
</body>
</html>
