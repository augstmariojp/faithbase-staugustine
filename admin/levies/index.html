<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Levies — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .admin-page{padding:24px 20px 40px;max-width:760px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .page-heading{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--maroon);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap;}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);}
  .success-banner{display:none;position:relative;background:rgba(240,204,92,0.18);border:1px solid rgba(201,162,39,0.45);border-radius:8px;padding:12px 40px 12px 14px;font-size:14px;color:var(--maroon-deep);margin-bottom:20px;}
  .success-banner.visible{display:block;}
  .success-banner-dismiss{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--maroon);font-size:18px;padding:4px;}
  .section-heading{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--maroon);margin-bottom:16px;margin-top:8px;}
  .levy-list{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;}
  .levy-row{display:block;background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-left:3px solid var(--maroon);border-radius:10px;padding:16px 18px;transition:box-shadow .15s ease,transform .15s ease;}
  .levy-row:hover,.levy-row:focus-visible{box-shadow:0 8px 24px -10px rgba(36,16,25,0.15);transform:translateY(-1px);}
  .levy-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .levy-row h3{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--maroon);line-height:1.25;}
  .levy-meta{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .levy-progress{font-size:13px;font-weight:600;color:var(--maroon);margin-top:8px;}
  .badge{flex-shrink:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge-active{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-closed{background:rgba(92,58,68,0.12);color:var(--ink-soft);}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);background:var(--ivory);border:1px solid rgba(107,31,53,0.1);border-radius:10px;}
  .empty-state svg{width:48px;height:48px;color:var(--gold);margin:0 auto 16px;opacity:0.7;display:block;}
  .empty-state p{font-size:15px;margin-bottom:20px;line-height:1.6;}
  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-row{height:96px;border-radius:10px;background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.page-heading{font-size:28px;}.admin-page{padding:20px 16px 32px;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.skeleton-row,.levy-row{animation:none;transition:none;}.btn:hover,.btn:focus-visible,.levy-row:hover,.levy-row:focus-visible{transform:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <a href="../../member/dashboard.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Dashboard</a>
  <div class="page-header"><h1 class="page-heading">Manage Levies</h1><a href="create.html" class="btn">+ New Levy</a></div>
  <div id="success-banner" class="success-banner" role="status">Levy created.<button type="button" class="success-banner-dismiss" id="dismiss-success" aria-label="Dismiss">&times;</button></div>
  <div id="page-loading" class="skeleton-list"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
  <div id="page-content" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  document.title="Manage Levies — "+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});

  if(new URLSearchParams(window.location.search).get("created")==="success"){
    document.getElementById("success-banner").classList.add("visible");
    if(window.history.replaceState)window.history.replaceState({},document.title,window.location.pathname);
  }
  document.getElementById("dismiss-success").addEventListener("click",function(){document.getElementById("success-banner").classList.remove("visible");});

  var supabaseClient=null;
  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function formatNaira(a){return"\u20A6"+Number(a).toLocaleString("en-NG");}
  function formatDate(iso){return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../../index.html");});

  async function adminGuard(){
    if(!supabaseClient){window.location.replace("../../auth/login.html");return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../../auth/login.html");return null;}
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);
    return p;
  }

  function sortLevies(list){
    return list.slice().sort(function(a,b){
      if(a.status!==b.status)return a.status==="active"?-1:1;
      var da=a.due_date?new Date(a.due_date).getTime():Infinity;
      var db=b.due_date?new Date(b.due_date).getTime():Infinity;
      return da-db;
    });
  }

  function renderLevyRow(levy,payCounts,memberCount){
    var paid=payCounts[levy.id]||0;
    var badge=levy.status==="active"?'<span class="badge badge-active">Active</span>':'<span class="badge badge-closed">Closed</span>';
    var dueStr=levy.due_date?formatDate(levy.due_date):"No due date";
    return'<a href="detail.html?id='+encodeURIComponent(levy.id)+'" class="levy-row">'+
      '<div class="levy-row-top"><h3>'+escapeHtml(levy.title)+'</h3>'+badge+'</div>'+
      '<p class="levy-meta">'+escapeHtml(formatNaira(levy.amount))+' &middot; Due '+escapeHtml(dueStr)+'</p>'+
      '<p class="levy-progress">'+paid+'/'+memberCount+' members paid</p></a>';
  }

  function renderSections(levies,payCounts,memberCount){
    var active=[],closed=[];
    sortLevies(levies).forEach(function(l){if(l.status==="active")active.push(l);else closed.push(l);});
    var html="";
    if(!levies.length){
      html='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6"/></svg><p>No levies yet — Create your first levy</p><a href="create.html" class="btn">+ New Levy</a></div>';
    }else{
      if(active.length){
        html+='<h2 class="section-heading">Active</h2><div class="levy-list">'+active.map(function(l){return renderLevyRow(l,payCounts,memberCount);}).join("")+'</div>';
      }
      if(closed.length){
        html+='<h2 class="section-heading">Closed</h2><div class="levy-list">'+closed.map(function(l){return renderLevyRow(l,payCounts,memberCount);}).join("")+'</div>';
      }
      if(!active.length&&!closed.length){
        html='<div class="empty-state"><p>No levies yet — Create your first levy</p><a href="create.html" class="btn">+ New Levy</a></div>';
      }
    }
    document.getElementById("page-content").innerHTML=html;
  }

  (async function init(){
    if(!await adminGuard())return;
    var results=await Promise.all([
      supabaseClient.from("levies").select("id, title, amount, due_date, status"),
      supabaseClient.from("profiles").select("id",{count:"exact",head:true}).eq("status","active"),
      supabaseClient.from("levy_payments").select("levy_id")
    ]);
    var levies=results[0].data||[];
    var memberCount=results[1].count||0;
    var payCounts={};
    (results[2].data||[]).forEach(function(p){payCounts[p.levy_id]=(payCounts[p.levy_id]||0)+1;});
    document.getElementById("page-loading").hidden=true;
    document.getElementById("page-content").hidden=false;
    renderSections(levies,payCounts,memberCount);
    revealPage();
  })();
})();
</script>
</body>
</html>
