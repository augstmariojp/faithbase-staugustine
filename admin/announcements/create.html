<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Announcement — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .admin-page{padding:24px 20px 40px;max-width:560px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .auth-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--maroon);border-radius:10px;padding:32px 28px 36px;box-shadow:0 4px 24px -8px rgba(36,16,25,0.12);}
  .auth-card h1{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--maroon);margin-bottom:24px;text-align:center;}
  .error-banner{display:none;background:rgba(180,35,24,0.08);border:1px solid rgba(180,35,24,0.25);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--error);margin-bottom:20px;}
  .error-banner.visible{display:block;}
  .form-field{margin-bottom:20px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field input,.form-field textarea{width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);background:var(--parchment);border:1px solid rgba(107,31,53,0.2);border-radius:8px;padding:12px 14px;}
  .form-field textarea{min-height:180px;resize:vertical;}
  .form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .form-field input.input-error,.form-field textarea.input-error{border-color:var(--error);}
  .field-hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .field-error{display:none;font-size:12.5px;color:var(--error);margin-top:6px;}
  .field-error.visible{display:block;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:var(--parchment);border-radius:8px;margin-bottom:20px;}
  .toggle-row span{font-size:14px;font-weight:600;color:var(--maroon);}
  .toggle-switch{position:relative;width:52px;height:28px;flex-shrink:0;}
  .toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
  .toggle-slider{position:absolute;inset:0;background:rgba(107,31,53,0.2);border-radius:999px;cursor:pointer;transition:background .2s;}
  .toggle-slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:var(--ivory);border-radius:50%;transition:transform .2s;}
  .toggle-switch input:checked+.toggle-slider{background:var(--gold);}
  .toggle-switch input:checked+.toggle-slider::before{transform:translateX(24px);}
  .form-actions{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .btn{width:100%;font-family:var(--font-body);font-size:15px;font-weight:600;padding:14px 30px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn:disabled{opacity:0.7;cursor:not-allowed;}
  .btn-outline{background:transparent;border:1px solid rgba(107,31,53,0.35);color:var(--maroon);}
  .btn-outline:hover,.btn-outline:focus-visible{background:rgba(107,31,53,0.06);}
  .form-footer{text-align:center;margin-top:18px;font-size:14px;color:var(--ink-soft);}
  .form-footer a{color:var(--maroon);font-weight:600;text-decoration:underline;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state h1{font-family:var(--font-display);font-size:26px;color:var(--maroon);margin-bottom:10px;}
  .empty-state p{font-size:15px;margin-bottom:20px;line-height:1.6;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);z-index:100;background:var(--ivory);border-radius:12px;border-top:3px solid var(--maroon);padding:28px 24px;width:calc(100% - 40px);max-width:480px;max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 20px 48px -12px rgba(36,16,25,0.35);}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:16px;}
  .preview-body{font-size:15px;line-height:1.75;color:var(--ink-soft);}
  .preview-body strong{color:var(--ink);font-weight:600;}
  .modal-actions{display:flex;gap:12px;margin-top:20px;}
  .modal-actions .btn{flex:1;margin-top:0;}
  .modal-cancel{background:transparent;border:1px solid rgba(107,31,53,0.3)!important;color:var(--maroon);box-shadow:none;}
  .spinner{width:16px;height:16px;border:2px solid rgba(62,15,28,0.2);border-top-color:var(--maroon-deep);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}}
  @media (prefers-reduced-motion:reduce){.spinner,.modal,.modal-backdrop,.toggle-slider,.toggle-slider::before{animation:none;transition:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><picture><source srcset="../../assets/st-augustine-choir-crest.webp" type="image/webp"><img src="../../assets/st-augustine-choir-crest.png" alt="" class="brand-mark-img"></picture><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Announcements</a>
  <div id="not-found" hidden>
    <div class="empty-state">
      <h1>Announcement not found</h1>
      <p>This announcement may have been removed or the link is no longer valid.</p>
      <a href="index.html" class="btn">Back to Manage Announcements</a>
    </div>
  </div>
  <div class="auth-card" id="form-card" hidden>
    <h1 id="page-title">New Announcement</h1>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <form id="announcement-form" novalidate>
      <div class="form-field"><label for="title">Title</label><input type="text" id="title" required><p class="field-error" id="error-title"></p></div>
      <div class="form-field">
        <label for="body">Body</label>
        <textarea id="body" required></textarea>
        <p class="field-hint">Use **text** for bold. Line breaks are preserved.</p>
        <p class="field-error" id="error-body"></p>
      </div>
      <div class="toggle-row">
        <span>Pin to Notice Board</span>
        <label class="toggle-switch"><input type="checkbox" id="is-pinned" aria-label="Pin to Notice Board"><span class="toggle-slider"></span></label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" id="preview-btn">Preview</button>
        <button type="submit" class="btn" id="submit-btn">Publish Announcement</button>
      </div>
      <p class="form-footer"><a href="index.html">Cancel</a></p>
    </form>
  </div>
</main>
<div class="modal-backdrop" id="modal-backdrop" hidden></div>
<div class="modal" id="preview-modal" role="dialog" aria-labelledby="preview-title" aria-hidden="true" hidden>
  <h2 id="preview-title"></h2>
  <div class="preview-body" id="preview-body"></div>
  <div class="modal-actions"><button type="button" class="btn modal-cancel" id="preview-close">Close</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  var editId=new URLSearchParams(window.location.search).get("id");
  var isEdit=!!editId;
  var supabaseClient=null,currentUserId=null;

  var fields=[
    {id:"title",errorId:"error-title",validate:function(i){return!i.value.trim()?"This field is required.":"";}},
    {id:"body",errorId:"error-body",validate:function(i){return!i.value.trim()?"This field is required.":"";}}
  ];

  function showFieldError(fid,eid,msg){var inp=document.getElementById(fid),el=document.getElementById(eid);if(msg){inp.classList.add("input-error");el.textContent=msg;el.classList.add("visible");}else{inp.classList.remove("input-error");el.textContent="";el.classList.remove("visible");}}
  fields.forEach(function(f){document.getElementById(f.id).addEventListener("blur",function(){showFieldError(f.id,f.errorId,f.validate(this));});});

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function formatBody(raw){
    var escaped=escapeHtml(raw||"");
    escaped=escaped.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    escaped=escaped.replace(/\n/g,"<br>");
    escaped=escaped.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    return escaped;
  }

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../../index.html");});

  async function adminGuard(){
    if(!supabaseClient){window.location.replace("../../auth/login.html");return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../../auth/login.html");return null;}
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);
    currentUserId=session.user.id;return p;
  }

  var backdrop=document.getElementById("modal-backdrop"),previewModal=document.getElementById("preview-modal");
  function openPreview(){
    var title=document.getElementById("title").value.trim();
    if(!title){showFieldError("title","error-title","This field is required.");return;}
    document.getElementById("preview-title").textContent=title;
    document.getElementById("preview-body").innerHTML=formatBody(document.getElementById("body").value);
    previewModal.hidden=false;backdrop.hidden=false;
    requestAnimationFrame(function(){previewModal.classList.add("open");backdrop.classList.add("open");previewModal.setAttribute("aria-hidden","false");});
  }
  function closePreview(){
    previewModal.classList.remove("open");backdrop.classList.remove("open");previewModal.setAttribute("aria-hidden","true");
    setTimeout(function(){previewModal.hidden=true;backdrop.hidden=true;},200);
  }
  document.getElementById("preview-btn").addEventListener("click",openPreview);
  document.getElementById("preview-close").addEventListener("click",closePreview);
  backdrop.addEventListener("click",closePreview);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&previewModal.classList.contains("open"))closePreview();});

  document.getElementById("announcement-form").addEventListener("submit",async function(e){
    e.preventDefault();
    var errBanner=document.getElementById("error-banner");
    errBanner.classList.remove("visible");
    var valid=true;
    fields.forEach(function(f){var msg=f.validate(document.getElementById(f.id));showFieldError(f.id,f.errorId,msg);if(msg)valid=false;});
    if(!valid)return;

    var btn=document.getElementById("submit-btn");
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Saving\u2026';
    var payload={
      title:document.getElementById("title").value.trim(),
      body:document.getElementById("body").value.trim(),
      is_pinned:document.getElementById("is-pinned").checked
    };

    var r;
    if(isEdit){
      r=await supabaseClient.from("announcements").update(payload).eq("id",editId);
    }else{
      payload.created_by=currentUserId;
      r=await supabaseClient.from("announcements").insert(payload);
    }

    btn.disabled=false;btn.textContent=isEdit?"Update Announcement":"Publish Announcement";
    if(r.error){errBanner.textContent=r.error.message||"Something went wrong.";errBanner.classList.add("visible");return;}
    if(isEdit)window.location.replace("detail.html?id="+encodeURIComponent(editId)+"&updated=success");
    else window.location.replace("index.html?created=success");
  });

  (async function init(){
    if(!await adminGuard())return;
    if(isEdit){
      document.getElementById("page-title").textContent="Edit Announcement";
      document.getElementById("submit-btn").textContent="Update Announcement";
      document.title="Edit Announcement — "+FAITHBASE_CONFIG.communityName;
      var r=await supabaseClient.from("announcements").select("title, body, is_pinned").eq("id",editId).maybeSingle();
      if(r.error||!r.data){document.getElementById("not-found").hidden=false;revealPage();return;}
      document.getElementById("title").value=r.data.title||"";
      document.getElementById("body").value=r.data.body||"";
      document.getElementById("is-pinned").checked=!!r.data.is_pinned;
    }else{
      document.title="New Announcement — "+FAITHBASE_CONFIG.communityName;
    }
    document.getElementById("form-card").hidden=false;
    revealPage();
  })();
})();
</script>
</body>
</html>
