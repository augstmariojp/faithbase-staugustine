<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Document — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);}
  .header-avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--gold-bright);color:var(--maroon-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-size:12px;font-weight:700;
    flex-shrink:0;
  }
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .admin-page{padding:24px 20px 40px;max-width:560px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .auth-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--maroon);border-radius:10px;padding:32px 28px 36px;box-shadow:0 4px 24px -8px rgba(36,16,25,0.12);}
  .auth-card h1{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--maroon);margin-bottom:24px;text-align:center;}
  .error-banner{display:none;background:rgba(180,35,24,0.08);border:1px solid rgba(180,35,24,0.25);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--error);margin-bottom:20px;line-height:1.55;}
  .error-banner.visible{display:block;}
  .form-field{margin-bottom:20px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field input[type="text"],.form-field select,.form-field input[type="file"]{width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);background:var(--parchment);border:1px solid rgba(107,31,53,0.2);border-radius:8px;padding:12px 14px;}
  .form-field input[type="file"]{padding:10px 12px;cursor:pointer;}
  .form-field input:focus,.form-field select:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .form-field input.input-error{border-color:var(--error);}
  .field-error{display:none;font-size:12.5px;color:var(--error);margin-top:6px;}
  .field-error.visible{display:block;}
  .file-info{font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .file-info strong{color:var(--ink);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:var(--parchment);border-radius:8px;margin-bottom:20px;}
  .toggle-row span{font-size:14px;font-weight:600;color:var(--maroon);}
  .toggle-switch{position:relative;width:52px;height:28px;flex-shrink:0;}
  .toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
  .toggle-slider{position:absolute;inset:0;background:rgba(107,31,53,0.2);border-radius:999px;cursor:pointer;transition:background .2s;}
  .toggle-slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:var(--ivory);border-radius:50%;transition:transform .2s;}
  .toggle-switch input:checked+.toggle-slider{background:var(--gold);}
  .toggle-switch input:checked+.toggle-slider::before{transform:translateX(24px);}
  .btn{width:100%;font-family:var(--font-body);font-size:15px;font-weight:600;padding:14px 30px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
  .btn:disabled{opacity:0.7;cursor:not-allowed;}
  .spinner{width:16px;height:16px;border:2px solid rgba(62,15,28,0.2);border-top-color:var(--maroon-deep);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}}
  @media (prefers-reduced-motion:reduce){.spinner,.toggle-slider,.toggle-slider::before{animation:none;transition:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><picture><source srcset="../../assets/st-augustine-choir-crest.webp" type="image/webp"><img src="../../assets/st-augustine-choir-crest.png" alt="" class="brand-mark-img"></picture><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><span class="header-avatar" id="header-avatar" aria-hidden="true"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Documents</a>
  <div class="auth-card" id="form-card" hidden>
    <h1>Upload Document</h1>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <form id="upload-form" novalidate>
      <div class="form-field">
        <label for="file">File</label>
        <input type="file" id="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">
        <p class="file-info" id="file-info" hidden></p>
        <p class="field-error" id="error-file"></p>
      </div>
      <div class="form-field">
        <label for="title">Document Title</label>
        <input type="text" id="title" required>
        <p class="field-error" id="error-title"></p>
      </div>
      <div class="form-field">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">Select a category&hellip;</option>
          <option value="constitution">Constitution</option>
          <option value="minutes">Minutes</option>
          <option value="financial">Financial</option>
          <option value="correspondence">Correspondence</option>
          <option value="certificate">Certificate</option>
          <option value="other">Other</option>
        </select>
        <p class="field-error" id="error-category"></p>
      </div>
      <div class="toggle-row">
        <span id="access-label">All Members</span>
        <label class="toggle-switch">
          <input type="checkbox" id="executives-only" aria-label="Executives Only access">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <button type="submit" class="btn" id="submit-btn">Upload</button>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  document.title="Upload Document — "+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});

  var supabaseClient=null,adminId=null,selectedFile=null;
  var MAX_BYTES=10*1024*1024;
  var ALLOWED_EXT=["pdf","doc","docx","xls","xlsx","jpg","jpeg","png"];

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function getInitials(name){
    if (!name || !name.trim()) return '?';
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }
  function revealPage(){document.body.classList.remove("checking-session");}
  function formatFileSize(bytes){if(!bytes)return"\u2014";if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";return(bytes/(1024*1024)).toFixed(1)+" MB";}
  function showFieldError(id,msg){var el=document.getElementById(id);if(msg){el.textContent=msg;el.classList.add("visible");}else{el.textContent="";el.classList.remove("visible");}}
  function clearErrors(){showFieldError("error-file","");showFieldError("error-title","");showFieldError("error-category","");document.getElementById("error-banner").classList.remove("visible");}

  function getExtension(name){
    var parts=name.split(".");
    return parts.length>1?parts.pop().toLowerCase():"";
  }

  function sanitizeFilename(name){
    return name.replace(/[^a-zA-Z0-9.\-]/g,"");
  }

  function validateFile(file){
    if(!file)return "Please select a file.";
    var ext=getExtension(file.name);
    if(ALLOWED_EXT.indexOf(ext)===-1)return "File type not allowed. Use PDF, Word, Excel, or image files.";
    if(file.size>MAX_BYTES)return "File must be 10 MB or smaller.";
    return "";
  }

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../../index.html");});

  async function adminGuard(){
    if(!supabaseClient){window.location.replace("../../auth/login.html");return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../../auth/login.html");return null;}
    adminId=session.user.id;
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);

    document.getElementById('header-avatar').textContent = getInitials(p.full_name);
    return p;
  }

  document.getElementById("executives-only").addEventListener("change",function(){
    document.getElementById("access-label").textContent=this.checked?"Executives Only":"All Members";
  });

  document.getElementById("file").addEventListener("change",function(){
    selectedFile=this.files&&this.files[0]?this.files[0]:null;
    var info=document.getElementById("file-info");
    showFieldError("error-file","");
    document.getElementById("file").classList.remove("input-error");
    if(!selectedFile){info.hidden=true;return;}
    var err=validateFile(selectedFile);
    info.innerHTML="<strong>"+selectedFile.name.replace(/</g,"&lt;")+"</strong> &middot; "+formatFileSize(selectedFile.size);
    info.hidden=false;
    if(err){showFieldError("error-file",err);document.getElementById("file").classList.add("input-error");}
  });

  document.getElementById("upload-form").addEventListener("submit",async function(e){
    e.preventDefault();
    clearErrors();
    var title=document.getElementById("title").value.trim();
    var category=document.getElementById("category").value;
    var executivesOnly=document.getElementById("executives-only").checked;
    var valid=true;

    if(!selectedFile){showFieldError("error-file","Please select a file.");valid=false;}
    else{
      var fileErr=validateFile(selectedFile);
      if(fileErr){showFieldError("error-file",fileErr);document.getElementById("file").classList.add("input-error");valid=false;}
    }
    if(!title){showFieldError("error-title","Document title is required.");valid=false;}
    if(!category){showFieldError("error-category","Please select a category.");valid=false;}
    if(!valid)return;

    var accessLevel=executivesOnly?"executives_only":"all_members";
    var folder=executivesOnly?"executives-only":"all-members";
    var storagePath=folder+"/"+Date.now()+"-"+sanitizeFilename(selectedFile.name);

    var btn=document.getElementById("submit-btn");
    btn.disabled=true;
    btn.innerHTML='<span class="spinner" aria-hidden="true"></span> Uploading\u2026';

    var uploadResult=await supabaseClient.storage.from("documents").upload(storagePath,selectedFile);
    if(uploadResult.error){
      btn.disabled=false;btn.textContent="Upload";
      document.getElementById("error-banner").textContent=uploadResult.error.message||"Upload failed.";
      document.getElementById("error-banner").classList.add("visible");
      return;
    }

    var insertResult=await supabaseClient.from("documents").insert({
      title:title,
      category:category,
      file_url:storagePath,
      file_name:selectedFile.name,
      file_size:selectedFile.size,
      access_level:accessLevel,
      uploaded_by:adminId
    });

    if(insertResult.error){
      btn.disabled=false;btn.textContent="Upload";
      document.getElementById("error-banner").textContent=
        "The file was uploaded to storage, but the database record failed to save. Please contact support or try uploading again. Storage path: "+storagePath;
      document.getElementById("error-banner").classList.add("visible");
      return;
    }

    window.location.replace("index.html?created=success");
  });

  (async function init(){
    if(!await adminGuard())return;
    document.getElementById("form-card").hidden=false;
    revealPage();
  })();
})();
</script>
</body>
</html>
