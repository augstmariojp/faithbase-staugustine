<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welfare Fund Ledger — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;white-space:nowrap;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .admin-page{padding:24px 20px 40px;max-width:860px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-heading{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--maroon);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap;}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);}
  .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;box-shadow:none;}
  .success-banner{display:none;position:relative;background:rgba(240,204,92,0.18);border:1px solid rgba(201,162,39,0.45);border-radius:8px;padding:12px 40px 12px 14px;font-size:14px;color:var(--maroon-deep);margin-bottom:20px;}
  .success-banner.visible{display:block;}
  .success-banner-dismiss{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--maroon);font-size:18px;padding:4px;}
  .balance-card{background:var(--ivory);border:1px solid var(--gold);border-radius:10px;padding:24px 22px;margin-bottom:24px;text-align:center;box-shadow:0 4px 24px -8px rgba(201,162,39,0.18);}
  .balance-card .balance-label{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:8px;}
  .balance-card .balance-amount{font-size:clamp(28px,6vw,36px);font-weight:700;color:var(--ink);letter-spacing:0.01em;}
  .ledger-list{display:flex;flex-direction:column;gap:10px;}
  .ledger-row{
    display:grid;grid-template-columns:minmax(90px,auto) auto 1fr auto;
    gap:10px 14px;align-items:start;
    background:var(--ivory);border:1px solid rgba(107,31,53,0.12);
    border-left:3px solid var(--maroon);border-radius:10px;padding:14px 16px;
  }
  .ledger-date{font-size:13px;font-weight:600;color:var(--ink-soft);line-height:1.4;}
  .ledger-amount{font-size:15px;font-weight:700;white-space:nowrap;}
  .ledger-amount.credit{color:var(--success);}
  .ledger-amount.debit{color:var(--error);}
  .ledger-desc{font-size:14px;color:var(--ink);line-height:1.5;min-width:0;}
  .ledger-linked{font-size:12px;color:var(--ink-soft);margin-top:4px;font-style:italic;}
  .ledger-balance{font-size:14px;font-weight:700;color:var(--maroon);text-align:right;white-space:nowrap;align-self:center;}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-block;}
  .badge-credit{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-debit{background:rgba(180,35,24,0.1);color:var(--error);}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);background:var(--ivory);border:1px solid rgba(107,31,53,0.1);border-radius:10px;}
  .empty-state p{font-size:15px;line-height:1.6;}
  .skeleton-list{display:flex;flex-direction:column;gap:10px;}
  .skeleton-row{height:72px;border-radius:10px;background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);z-index:100;background:var(--ivory);border-radius:12px;border-top:3px solid var(--maroon);padding:28px 24px;width:calc(100% - 40px);max-width:440px;max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 20px 48px -12px rgba(36,16,25,0.35);}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:16px;}
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field input,.form-field select{width:100%;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(107,31,53,0.2);border-radius:8px;background:var(--parchment);}
  .form-field input:focus,.form-field select:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .field-error{display:none;font-size:12.5px;color:var(--error);margin-top:6px;}
  .field-error.visible{display:block;}
  .type-segment{display:flex;border:1px solid rgba(107,31,53,0.2);border-radius:999px;overflow:hidden;background:var(--parchment);}
  .type-segment button{flex:1;padding:11px 12px;border:none;background:transparent;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .type-segment button.active{background:var(--maroon);color:var(--ivory);}
  .type-segment button:focus-visible{outline:3px solid var(--gold-bright);outline-offset:-3px;z-index:1;}
  .modal-actions{display:flex;gap:12px;margin-top:8px;}
  .modal-actions .btn{flex:1;margin-top:0;}
  .modal-cancel{background:transparent!important;border:1px solid rgba(107,31,53,0.3)!important;color:var(--maroon)!important;box-shadow:none!important;transform:none!important;}
  .error-banner{display:none;background:rgba(180,35,24,0.08);border:1px solid rgba(180,35,24,0.25);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--error);margin-bottom:16px;}
  .error-banner.visible{display:block;}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){
    .site-header{padding:14px 18px;}.admin-page{padding:20px 16px 32px;}.page-heading{font-size:28px;}
    .ledger-row{grid-template-columns:1fr auto;grid-template-rows:auto auto auto;}
    .ledger-date{grid-column:1;}.ledger-balance{grid-column:2;grid-row:1;}
    .ledger-amount{grid-column:1;}.ledger-desc{grid-column:1/-1;}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.skeleton-row,.modal,.modal-backdrop{animation:none;transition:none;}.btn:hover,.btn:focus-visible{transform:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><picture><source srcset="../../assets/st-augustine-choir-crest.webp" type="image/webp"><img src="../../assets/st-augustine-choir-crest.png" alt="" class="brand-mark-img"></picture><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Manage Welfare</a>
  <div class="page-header">
    <h1 class="page-heading">Welfare Fund Ledger</h1>
    <button type="button" class="btn" id="add-tx-btn">Add Transaction</button>
  </div>
  <div id="success-banner" class="success-banner" role="status">Transaction recorded.<button type="button" class="success-banner-dismiss" id="dismiss-success" aria-label="Dismiss">&times;</button></div>
  <div class="balance-card">
    <p class="balance-label">Welfare Fund Balance</p>
    <p class="balance-amount" id="balance-amount">&mdash;</p>
  </div>
  <div id="ledger-loading" class="skeleton-list"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
  <div id="ledger-content" hidden></div>
</main>
<div class="modal-backdrop" id="modal-backdrop" hidden></div>
<div class="modal" id="tx-modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true" hidden>
  <h2 id="modal-title">Add Transaction</h2>
  <div id="modal-error" class="error-banner" role="alert"></div>
  <div class="form-field">
    <label>Type</label>
    <div class="type-segment" role="group" aria-label="Transaction type">
      <button type="button" class="active" id="type-credit" data-type="credit">Credit</button>
      <button type="button" id="type-debit" data-type="debit">Debit</button>
    </div>
  </div>
  <div class="form-field">
    <label for="tx-amount">Amount</label>
    <input type="number" id="tx-amount" min="0" step="1" required>
    <p class="field-error" id="error-amount"></p>
  </div>
  <div class="form-field">
    <label for="tx-description">Description</label>
    <input type="text" id="tx-description" required>
    <p class="field-error" id="error-description"></p>
  </div>
  <div class="form-field" id="case-link-field" hidden>
    <label for="tx-case">Link to Welfare Case <span style="font-weight:400;color:var(--ink-soft)">(optional)</span></label>
    <select id="tx-case"><option value="">No case linked</option></select>
  </div>
  <div class="modal-actions">
    <button type="button" class="btn modal-cancel" id="modal-cancel-btn">Cancel</button>
    <button type="button" class="btn" id="modal-save-btn">Save Transaction</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  document.title="Welfare Fund Ledger — "+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});
  document.getElementById("dismiss-success").addEventListener("click",function(){document.getElementById("success-banner").classList.remove("visible");});

  var supabaseClient=null,adminId=null,transactions=[],linkableCases=[],selectedType="credit";

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function formatNaira(a){return"\u20A6"+Number(a).toLocaleString("en-NG");}
  function formatDate(iso){return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
  function typeLabel(t){return t==="sick"?"Sick":t==="bereaved"?"Bereaved":t==="celebrating"?"Celebrating":t==="other"?"Other":t||"";}
  function memberName(c){var p=c.profiles;return Array.isArray(p)?(p[0]&&p[0].full_name)||"Unknown":(p&&p.full_name)||"Unknown";}
  function caseType(tx){var wc=tx.welfare_cases;return Array.isArray(wc)?(wc[0]&&wc[0].welfare_type)||null:(wc&&wc.welfare_type)||null;}

  function computeBalance(rows){
    return(rows||[]).reduce(function(sum,r){
      if(r.transaction_type==="credit")return sum+Number(r.amount);
      if(r.transaction_type==="debit")return sum-Number(r.amount);
      return sum;
    },0);
  }

  function buildRunningBalances(rows){
    var asc=rows.slice().sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);});
    var running=0;
    var mapped=asc.map(function(tx){
      if(tx.transaction_type==="credit")running+=Number(tx.amount);
      else running-=Number(tx.amount);
      return Object.assign({},tx,{runningBalance:running});
    });
    return mapped.reverse();
  }

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../../index.html");});

  async function adminGuard(){
    if(!supabaseClient){window.location.replace("../../auth/login.html");return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../../auth/login.html");return null;}
    adminId=session.user.id;
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);
    return p;
  }

  function renderLedger(){
    document.getElementById("ledger-loading").hidden=true;
    var content=document.getElementById("ledger-content");
    content.hidden=false;
    document.getElementById("balance-amount").textContent=formatNaira(computeBalance(transactions));

    if(!transactions.length){
      content.innerHTML='<div class="empty-state"><p>No transactions recorded yet.</p></div>';
      return;
    }

    var display=buildRunningBalances(transactions);
    content.innerHTML='<div class="ledger-list">'+display.map(function(tx){
      var isCredit=tx.transaction_type==="credit";
      var linkedType=caseType(tx);
      var prefix=isCredit?"+":"\u2212";
      return'<div class="ledger-row">'+
        '<div class="ledger-date">'+escapeHtml(formatDate(tx.created_at))+'</div>'+
        '<div><span class="badge '+(isCredit?"badge-credit":"badge-debit")+'">'+(isCredit?"Credit":"Debit")+'</span></div>'+
        '<div class="ledger-desc">'+
        '<div class="ledger-amount '+(isCredit?"credit":"debit")+'">'+prefix+escapeHtml(formatNaira(tx.amount))+'</div>'+
        '<div>'+escapeHtml(tx.description||"")+'</div>'+
        (linkedType?'<div class="ledger-linked">Linked to: '+escapeHtml(typeLabel(linkedType))+' case</div>':"")+
        '</div>'+
        '<div class="ledger-balance">'+escapeHtml(formatNaira(tx.runningBalance))+'</div>'+
        '</div>';
    }).join("")+'</div>';
  }

  async function fetchLedger(){
    document.getElementById("ledger-loading").hidden=false;
    document.getElementById("ledger-content").hidden=true;
    var r=await supabaseClient.from("welfare_fund")
      .select("id, transaction_type, amount, description, created_at, welfare_cases(welfare_type)")
      .order("created_at",{ascending:true});
    transactions=r.data||[];
    renderLedger();
  }

  async function fetchLinkableCases(){
    var r=await supabaseClient.from("welfare_cases")
      .select("id, welfare_type, profiles(full_name)")
      .in("status",["open","visited"])
      .order("created_at",{ascending:false});
    linkableCases=r.data||[];
    var sel=document.getElementById("tx-case");
    sel.innerHTML='<option value="">No case linked</option>'+
      linkableCases.map(function(c){
        return'<option value="'+escapeHtml(c.id)+'">'+escapeHtml(memberName(c))+" \u2014 "+escapeHtml(typeLabel(c.welfare_type))+'</option>';
      }).join("");
  }

  var backdrop=document.getElementById("modal-backdrop"),modal=document.getElementById("tx-modal");
  function openModal(){
    document.getElementById("modal-error").classList.remove("visible");
    showFieldError("error-amount","");showFieldError("error-description","");
    document.getElementById("tx-amount").value="";
    document.getElementById("tx-description").value="";
    document.getElementById("tx-case").value="";
    setTxType("credit");
    modal.hidden=false;backdrop.hidden=false;
    requestAnimationFrame(function(){modal.classList.add("open");backdrop.classList.add("open");modal.setAttribute("aria-hidden","false");});
    fetchLinkableCases();
  }
  function closeModal(){
    modal.classList.remove("open");backdrop.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
    setTimeout(function(){modal.hidden=true;backdrop.hidden=true;},200);
  }

  function setTxType(type){
    selectedType=type;
    document.getElementById("type-credit").classList.toggle("active",type==="credit");
    document.getElementById("type-debit").classList.toggle("active",type==="debit");
    document.getElementById("case-link-field").hidden=type!=="debit";
  }

  document.getElementById("type-credit").addEventListener("click",function(){setTxType("credit");});
  document.getElementById("type-debit").addEventListener("click",function(){setTxType("debit");});
  document.getElementById("add-tx-btn").addEventListener("click",openModal);
  document.getElementById("modal-cancel-btn").addEventListener("click",closeModal);
  backdrop.addEventListener("click",closeModal);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modal.classList.contains("open"))closeModal();});

  function showFieldError(id,msg){
    var el=document.getElementById(id);
    if(msg){el.textContent=msg;el.classList.add("visible");}
    else{el.textContent="";el.classList.remove("visible");}
  }

  document.getElementById("modal-save-btn").addEventListener("click",async function(){
    document.getElementById("modal-error").classList.remove("visible");
    showFieldError("error-amount","");showFieldError("error-description","");
    var amount=Number(document.getElementById("tx-amount").value);
    var description=document.getElementById("tx-description").value.trim();
    var valid=true;
    if(!document.getElementById("tx-amount").value.trim()||isNaN(amount)||amount<0){
      showFieldError("error-amount","Enter a valid amount.");valid=false;
    }
    if(!description){showFieldError("error-description","Description is required.");valid=false;}
    if(!valid)return;

    var caseId=selectedType==="debit"?document.getElementById("tx-case").value||null:null;
    var btn=document.getElementById("modal-save-btn");
    btn.disabled=true;btn.textContent="Saving\u2026";

    var row={
      transaction_type:selectedType,
      amount:amount,
      description:description,
      welfare_case_id:caseId,
      recorded_by:adminId
    };

    var r=await supabaseClient.from("welfare_fund").insert(row);
    btn.disabled=false;btn.textContent="Save Transaction";

    if(r.error){
      document.getElementById("modal-error").textContent=r.error.message;
      document.getElementById("modal-error").classList.add("visible");
      return;
    }

    closeModal();
    document.getElementById("success-banner").classList.add("visible");
    await fetchLedger();
  });

  (async function init(){
    if(!await adminGuard())return;
    await fetchLedger();
    revealPage();
  })();
})();
</script>
</body>
</html>
