<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Detail — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1C;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;}
  .admin-page{padding:24px 20px 40px;max-width:760px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .detail-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--maroon);border-radius:10px;padding:22px 24px;margin-bottom:20px;}
  .detail-card h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:14px;}
  .detail-title{font-family:var(--font-display);font-size:clamp(26px,5vw,32px);font-weight:600;color:var(--maroon);margin-bottom:10px;line-height:1.15;}
  .detail-meta{font-size:15px;color:var(--ink-soft);line-height:1.65;margin-bottom:4px;}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .summary-stat{text-align:center;padding:12px 8px;background:var(--parchment);border-radius:8px;}
  .summary-stat .num{font-size:22px;font-weight:700;color:var(--maroon);display:block;}
  .summary-stat .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-top:4px;}
  .quorum-status{font-size:14px;font-weight:700;padding:10px 14px;border-radius:8px;text-align:center;margin-bottom:16px;}
  .quorum-status.met{background:rgba(45,106,79,0.12);color:var(--success);}
  .quorum-status.not-met{background:rgba(180,35,24,0.1);color:var(--error);}
  .attendance-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;}
  .attendance-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--parchment);border-radius:8px;}
  .attendance-item span{font-size:15px;font-weight:500;}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge-present{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-absent{background:rgba(180,35,24,0.1);color:var(--error);}
  .badge-excused{background:rgba(183,121,31,0.15);color:var(--amber);}
  .no-attendance{text-align:center;padding:24px 16px;color:var(--ink-soft);}
  .no-attendance p{margin-bottom:16px;font-size:15px;line-height:1.6;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);}
  .btn-outline{background:transparent;border:1px solid rgba(107,31,53,0.35);color:var(--maroon);}
  .btn-danger{background:var(--maroon);color:var(--ivory);}
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field textarea{width:100%;min-height:160px;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(107,31,53,0.2);border-radius:8px;background:var(--parchment);resize:vertical;}
  .form-field textarea:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;padding:12px 14px;background:var(--parchment);border-radius:8px;}
  .toggle-row span{font-size:14px;font-weight:500;color:var(--ink-soft);}
  .toggle-row span.active-label{color:var(--maroon);font-weight:600;}
  .toggle-switch{position:relative;width:52px;height:28px;flex-shrink:0;}
  .toggle-switch input{opacity:0;width:0;height:0;}
  .toggle-slider{position:absolute;inset:0;background:rgba(107,31,53,0.2);border-radius:999px;cursor:pointer;transition:background .2s;}
  .toggle-slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:var(--ivory);border-radius:50%;transition:transform .2s;}
  .toggle-switch input:checked+.toggle-slider{background:var(--gold);}
  .toggle-switch input:checked+.toggle-slider::before{transform:translateX(24px);}
  .complete-section{margin-top:8px;padding-top:20px;border-top:1px solid rgba(107,31,53,0.12);}
  .complete-note{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:14px;line-height:1.55;}
  .error-banner{display:none;background:rgba(180,35,24,0.08);border:1px solid rgba(180,35,24,0.25);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--error);margin-bottom:16px;}
  .error-banner.visible{display:block;}
  .success-banner{display:none;background:rgba(240,204,92,0.18);border:1px solid rgba(201,162,39,0.45);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--maroon-deep);margin-bottom:16px;}
  .success-banner.visible{display:block;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);z-index:100;background:var(--ivory);border-radius:12px;border-top:3px solid var(--maroon);padding:28px 24px;width:calc(100% - 40px);max-width:400px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:12px;}
  .modal p{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:24px;}
  .modal-actions{display:flex;gap:12px;}
  .modal-actions button{flex:1;padding:14px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;border:none;}
  .modal-cancel{background:transparent;border:1px solid rgba(107,31,53,0.3)!important;color:var(--maroon);}
  .modal-confirm{background:var(--gold-bright);color:var(--maroon-deep);}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){.summary-grid{grid-template-columns:1fr 1fr;}.site-header{padding:14px 18px;}}
  @media (prefers-reduced-motion:reduce){.modal,.modal-backdrop,.toggle-slider,.toggle-slider::before{transition:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Meetings</a>
  <div id="error-banner" class="error-banner" role="alert"></div>
  <div id="success-banner" class="success-banner" role="status"></div>
  <div id="page-content" hidden>
    <div class="detail-card">
      <h1 class="detail-title" id="meeting-title"></h1>
      <p class="detail-meta" id="meeting-meta"></p>
    </div>
    <div id="attendance-section"></div>
    <div class="detail-card">
      <h2>Minutes</h2>
      <div class="form-field"><label for="minutes">Meeting minutes</label><textarea id="minutes" placeholder="Write minutes here…"></textarea></div>
      <div class="toggle-row">
        <span id="publish-label-draft" class="active-label">Draft (admins only)</span>
        <label class="toggle-switch"><input type="checkbox" id="minutes-published" aria-label="Publish minutes to members"><span class="toggle-slider"></span></label>
        <span id="publish-label-live">Published (visible to all members)</span>
      </div>
      <button type="button" class="btn" id="save-minutes-btn">Save Minutes</button>
    </div>
    <div class="detail-card complete-section" id="complete-section" hidden>
      <p class="complete-note">This marks the meeting as finished and moves it to Past for members.</p>
      <button type="button" class="btn btn-danger" id="complete-btn">Mark Meeting Complete</button>
    </div>
  </div>
</main>
<div class="modal-backdrop" id="modal-backdrop" hidden></div>
<div class="modal" id="confirm-modal" role="dialog" aria-hidden="true" hidden>
  <h2>Mark Complete?</h2>
  <p>This is a one-way action. The meeting will move to Past for all members.</p>
  <div class="modal-actions"><button type="button" class="modal-cancel" id="modal-cancel">Cancel</button><button type="button" class="modal-confirm" id="modal-confirm">Confirm</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  var meetingId=new URLSearchParams(window.location.search).get("id");
  var supabaseClient=null,meeting=null;

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function formatDate(iso){return new Date(iso).toLocaleString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).replace(",","");}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function badge(s){var cls="badge-present",lbl="Present";if(s==="absent"){cls="badge-absent";lbl="Absent";}else if(s==="excused"){cls="badge-excused";lbl="Excused";}return'<span class="badge '+cls+'">'+lbl+'</span>';}

  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});
  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../../index.html");});

  async function adminGuard(){
    if(!supabaseClient||!meetingId){window.location.replace("../../auth/login.html");return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../../auth/login.html");return null;}
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);
    return p;
  }

  function updatePublishLabels(){
    var pub=document.getElementById("minutes-published").checked;
    document.getElementById("publish-label-draft").classList.toggle("active-label",!pub);
    document.getElementById("publish-label-live").classList.toggle("active-label",pub);
  }
  document.getElementById("minutes-published").addEventListener("change",updatePublishLabels);

  function renderAttendance(attRows){
    var section=document.getElementById("attendance-section");
    if(!attRows.length){
      section.innerHTML='<div class="detail-card"><div class="no-attendance"><p>Attendance has not been recorded for this meeting yet.</p><a href="attendance.html?id='+encodeURIComponent(meetingId)+'" class="btn">Take Attendance</a></div></div>';
      return;
    }
    var present=0,absent=0,excused=0;
    attRows.forEach(function(r){if(r.status==="present")present++;else if(r.status==="absent")absent++;else if(r.status==="excused")excused++;});
    var total=attRows.length,rate=total?Math.round((present/total)*100):0;
    var quorumHtml="";
    if(meeting.quorum_required!=null){
      var met=present>=meeting.quorum_required;
      quorumHtml='<div class="quorum-status '+(met?"met":"not-met")+'">Quorum '+(met?"Met":"Not Met")+' ('+present+' / '+meeting.quorum_required+' required)</div>';
    }
    section.innerHTML='<div class="detail-card"><h2>Attendance Summary</h2>'+quorumHtml+
      '<div class="summary-grid"><div class="summary-stat"><span class="num">'+present+'</span><span class="lbl">Present</span></div><div class="summary-stat"><span class="num">'+absent+'</span><span class="lbl">Absent</span></div><div class="summary-stat"><span class="num">'+excused+'</span><span class="lbl">Excused</span></div></div>'+
      '<p style="font-size:14px;color:var(--ink-soft);margin-bottom:16px;font-weight:600;">Attendance rate: '+rate+'%</p>'+
      '<div class="attendance-list">'+attRows.map(function(r){
        var name=r.profiles&&r.profiles.full_name?r.profiles.full_name:"Unknown";
        return'<div class="attendance-item"><span>'+escapeHtml(name)+'</span>'+badge(r.status)+'</div>';
      }).join("")+'</div></div>';
  }

  document.getElementById("save-minutes-btn").addEventListener("click",async function(){
    var btn=this,err=document.getElementById("error-banner"),ok=document.getElementById("success-banner");
    btn.disabled=true;err.classList.remove("visible");ok.classList.remove("visible");
    var r=await supabaseClient.from("meetings").update({minutes:document.getElementById("minutes").value,minutes_published:document.getElementById("minutes-published").checked}).eq("id",meetingId);
    btn.disabled=false;
    if(r.error){err.textContent=r.error.message||"Failed to save minutes.";err.classList.add("visible");return;}
    ok.textContent="Minutes saved.";ok.classList.add("visible");
  });

  var modal=document.getElementById("confirm-modal"),backdrop=document.getElementById("modal-backdrop");
  function openModal(){modal.hidden=false;backdrop.hidden=false;requestAnimationFrame(function(){modal.classList.add("open");backdrop.classList.add("open");});}
  function closeModal(){modal.classList.remove("open");backdrop.classList.remove("open");setTimeout(function(){modal.hidden=true;backdrop.hidden=true;},200);}
  document.getElementById("complete-btn").addEventListener("click",openModal);
  document.getElementById("modal-cancel").addEventListener("click",closeModal);
  backdrop.addEventListener("click",closeModal);
  document.getElementById("modal-confirm").addEventListener("click",async function(){
    closeModal();
    var r=await supabaseClient.from("meetings").update({status:"completed"}).eq("id",meetingId);
    if(r.error){document.getElementById("error-banner").textContent=r.error.message;document.getElementById("error-banner").classList.add("visible");return;}
    document.getElementById("complete-section").hidden=true;
    document.getElementById("success-banner").textContent="Meeting marked as complete.";document.getElementById("success-banner").classList.add("visible");
    meeting.status="completed";
  });

  (async function init(){
    if(!await adminGuard())return;
    var mr=await supabaseClient.from("meetings").select("*").eq("id",meetingId).maybeSingle();
    if(mr.error||!mr.data){window.location.replace("index.html");return;}
    meeting=mr.data;
    document.title=(meeting.title||"Meeting")+" — Admin";
    document.getElementById("meeting-title").textContent=meeting.title;
    document.getElementById("meeting-meta").textContent=formatDate(meeting.meeting_date)+(meeting.location?" · "+meeting.location:"");
    document.getElementById("minutes").value=meeting.minutes||"";
    document.getElementById("minutes-published").checked=!!meeting.minutes_published;
    updatePublishLabels();
    if(meeting.status!=="completed")document.getElementById("complete-section").hidden=false;
    var ar=await supabaseClient.from("attendance").select("status, member_id, profiles(full_name)").eq("meeting_id",meetingId).order("member_id");
    renderAttendance(ar.data||[]);
    document.getElementById("page-content").hidden=false;
    revealPage();
  })();
})();
</script>
</body>
</html>
