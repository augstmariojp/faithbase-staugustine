<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Members — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;white-space:nowrap;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .admin-page{padding:24px 20px 40px;max-width:860px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;}
  .back-link svg{width:18px;height:18px;}
  .page-heading{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--maroon);margin-bottom:20px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
  .search-input{flex:1;min-width:200px;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(107,31,53,0.2);border-radius:999px;background:var(--ivory);}
  .search-input:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease;}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);}
  .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-sm{font-size:13px;padding:9px 16px;}
  .btn-success{background:var(--success);color:var(--ivory);}
  .btn-danger-outline{background:transparent;border:1px solid var(--error);color:var(--error);box-shadow:none;}
  .btn-danger-outline:hover,.btn-danger-outline:focus-visible{background:rgba(180,35,24,0.08);transform:none;box-shadow:none;}
  .btn-secondary{background:transparent;border:1px solid rgba(107,31,53,0.3);color:var(--maroon);box-shadow:none;}
  .btn-secondary:hover,.btn-secondary:focus-visible{background:rgba(107,31,53,0.06);transform:none;box-shadow:none;}
  .success-banner{display:none;position:relative;background:rgba(240,204,92,0.18);border:1px solid rgba(201,162,39,0.45);border-radius:8px;padding:12px 40px 12px 14px;font-size:14px;color:var(--maroon-deep);margin-bottom:16px;}
  .success-banner.visible{display:block;}
  .success-banner-dismiss{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--maroon);font-size:18px;padding:4px;}
  .tabs-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:24px;border-bottom:1px solid rgba(107,31,53,0.15);scrollbar-width:thin;}
  .tabs{display:flex;flex-wrap:nowrap;min-width:min-content;}
  .tab-btn{flex:0 0 auto;padding:12px 14px;background:none;border:none;border-bottom:2px solid transparent;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--gold);}
  .tab-btn:hover,.tab-btn:focus-visible{color:var(--maroon);}
  .tab-count{font-size:11px;font-weight:700;background:rgba(107,31,53,0.1);color:var(--maroon);padding:2px 8px;border-radius:999px;}
  .member-list{display:flex;flex-direction:column;gap:12px;}
  .member-row,.pending-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-left:3px solid var(--maroon);border-radius:10px;padding:16px 18px;}
  .pending-card{border-left-color:var(--gold);}
  .member-row-main{cursor:pointer;}
  .member-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .member-row h3,.pending-card h3{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--maroon);line-height:1.25;}
  .member-meta{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;}
  .member-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge-role{background:rgba(107,31,53,0.1);color:var(--maroon);text-transform:none;letter-spacing:0;}
  .badge-admin{background:rgba(201,162,39,0.22);color:var(--maroon);text-transform:none;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state p{font-size:15px;line-height:1.6;}
  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-list[hidden],.skeleton-grid[hidden]{display:none!important;}
  .skeleton-row{height:88px;border-radius:10px;background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);z-index:100;background:var(--ivory);border-radius:12px;border-top:3px solid var(--maroon);padding:28px 24px;width:calc(100% - 40px);max-width:440px;max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 20px 48px -12px rgba(36,16,25,0.35);}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:12px;}
  .modal p{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;}
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field select,.form-field textarea{width:100%;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(107,31,53,0.2);border-radius:8px;background:var(--parchment);}
  .form-field textarea{min-height:80px;resize:vertical;line-height:1.55;}
  .form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .role-warning{font-size:13px;color:var(--amber);background:rgba(183,121,31,0.12);border:1px solid rgba(183,121,31,0.3);border-radius:8px;padding:12px 14px;margin-bottom:16px;line-height:1.55;}
  .modal-actions{display:flex;gap:12px;}
  .modal-actions button{flex:1;padding:14px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:var(--font-body);}
  .modal-cancel{background:transparent;border:1px solid rgba(107,31,53,0.3)!important;color:var(--maroon);}
  .modal-confirm{background:var(--gold-bright);color:var(--maroon-deep);}
  .modal-confirm.danger{background:var(--error);color:var(--ivory);}
  .modal-confirm.success{background:var(--success);color:var(--ivory);}
  body.checking-session .admin-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.admin-page{padding:20px 16px 32px;}.page-heading{font-size:28px;}.toolbar{flex-direction:column;align-items:stretch;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.skeleton-row,.modal,.modal-backdrop{animation:none;transition:none;}.btn:hover,.btn:focus-visible{transform:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../index.html" class="brand"><picture><source srcset="../assets/st-augustine-choir-crest.webp" type="image/webp"><img src="../assets/st-augustine-choir-crest.png" alt="" class="brand-mark-img"></picture><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="admin-page">
  <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Back to Admin Panel</a>
  <h1 class="page-heading">Manage Members</h1>
  <div id="success-banner" class="success-banner" role="status"><span id="toast-message"></span><button type="button" class="success-banner-dismiss" id="dismiss-success" aria-label="Dismiss">&times;</button></div>
  <div class="toolbar">
    <input type="search" class="search-input" id="search-input" placeholder="Search by name…" aria-label="Search members">
    <button type="button" class="btn btn-secondary" id="export-btn">Export CSV</button>
  </div>
  <div class="tabs-scroll" role="region" aria-label="Member status">
    <div class="tabs" role="tablist">
      <button type="button" class="tab-btn" data-tab="pending" aria-selected="false">Pending <span class="tab-count" id="count-pending">0</span></button>
      <button type="button" class="tab-btn" data-tab="active" aria-selected="false">Active <span class="tab-count" id="count-active">0</span></button>
      <button type="button" class="tab-btn" data-tab="inactive" aria-selected="false">Inactive <span class="tab-count" id="count-inactive">0</span></button>
      <button type="button" class="tab-btn" data-tab="suspended" aria-selected="false">Suspended <span class="tab-count" id="count-suspended">0</span></button>
    </div>
  </div>
  <div id="list-loading" class="skeleton-list"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
  <div id="list-content" hidden></div>
</main>
<div class="modal-backdrop" id="modal-backdrop" hidden></div>
<div class="modal" id="generic-modal" role="dialog" aria-hidden="true" hidden>
  <h2 id="modal-title"></h2>
  <p id="modal-body"></p>
  <div id="modal-extra"></div>
  <div class="modal-actions">
    <button type="button" class="modal-cancel" id="modal-cancel">Cancel</button>
    <button type="button" class="modal-confirm" id="modal-confirm">Confirm</button>
  </div>
</div>
<div class="modal" id="role-modal" role="dialog" aria-hidden="true" hidden>
  <h2>Change Role</h2>
  <p id="role-modal-name"></p>
  <div class="form-field">
    <label for="role-select">Role</label>
    <select id="role-select">
      <option value="member">Member</option>
      <option value="president">President</option>
      <option value="vp">VP</option>
      <option value="secretary">Secretary</option>
      <option value="fin_secretary">Financial Secretary</option>
      <option value="treasurer">Treasurer</option>
      <option value="welfare_officer">Welfare Officer</option>
      <option value="pro">PRO</option>
      <option value="admin">Admin</option>
    </select>
  </div>
  <p class="role-warning">This member will immediately gain or lose admin panel access based on their new role.</p>
  <div class="modal-actions">
    <button type="button" class="modal-cancel" id="role-cancel">Cancel</button>
    <button type="button" class="modal-confirm" id="role-confirm">Confirm</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";
  document.title="Manage Members — "+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});
  document.getElementById("dismiss-success").addEventListener("click",function(){document.getElementById("success-banner").classList.remove("visible");});

  var supabaseClient=null,allMembers=[],activeTab="active",searchQuery="",modalAction=null,roleMemberId=null;
  var TABS=["pending","active","inactive","suspended"];

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function formatDate(iso){if(!iso)return"\u2014";return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});}
  function showToast(msg){document.getElementById("toast-message").textContent=msg;document.getElementById("success-banner").classList.add("visible");}

  function roleLabel(r){
    return r==="president"?"President":r==="vp"?"VP":r==="secretary"?"Secretary":r==="fin_secretary"?"Financial Secretary":r==="treasurer"?"Treasurer":r==="welfare_officer"?"Welfare Officer":r==="pro"?"PRO":r==="admin"?"Admin":"Member";
  }
  function roleBadge(m){var cls=m.role==="admin"?"badge-admin":"badge-role";return'<span class="badge '+cls+'">'+escapeHtml(roleLabel(m.role))+'</span>';}

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace("../index.html");});

  async function adminGuard(){
    if(!supabaseClient){window.location.replace("../auth/login.html");return null;}
    var sr=await supabaseClient.auth.getSession(),session=sr.data&&sr.data.session;
    if(!session){window.location.replace("../auth/login.html");return null;}
    var pr=await supabaseClient.from("profiles").select("full_name,role,status").eq("id",session.user.id).single(),p=pr.data;
    if(pr.error||!p||p.status!=="active"){await supabaseClient.auth.signOut();window.location.replace("../auth/login.html");return null;}
    if(p.role!=="admin"){window.location.replace("../member/dashboard.html");return null;}
    document.getElementById("member-name").textContent=firstName(p.full_name);
    return p;
  }

  function updateCounts(){
    TABS.forEach(function(t){
      document.getElementById("count-"+t).textContent=String(allMembers.filter(function(m){return m.status===t;}).length);
    });
  }

  function filteredList(){
    var list=allMembers.filter(function(m){return m.status===activeTab;});
    if(activeTab==="pending")list.sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);});
    else list.sort(function(a,b){return(a.full_name||"").localeCompare(b.full_name||"");});
    if(searchQuery){
      var q=searchQuery.toLowerCase();
      list=list.filter(function(m){return(m.full_name||"").toLowerCase().indexOf(q)!==-1;});
    }
    return list;
  }

  function navigateDetail(id,e){
    if(e.target.closest(".member-actions")||e.target.closest("button"))return;
    window.location.href="members/detail.html?id="+encodeURIComponent(id);
  }

  function renderPendingCard(m){
    return'<div class="pending-card" data-id="'+escapeHtml(m.id)+'">'+
      '<div class="member-row-main" tabindex="0" role="link" data-nav-id="'+escapeHtml(m.id)+'">'+
      '<h3>'+escapeHtml(m.full_name)+'</h3>'+
      '<p class="member-meta">'+escapeHtml(m.phone||"\u2014")+'<br>'+escapeHtml(m.address||"\u2014")+'</p>'+
      '<p class="member-meta">Requested '+escapeHtml(formatDate(m.created_at))+'</p></div>'+
      '<div class="member-actions">'+
      '<button type="button" class="btn btn-sm btn-success approve-btn" data-id="'+escapeHtml(m.id)+'">Approve</button>'+
      '<button type="button" class="btn btn-sm btn-danger-outline reject-btn" data-id="'+escapeHtml(m.id)+'">Reject</button>'+
      '</div></div>';
  }

  function renderMemberRow(m,actionsHtml){
    return'<div class="member-row" data-id="'+escapeHtml(m.id)+'">'+
      '<div class="member-row-main" tabindex="0" role="link" data-nav-id="'+escapeHtml(m.id)+'">'+
      '<div class="member-row-top"><h3>'+escapeHtml(m.full_name)+'</h3>'+roleBadge(m)+'</div>'+
      '<p class="member-meta">'+escapeHtml(m.phone||"\u2014")+' &middot; Joined '+escapeHtml(formatDate(m.date_joined||m.created_at))+'</p></div>'+
      (actionsHtml?'<div class="member-actions">'+actionsHtml+'</div>':"")+'</div>';
  }

  function bindListEvents(){
    document.querySelectorAll("[data-nav-id]").forEach(function(el){
      el.addEventListener("click",function(e){navigateDetail(el.getAttribute("data-nav-id"),e);});
      el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();window.location.href="members/detail.html?id="+encodeURIComponent(el.getAttribute("data-nav-id"));}});
    });
    document.querySelectorAll(".approve-btn").forEach(function(btn){btn.addEventListener("click",function(e){e.stopPropagation();openApproveModal(btn.getAttribute("data-id"));});});
    document.querySelectorAll(".reject-btn").forEach(function(btn){btn.addEventListener("click",function(e){e.stopPropagation();openRejectModal(btn.getAttribute("data-id"));});});
    document.querySelectorAll(".suspend-btn").forEach(function(btn){btn.addEventListener("click",function(e){e.stopPropagation();openSuspendModal(btn.getAttribute("data-id"));});});
    document.querySelectorAll(".reactivate-btn").forEach(function(btn){btn.addEventListener("click",function(e){e.stopPropagation();openReactivateModal(btn.getAttribute("data-id"));});});
    document.querySelectorAll(".change-role-btn").forEach(function(btn){btn.addEventListener("click",function(e){e.stopPropagation();openRoleModal(btn.getAttribute("data-id"));});});
  }

  function renderList(){
    document.getElementById("list-loading").hidden=true;
    var content=document.getElementById("list-content");
    content.hidden=false;
    var list=filteredList();
    if(!list.length){
      content.innerHTML='<div class="empty-state"><p>No '+activeTab+' members.</p></div>';
      return;
    }
    var html="";
    if(activeTab==="pending"){
      html=list.map(renderPendingCard).join("");
    }else{
      html='<div class="member-list">'+list.map(function(m){
        var actions="";
        if(activeTab==="active"){
          actions='<button type="button" class="btn btn-sm btn-secondary change-role-btn" data-id="'+escapeHtml(m.id)+'">Change Role</button>'+
            '<button type="button" class="btn btn-sm btn-danger-outline suspend-btn" data-id="'+escapeHtml(m.id)+'">Suspend</button>';
        }else{
          actions='<button type="button" class="btn btn-sm btn-success reactivate-btn" data-id="'+escapeHtml(m.id)+'">Reactivate</button>';
        }
        return renderMemberRow(m,actions);
      }).join("")+'</div>';
    }
    content.innerHTML=html;
    bindListEvents();
  }

  function switchTab(tab){
    activeTab=tab;
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      var on=btn.getAttribute("data-tab")===tab;
      btn.classList.toggle("active",on);
      btn.setAttribute("aria-selected",String(on));
    });
    renderList();
  }

  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click",function(){switchTab(btn.getAttribute("data-tab"));});
  });

  document.getElementById("search-input").addEventListener("input",function(){
    searchQuery=this.value.trim();
    renderList();
  });

  function csvEscape(v){var s=String(v==null?"":v);return(s.indexOf('"')!==-1||s.indexOf(",")!==-1||s.indexOf("\n")!==-1)?'"'+s.replace(/"/g,'""')+'"':s;}

  document.getElementById("export-btn").addEventListener("click",function(){
    var list=filteredList();
    var header=["full_name","phone","address","role","date_joined","status"];
    var rows=[header.join(",")].concat(list.map(function(m){
      return[csvEscape(m.full_name),csvEscape(m.phone),csvEscape(m.address),csvEscape(m.role),csvEscape(m.date_joined||""),csvEscape(m.status)].join(",");
    }));
    var blob=new Blob([rows.join("\n")],{type:"text/csv;charset=utf-8;"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="members-export-"+new Date().toISOString().slice(0,10)+".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  var backdrop=document.getElementById("modal-backdrop"),genericModal=document.getElementById("generic-modal"),roleModal=document.getElementById("role-modal");
  function openModal(modal){modal.hidden=false;backdrop.hidden=false;requestAnimationFrame(function(){modal.classList.add("open");backdrop.classList.add("open");modal.setAttribute("aria-hidden","false");});}
  function closeModals(){
    [genericModal,roleModal].forEach(function(m){m.classList.remove("open");m.setAttribute("aria-hidden","true");});
    backdrop.classList.remove("open");
    modalAction=null;roleMemberId=null;
    setTimeout(function(){genericModal.hidden=true;roleModal.hidden=true;backdrop.hidden=true;document.getElementById("modal-extra").innerHTML="";},200);
  }

  document.getElementById("modal-cancel").addEventListener("click",closeModals);
  document.getElementById("role-cancel").addEventListener("click",closeModals);
  backdrop.addEventListener("click",closeModals);
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModals();});

  function memberById(id){return allMembers.find(function(m){return m.id===id;});}

  function openApproveModal(id){
    var m=memberById(id);if(!m)return;
    document.getElementById("modal-title").textContent="Approve Member?";
    document.getElementById("modal-body").textContent="Approve "+m.full_name+" as an active member?";
    document.getElementById("modal-confirm").textContent="Approve";
    document.getElementById("modal-confirm").className="modal-confirm success";
    modalAction=function(){return approveMember(id);};
    openModal(genericModal);
  }

  function openRejectModal(id){
    var m=memberById(id);if(!m)return;
    document.getElementById("modal-title").textContent="Reject Registration?";
    document.getElementById("modal-body").textContent="This will remove their registration. This cannot be undone.";
    document.getElementById("modal-extra").innerHTML='<div class="form-field"><label for="reject-reason">Reason (optional, for your own records)</label><textarea id="reject-reason" placeholder="Optional notes…"></textarea></div>';
    document.getElementById("modal-confirm").textContent="Reject";
    document.getElementById("modal-confirm").className="modal-confirm danger";
    modalAction=function(){return rejectMember(id);};
    openModal(genericModal);
  }

  function openSuspendModal(id){
    var m=memberById(id);if(!m)return;
    document.getElementById("modal-title").textContent="Suspend Member?";
    document.getElementById("modal-body").textContent="Suspend "+m.full_name+"? They will lose access immediately.";
    document.getElementById("modal-confirm").textContent="Suspend";
    document.getElementById("modal-confirm").className="modal-confirm danger";
    modalAction=function(){return updateStatus(id,"suspended","Member suspended.");};
    openModal(genericModal);
  }

  function openReactivateModal(id){
    var m=memberById(id);if(!m)return;
    document.getElementById("modal-title").textContent="Reactivate Member?";
    document.getElementById("modal-body").textContent="Reactivate "+m.full_name+"? They will regain access.";
    document.getElementById("modal-confirm").textContent="Reactivate";
    document.getElementById("modal-confirm").className="modal-confirm success";
    modalAction=function(){return updateStatus(id,"active","Member reactivated.");};
    openModal(genericModal);
  }

  function openRoleModal(id){
    var m=memberById(id);if(!m)return;
    roleMemberId=id;
    document.getElementById("role-modal-name").textContent=m.full_name;
    document.getElementById("role-select").value=m.role||"member";
    openModal(roleModal);
  }

  document.getElementById("modal-confirm").addEventListener("click",async function(){
    if(modalAction)await modalAction();
    closeModals();
  });

  document.getElementById("role-confirm").addEventListener("click",async function(){
    if(!roleMemberId)return;
    var newRole=document.getElementById("role-select").value;
    var r=await supabaseClient.from("profiles").update({role:newRole}).eq("id",roleMemberId);
    closeModals();
    if(r.error){showToast(r.error.message);return;}
    var m=memberById(roleMemberId);
    if(m)m.role=newRole;
    showToast("Role updated.");
    renderList();
  });

  async function approveMember(id){
    var r=await supabaseClient.from("profiles").update({status:"active"}).eq("id",id);
    if(r.error){showToast(r.error.message);return;}
    var m=memberById(id);
    if(m){m.status="active";if(!m.date_joined)m.date_joined=new Date().toISOString();}
    updateCounts();renderList();showToast("Member approved.");
  }

  async function rejectMember(id){
    var r=await supabaseClient.from("profiles").delete().eq("id",id);
    if(r.error){showToast(r.error.message);return;}
    allMembers=allMembers.filter(function(m){return m.id!==id;});
    updateCounts();renderList();showToast("Member rejected.");
  }

  async function updateStatus(id,status,toast){
    var r=await supabaseClient.from("profiles").update({status:status}).eq("id",id);
    if(r.error){showToast(r.error.message);return;}
    var m=memberById(id);
    if(m)m.status=status;
    updateCounts();renderList();showToast(toast);
  }

  (async function init(){
    if(!await adminGuard())return;
    var r=await supabaseClient.from("profiles").select("id, full_name, phone, address, role, status, date_joined, created_at").order("full_name",{ascending:true});
    allMembers=r.data||[];
    updateCounts();
    var defaultTab=allMembers.some(function(m){return m.status==="pending";})?"pending":"active";
    switchTab(defaultTab);
    revealPage();
  })();
})();
</script>
</body>
</html>
