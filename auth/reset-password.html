<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — St. Augustine Choir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --maroon-deep:  #3E0F1C;
    --maroon:       #6B1F35;
    --maroon-light: #8A2E45;
    --gold:         #C9A227;
    --gold-bright:  #F0CC5C;
    --parchment:    #F7EFE0;
    --ivory:        #FFFBF3;
    --ink:          #241019;
    --ink-soft:     #5C3A44;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;

    --error: #B42318;
    --success: #2D6A4F;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--parchment);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}

  /* ── Header ─────────────────────────────────────────────────── */
  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:var(--maroon-deep);
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:20px;font-weight:600;
    color:var(--ivory);
    letter-spacing:0.01em;
  }
  .brand-mark{
    width:28px;height:28px;flex-shrink:0;
    color:var(--gold-bright);
  }
  .brand-mark svg{width:100%;height:100%;}
  .header-signin{
    font-family:var(--font-body);
    font-size:14px;font-weight:600;
    color:var(--gold-bright);
    padding:9px 18px;
    border:1px solid rgba(240,204,92,0.5);
    border-radius:999px;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
    white-space:nowrap;
  }
  .header-signin:hover,.header-signin:focus-visible{
    background:var(--gold-bright);
    color:var(--maroon-deep);
    border-color:var(--gold-bright);
  }

  /* ── Auth layout ────────────────────────────────────────────── */
  .auth-page{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px 64px;
  }
  .auth-card{
    width:100%;
    max-width:440px;
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-top:3px solid var(--maroon);
    border-radius:10px;
    padding:36px 32px 40px;
    box-shadow:0 4px 24px -8px rgba(36,16,25,0.12);
  }
  .auth-card h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:28px;
    color:var(--maroon);
    margin-bottom:8px;
    text-align:center;
  }
  .auth-subtext{
    font-size:14.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:28px;
    line-height:1.6;
  }

  /* ── Error banner ───────────────────────────────────────────── */
  .error-banner{
    display:none;
    background:rgba(180,35,24,0.08);
    border:1px solid rgba(180,35,24,0.25);
    border-radius:8px;
    padding:12px 14px;
    font-size:14px;
    color:var(--error);
    margin-bottom:20px;
    line-height:1.5;
  }
  .error-banner.visible{display:block;}

  /* ── Form fields ────────────────────────────────────────────── */
  .form-field{
    margin-bottom:20px;
  }
  .form-field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--maroon);
    margin-bottom:6px;
    letter-spacing:0.01em;
  }
  .input-wrap{
    position:relative;
  }
  .form-field input{
    width:100%;
    font-family:var(--font-body);
    font-size:15px;
    color:var(--ink);
    background:var(--parchment);
    border:1px solid rgba(107,31,53,0.2);
    border-radius:8px;
    padding:12px 14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .form-field input::placeholder{color:rgba(92,58,68,0.45);}
  .form-field input:focus{
    outline:none;
    border-color:var(--maroon);
    box-shadow:0 0 0 3px rgba(107,31,53,0.12);
  }
  .form-field input.input-error{
    border-color:var(--error);
    box-shadow:0 0 0 3px rgba(180,35,24,0.1);
  }
  .form-field.has-toggle input{padding-right:44px;}
  .toggle-password{
    position:absolute;
    right:10px;top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    transition:color .15s ease;
  }
  .toggle-password:hover,.toggle-password:focus-visible{color:var(--maroon);}
  .toggle-password svg{width:20px;height:20px;}
  .field-error{
    display:none;
    font-size:12.5px;
    color:var(--error);
    margin-top:6px;
    line-height:1.4;
  }
  .field-error.visible{display:block;}

  /* ── Password strength ──────────────────────────────────────── */
  .strength-bar{
    display:flex;
    gap:4px;
    margin-top:8px;
  }
  .strength-segment{
    flex:1;
    height:4px;
    border-radius:2px;
    background:rgba(107,31,53,0.12);
    transition:background .2s ease;
  }
  .strength-bar[data-level="1"] .strength-segment:nth-child(1){background:#C0392B;}
  .strength-bar[data-level="2"] .strength-segment:nth-child(1),
  .strength-bar[data-level="2"] .strength-segment:nth-child(2){background:var(--gold);}
  .strength-bar[data-level="3"] .strength-segment:nth-child(1),
  .strength-bar[data-level="3"] .strength-segment:nth-child(2),
  .strength-bar[data-level="3"] .strength-segment:nth-child(3){background:var(--success);}
  .strength-label{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ── Buttons ────────────────────────────────────────────────── */
  .btn{
    font-family:var(--font-body);
    font-size:15px;font-weight:600;
    padding:14px 30px;
    border-radius:999px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, opacity .15s ease;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    text-align:center;
  }
  .btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }
  .btn-primary{
    background:var(--gold-bright);
    color:var(--maroon-deep);
    box-shadow:0 0 0 0 rgba(240,204,92,0.5);
    margin-top:8px;
  }
  .btn-primary:hover:not(:disabled),.btn-primary:focus-visible:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);
  }

  /* ── Spinner ────────────────────────────────────────────────── */
  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(62,15,28,0.2);
    border-top-color:var(--maroon-deep);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }

  body.checking-session .auth-page{visibility:hidden;}

  @media (max-width:720px){
    .site-header{padding:14px 18px;}
    .auth-page{padding:32px 16px 48px;}
    .auth-card{padding:28px 22px 32px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .spinner{animation:none;border-top-color:var(--maroon-deep);}
    .btn-primary:hover:not(:disabled){transform:none;}
  }
</style>
</head>
<body class="checking-session">

<header class="site-header">
  <a href="../index.html" class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </span>
    <span data-config="communityShortName">St. Augustine Choir</span>
  </a>
  <a href="login.html" class="header-signin" data-route="login">Sign In</a>
</header>

<main class="auth-page">
  <div class="auth-card">
    <div id="form-view" hidden>
      <h1>Set New Password</h1>

      <div id="error-banner" class="error-banner" role="alert" aria-live="polite"></div>

      <form id="reset-form" novalidate>
        <div class="form-field has-toggle">
          <label for="password">New Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
              <svg class="icon-show" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="icon-hide" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
                <path d="M3 3l18 18M10.6 10.6A3 3 0 0012 15a3 3 0 002.4-4.4M9.9 4.2A10.7 10.7 0 0112 4c6.5 0 10 8 10 8a18.2 18.2 0 01-4.1 5.2M6.1 6.1C3.7 7.6 2 10 2 12s3.5 7 10 7a10.7 10.7 0 004.9-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="strength-bar" id="strength-bar" data-level="0" aria-hidden="true">
            <span class="strength-segment"></span>
            <span class="strength-segment"></span>
            <span class="strength-segment"></span>
          </div>
          <p class="strength-label" id="strength-label"></p>
          <p class="field-error" id="error-password" aria-live="polite"></p>
        </div>

        <div class="form-field has-toggle">
          <label for="confirm-password">Confirm New Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
            <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password">
              <svg class="icon-show" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="icon-hide" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
                <path d="M3 3l18 18M10.6 10.6A3 3 0 0012 15a3 3 0 002.4-4.4M9.9 4.2A10.7 10.7 0 0112 4c6.5 0 10 8 10 8a18.2 18.2 0 01-4.1 5.2M6.1 6.1C3.7 7.6 2 10 2 12s3.5 7 10 7a10.7 10.7 0 004.9-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="field-error" id="error-confirm-password" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Reset Password</button>
      </form>
    </div>

    <div id="expired-view" hidden>
      <h1>Link Expired</h1>
      <p class="auth-subtext">This password reset link has expired or is invalid. Reset links are valid for 1 hour.</p>
      <a href="forgot-password.html" class="btn btn-primary">Request a New Link</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var c = FAITHBASE_CONFIG.colors;
  root.style.setProperty('--maroon-deep',  c.maroonDeep);
  root.style.setProperty('--maroon',       c.maroon);
  root.style.setProperty('--maroon-light', c.maroonLight);
  root.style.setProperty('--gold',         c.gold);
  root.style.setProperty('--gold-bright',  c.goldBright);
  root.style.setProperty('--parchment',    c.parchment);
  root.style.setProperty('--ivory',        c.ivory);
  root.style.setProperty('--ink',          c.ink);
  root.style.setProperty('--ink-soft',     c.inkSoft);

  document.title = "Set New Password — " + FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){
    var key = el.getAttribute('data-config');
    if (FAITHBASE_CONFIG[key] !== undefined) el.textContent = FAITHBASE_CONFIG[key];
  });

  document.querySelectorAll('[data-route]').forEach(function(el){
    var route = FAITHBASE_CONFIG.routes[el.getAttribute('data-route')];
    if (route) el.setAttribute('href', route.indexOf('auth/') === 0 ? route.replace('auth/', '') : route);
  });

  var formView = document.getElementById('form-view');
  var expiredView = document.getElementById('expired-view');
  var form = document.getElementById('reset-form');
  var submitBtn = document.getElementById('submit-btn');
  var errorBanner = document.getElementById('error-banner');
  var passwordInput = document.getElementById('password');
  var confirmInput = document.getElementById('confirm-password');
  var strengthBar = document.getElementById('strength-bar');
  var strengthLabel = document.getElementById('strength-label');

  var recoveryReady = false;
  var resolved = false;
  var recoveryTimeout = null;

  var fields = [
    { id: 'password', errorId: 'error-password', validate: validatePassword },
    { id: 'confirm-password', errorId: 'error-confirm-password', validate: validateConfirmPassword }
  ];

  function hasRecoveryParams(){
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    return hash.indexOf('access_token') !== -1 ||
           hash.indexOf('type=recovery') !== -1 ||
           search.indexOf('type=recovery') !== -1 ||
           search.indexOf('code=') !== -1;
  }

  function revealPage(){
    document.body.classList.remove('checking-session');
  }

  function showForm(){
    if (resolved) return;
    resolved = true;
    clearTimeout(recoveryTimeout);
    formView.hidden = false;
    expiredView.hidden = true;
    revealPage();
  }

  function showExpired(){
    if (resolved) return;
    resolved = true;
    clearTimeout(recoveryTimeout);
    formView.hidden = true;
    expiredView.hidden = false;
    revealPage();
  }

  function validateRequired(input){
    if (!input.value.trim()) return 'This field is required.';
    return '';
  }

  function validatePassword(input){
    var req = validateRequired(input);
    if (req) return req;
    if (input.value.length < 8) return 'Password must be at least 8 characters.';
    return '';
  }

  function validateConfirmPassword(input){
    var req = validateRequired(input);
    if (req) return req;
    if (input.value !== passwordInput.value) return 'Passwords do not match.';
    return '';
  }

  function showFieldError(fieldId, errorId, message){
    var input = document.getElementById(fieldId);
    var errorEl = document.getElementById(errorId);
    if (message){
      input.classList.add('input-error');
      input.setAttribute('aria-invalid', 'true');
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    } else {
      input.classList.remove('input-error');
      input.removeAttribute('aria-invalid');
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }
  }

  function validateField(field){
    var input = document.getElementById(field.id);
    var message = field.validate(input);
    showFieldError(field.id, field.errorId, message);
    return !message;
  }

  function hasVisibleErrors(){
    return fields.some(function(field){
      return document.getElementById(field.errorId).classList.contains('visible');
    });
  }

  function validateAll(){
    var allValid = true;
    fields.forEach(function(field){
      if (!validateField(field)) allValid = false;
    });
    return allValid;
  }

  function hideBanner(){
    errorBanner.textContent = '';
    errorBanner.classList.remove('visible');
  }

  function showBanner(message){
    errorBanner.textContent = message;
    errorBanner.classList.add('visible');
  }

  function calcStrength(value){
    var score = 0;
    if (value.length >= 8) score++;
    if (/\d/.test(value)) score++;
    if (/[A-Z]/.test(value)) score++;
    return score;
  }

  function updateStrength(){
    var score = calcStrength(passwordInput.value);
    var level = passwordInput.value.length === 0 ? 0 : Math.max(1, score <= 1 ? 1 : score);
    strengthBar.setAttribute('data-level', String(level));

    if (!passwordInput.value){
      strengthLabel.textContent = '';
      return;
    }
    if (score <= 1){
      strengthLabel.textContent = 'Weak';
    } else if (score === 2){
      strengthLabel.textContent = 'Fair';
    } else {
      strengthLabel.textContent = 'Strong';
    }
  }

  function acceptRecovery(session, event){
    if (recoveryReady || resolved) return;
    if (!session) return;

    if (event === 'PASSWORD_RECOVERY'){
      recoveryReady = true;
      showForm();
      return;
    }

    if (hasRecoveryParams()){
      recoveryReady = true;
      showForm();
    }
  }

  fields.forEach(function(field){
    var input = document.getElementById(field.id);
    input.addEventListener('blur', function(){
      validateField(field);
    });
  });

  passwordInput.addEventListener('keyup', updateStrength);
  passwordInput.addEventListener('input', function(){
    updateStrength();
    if (confirmInput.value){
      validateField(fields[1]);
    }
  });

  confirmInput.addEventListener('input', function(){
    if (document.getElementById('error-confirm-password').classList.contains('visible') || confirmInput.value){
      validateField(fields[1]);
    }
  });

  document.querySelectorAll('.toggle-password').forEach(function(btn){
    btn.addEventListener('click', function(){
      var target = document.getElementById(btn.getAttribute('data-target'));
      var isHidden = target.type === 'password';
      target.type = isHidden ? 'text' : 'password';
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      btn.querySelector('.icon-show').hidden = isHidden;
      btn.querySelector('.icon-hide').hidden = !isHidden;
    });
  });

  var supabaseClient = null;
  try {
    var url = FAITHBASE_CONFIG.supabase.url;
    var key = FAITHBASE_CONFIG.supabase.anonKey;
    if (url && key && url.indexOf('YOUR-') === -1){
      supabaseClient = supabase.createClient(url, key);
    }
  } catch (e) {}

  if (!supabaseClient){
    showExpired();
  } else {
    supabaseClient.auth.onAuthStateChange(function(event, session){
      acceptRecovery(session, event);
    });

    supabaseClient.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if (session && hasRecoveryParams()){
        acceptRecovery(session, 'PASSWORD_RECOVERY');
      }
    });

    recoveryTimeout = setTimeout(function(){
      if (!recoveryReady && !resolved){
        showExpired();
      }
    }, 2000);
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    hideBanner();

    if (!validateAll() || hasVisibleErrors()) return;

    if (!supabaseClient){
      showBanner('Password reset is not available yet. Please try again later.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Resetting\u2026';

    try {
      var result = await supabaseClient.auth.updateUser({
        password: passwordInput.value
      });

      if (result.error){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
        showBanner(result.error.message || 'Something went wrong. Please try again.');
        return;
      }

      await supabaseClient.auth.signOut();
      window.location.replace('login.html?reset=success');
    } catch (err){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
      showBanner('Something went wrong. Please try again.');
    }
  });
})();
</script>
</body>
</html>
