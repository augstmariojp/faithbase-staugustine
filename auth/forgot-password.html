<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — St. Augustine Choir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --maroon-deep:  #3E0F1C;
    --maroon:       #6B1F35;
    --maroon-light: #8A2E45;
    --gold:         #C9A227;
    --gold-bright:  #F0CC5C;
    --parchment:    #F7EFE0;
    --ivory:        #FFFBF3;
    --ink:          #241019;
    --ink-soft:     #5C3A44;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;

    --error: #B42318;
    --success: #2D6A4F;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--parchment);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}

  /* ── Header ─────────────────────────────────────────────────── */
  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:var(--maroon-deep);
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:20px;font-weight:600;
    color:var(--ivory);
    letter-spacing:0.01em;
  }
  .brand-mark{
    width:28px;height:28px;flex-shrink:0;
    color:var(--gold-bright);
  }
  .brand-mark svg{width:100%;height:100%;}
  .header-signin{
    font-family:var(--font-body);
    font-size:14px;font-weight:600;
    color:var(--gold-bright);
    padding:9px 18px;
    border:1px solid rgba(240,204,92,0.5);
    border-radius:999px;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
    white-space:nowrap;
  }
  .header-signin:hover,.header-signin:focus-visible{
    background:var(--gold-bright);
    color:var(--maroon-deep);
    border-color:var(--gold-bright);
  }

  /* ── Auth layout ────────────────────────────────────────────── */
  .auth-page{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px 64px;
  }
  .auth-card{
    width:100%;
    max-width:440px;
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-top:3px solid var(--maroon);
    border-radius:10px;
    padding:36px 32px 40px;
    box-shadow:0 4px 24px -8px rgba(36,16,25,0.12);
  }
  .card-brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:24px;
  }
  .card-brand-mark{
    width:48px;height:48px;
    color:var(--gold-bright);
  }
  .card-brand-mark svg{width:100%;height:100%;}
  .card-brand-name{
    font-family:var(--font-display);
    font-size:18px;font-weight:600;
    color:var(--maroon);
    letter-spacing:0.01em;
    text-align:center;
  }
  .auth-card h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:28px;
    color:var(--maroon);
    margin-bottom:8px;
    text-align:center;
  }
  .auth-subtext{
    font-size:14.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:28px;
    line-height:1.6;
  }

  /* ── Error banner ───────────────────────────────────────────── */
  .error-banner{
    display:none;
    background:rgba(180,35,24,0.08);
    border:1px solid rgba(180,35,24,0.25);
    border-radius:8px;
    padding:12px 14px;
    font-size:14px;
    color:var(--error);
    margin-bottom:20px;
    line-height:1.5;
  }
  .error-banner.visible{display:block;}

  /* ── Form fields ────────────────────────────────────────────── */
  .form-field{
    margin-bottom:20px;
  }
  .form-field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--maroon);
    margin-bottom:6px;
    letter-spacing:0.01em;
  }
  .form-field input{
    width:100%;
    font-family:var(--font-body);
    font-size:15px;
    color:var(--ink);
    background:var(--parchment);
    border:1px solid rgba(107,31,53,0.2);
    border-radius:8px;
    padding:12px 14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .form-field input::placeholder{color:rgba(92,58,68,0.45);}
  .form-field input:focus{
    outline:none;
    border-color:var(--maroon);
    box-shadow:0 0 0 3px rgba(107,31,53,0.12);
  }
  .form-field input.input-error{
    border-color:var(--error);
    box-shadow:0 0 0 3px rgba(180,35,24,0.1);
  }
  .field-error{
    display:none;
    font-size:12.5px;
    color:var(--error);
    margin-top:6px;
    line-height:1.4;
  }
  .field-error.visible{display:block;}

  /* ── Success state ──────────────────────────────────────────── */
  .success-icon{
    width:56px;height:56px;
    margin:0 auto 20px;
    color:var(--success);
  }
  .success-icon svg{width:100%;height:100%;}
  .success-body{
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:8px;
  }
  .success-body strong{color:var(--ink);font-weight:600;}

  /* ── Buttons ────────────────────────────────────────────────── */
  .btn{
    font-family:var(--font-body);
    font-size:15px;font-weight:600;
    padding:14px 30px;
    border-radius:999px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, opacity .15s ease;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
  }
  .btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }
  .btn-primary{
    background:var(--gold-bright);
    color:var(--maroon-deep);
    box-shadow:0 0 0 0 rgba(240,204,92,0.5);
    margin-top:8px;
  }
  .btn-primary:hover:not(:disabled),.btn-primary:focus-visible:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);
  }

  /* ── Spinner ────────────────────────────────────────────────── */
  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(62,15,28,0.2);
    border-top-color:var(--maroon-deep);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }

  .auth-footer-link{
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:20px;
  }
  .auth-footer-link a{
    color:var(--maroon);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .auth-footer-link a:hover,.auth-footer-link a:focus-visible{color:var(--maroon-deep);}

  @media (max-width:720px){
    .site-header{padding:14px 18px;}
    .auth-page{padding:32px 16px 48px;}
    .auth-card{padding:28px 22px 32px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .spinner{animation:none;border-top-color:var(--maroon-deep);}
    .btn-primary:hover:not(:disabled){transform:none;}
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </span>
    <span data-config="communityShortName">St. Augustine Choir</span>
  </a>
  <a href="login.html" class="header-signin" data-route="login">Sign In</a>
</header>

<main class="auth-page">
  <div class="auth-card">
    <div class="card-brand">
      <span class="card-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </span>
      <span class="card-brand-name" data-config="communityShortName">St. Augustine Choir</span>
    </div>

    <div id="form-view">
      <h1>Reset Your Password</h1>
      <p class="auth-subtext">Enter your email and we&rsquo;ll send you a reset link.</p>

      <div id="error-banner" class="error-banner" role="alert" aria-live="polite"></div>

      <form id="forgot-form" novalidate>
        <div class="form-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <p class="field-error" id="error-email" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Send Reset Link</button>
      </form>
    </div>

    <div id="success-view" hidden>
      <div class="success-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2.5"/>
          <path d="M20 32l8 8 16-16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Check Your Email</h1>
      <p class="success-body" id="success-message"></p>
    </div>

    <p class="auth-footer-link"><a href="login.html" data-route="login">Back to Sign In</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var c = FAITHBASE_CONFIG.colors;
  root.style.setProperty('--maroon-deep',  c.maroonDeep);
  root.style.setProperty('--maroon',       c.maroon);
  root.style.setProperty('--maroon-light', c.maroonLight);
  root.style.setProperty('--gold',         c.gold);
  root.style.setProperty('--gold-bright',  c.goldBright);
  root.style.setProperty('--parchment',    c.parchment);
  root.style.setProperty('--ivory',        c.ivory);
  root.style.setProperty('--ink',          c.ink);
  root.style.setProperty('--ink-soft',     c.inkSoft);

  document.title = "Reset Your Password — " + FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){
    var key = el.getAttribute('data-config');
    if (FAITHBASE_CONFIG[key] !== undefined) el.textContent = FAITHBASE_CONFIG[key];
  });

  document.querySelectorAll('[data-route]').forEach(function(el){
    var route = FAITHBASE_CONFIG.routes[el.getAttribute('data-route')];
    if (route) el.setAttribute('href', route.indexOf('auth/') === 0 ? route.replace('auth/', '') : route);
  });

  var form = document.getElementById('forgot-form');
  var formView = document.getElementById('form-view');
  var successView = document.getElementById('success-view');
  var successMessage = document.getElementById('success-message');
  var submitBtn = document.getElementById('submit-btn');
  var errorBanner = document.getElementById('error-banner');
  var emailInput = document.getElementById('email');

  var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function validateEmail(input){
    if (!input.value.trim()) return 'This field is required.';
    if (!emailPattern.test(input.value.trim())) return 'Please enter a valid email address.';
    return '';
  }

  function showFieldError(message){
    var errorEl = document.getElementById('error-email');
    if (message){
      emailInput.classList.add('input-error');
      emailInput.setAttribute('aria-invalid', 'true');
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    } else {
      emailInput.classList.remove('input-error');
      emailInput.removeAttribute('aria-invalid');
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }
  }

  function hideBanner(){
    errorBanner.textContent = '';
    errorBanner.classList.remove('visible');
  }

  function showBanner(message){
    errorBanner.textContent = message;
    errorBanner.classList.add('visible');
  }

  function showSuccess(emailValue){
    formView.hidden = true;
    successView.hidden = false;
    successMessage.innerHTML =
      'If an account exists for <strong>' + escapeHtml(emailValue) + '</strong>, ' +
      'we&rsquo;ve sent a password reset link to it.';
  }

  function escapeHtml(str){
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function isRateLimitOrNetworkError(error){
    if (!error) return false;
    var msg = (error.message || '').toLowerCase();
    return msg.indexOf('rate') !== -1 ||
           msg.indexOf('limit') !== -1 ||
           msg.indexOf('network') !== -1 ||
           msg.indexOf('fetch') !== -1 ||
           error.status === 429;
  }

  emailInput.addEventListener('blur', function(){
    showFieldError(validateEmail(emailInput));
  });

  var supabaseClient = null;
  try {
    var url = FAITHBASE_CONFIG.supabase.url;
    var key = FAITHBASE_CONFIG.supabase.anonKey;
    if (url && key && url.indexOf('YOUR-') === -1){
      supabaseClient = supabase.createClient(url, key);
    }
  } catch (e) {}

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    hideBanner();

    var validationMessage = validateEmail(emailInput);
    showFieldError(validationMessage);
    if (validationMessage) return;

    if (!supabaseClient){
      showBanner('Password reset is not available yet. Please try again later.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Sending\u2026';

    var emailValue = emailInput.value.trim();

    try {
      var result = await supabaseClient.auth.resetPasswordForEmail(emailValue, {
        redirectTo: window.location.origin + '/auth/reset-password.html'
      });

      if (result.error && isRateLimitOrNetworkError(result.error)){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
        showBanner(result.error.message || 'Something went wrong. Please try again.');
        return;
      }

      showSuccess(emailValue);
    } catch (err){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
      showBanner('Something went wrong. Please check your connection and try again.');
    }
  });
})();
</script>
</body>
</html>
