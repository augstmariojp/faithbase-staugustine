<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Directory — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1C;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;padding-bottom:76px;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;}
  .member-page{padding:28px 20px 32px;max-width:720px;margin:0 auto;}
  .page-heading{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--maroon);margin-bottom:20px;}
  .filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .search-input,.role-select{flex:1;min-width:160px;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(107,31,53,0.2);border-radius:999px;background:var(--ivory);}
  .search-input:focus,.role-select:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .count-text{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;}
  .member-list{display:flex;flex-direction:column;gap:8px;}
  .member-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-left:3px solid var(--maroon);border-radius:10px;padding:14px 16px;cursor:pointer;font-family:var(--font-body);transition:box-shadow .15s ease,transform .15s ease;}
  .member-row:hover,.member-row:focus-visible{box-shadow:0 4px 16px -6px rgba(36,16,25,0.15);transform:translateY(-1px);}
  .member-row .name{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--maroon);flex:1;min-width:0;}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
  .badge-role{background:rgba(107,31,53,0.1);color:var(--maroon);}
  .badge-admin{background:rgba(201,162,39,0.22);color:var(--maroon);}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state p{font-size:15px;}
  .skeleton-list{display:flex;flex-direction:column;gap:8px;}
  .skeleton-row{height:56px;border-radius:10px;background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);z-index:100;background:var(--ivory);border-radius:12px;border-top:3px solid var(--maroon);padding:28px 24px;width:calc(100% - 40px);max-width:440px;max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 20px 48px -12px rgba(36,16,25,0.35);}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:12px;}
  .modal-detail{font-size:14px;line-height:1.65;color:var(--ink-soft);margin-bottom:8px;}
  .modal-detail strong{color:var(--ink);}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);width:100%;margin-top:16px;}
  .member-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;background:var(--maroon-deep);border-top:1px solid rgba(201,162,39,0.25);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));min-height:76px;}
  .member-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:rgba(255,251,243,0.7);background:none;border:none;cursor:pointer;padding:6px 4px;font-family:var(--font-body);}
  .member-nav-item svg{width:22px;height:22px;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-drawer-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;}
  .member-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .member-drawer{position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--ivory);border-radius:16px 16px 0 0;border-top:3px solid var(--maroon);padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s;}
  .member-drawer.open{transform:translateY(0);}
  .member-drawer h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-drawer-links a{display:block;padding:12px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);}
  body.checking-session .member-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.member-page{padding:24px 16px 28px;}.page-heading{font-size:28px;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.skeleton-row,.modal,.modal-backdrop,.member-row{animation:none;transition:none;}.member-row:hover,.member-row:focus-visible{transform:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><picture><source srcset="../../assets/st-augustine-choir-crest.webp" type="image/webp"><img src="../../assets/st-augustine-choir-crest.png" alt="" class="brand-mark-img"></picture><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="member-page">
  <h1 class="page-heading">Member Directory</h1>
  <div class="filters">
    <input type="search" class="search-input" id="search-input" placeholder="Search by name…" aria-label="Search members">
    <select class="role-select" id="role-filter" aria-label="Filter by role">
      <option value="">All Roles</option>
      <option value="member">Member</option>
      <option value="president">President</option>
      <option value="vp">VP</option>
      <option value="secretary">Secretary</option>
      <option value="fin_secretary">Financial Secretary</option>
      <option value="treasurer">Treasurer</option>
      <option value="welfare_officer">Welfare Officer</option>
      <option value="pro">PRO</option>
      <option value="admin">Admin</option>
    </select>
  </div>
  <p class="count-text" id="count-text">Showing 0 of 0 members</p>
  <div id="list-loading" class="skeleton-list"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
  <div id="list-content" hidden></div>
</main>
<div class="modal-backdrop" id="modal-backdrop" hidden></div>
<div class="modal" id="member-modal" role="dialog" aria-labelledby="modal-name" aria-hidden="true" hidden>
  <h2 id="modal-name"></h2>
  <div id="modal-body"></div>
  <button type="button" class="btn" id="modal-close">Close</button>
</div>
<nav class="member-nav" aria-label="Main navigation">
  <a href="../dashboard.html" class="member-nav-item" data-nav="home"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Home</span></a>
  <a href="../meetings/index.html" class="member-nav-item" data-nav="meetings"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16M9 14l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Meetings</span></a>
  <a href="../dues/index.html" class="member-nav-item" data-nav="dues"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M7 14h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Dues</span></a>
  <a href="../events/index.html" class="member-nav-item" data-nav="events"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13l1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 18.8l-2.4 1.4.5-2.6-1.9-1.8 2.6-.4L12 13z" fill="currentColor"/></svg><span>Events</span></a>
  <button type="button" class="member-nav-item" data-nav="more" id="nav-more-btn"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="1.5" fill="currentColor"/><circle cx="12" cy="6" r="1.5" fill="currentColor"/><circle cx="18" cy="6" r="1.5" fill="currentColor"/><circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/><circle cx="18" cy="18" r="1.5" fill="currentColor"/></svg><span>More</span></button>
</nav>
<div class="member-drawer-backdrop" id="drawer-backdrop" hidden></div>
<div class="member-drawer" id="more-drawer" role="dialog" aria-hidden="true" hidden>
  <h2>More</h2>
  <div class="member-drawer-links">
    <a href="../announcements/index.html">Announcements</a>
    <a href="../welfare/index.html">Welfare</a>
    <a href="../documents/index.html">Documents</a>
    <a href="../profile.html">My Profile</a>
    <a href="index.html">Member Directory</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  var c=FAITHBASE_CONFIG.colors,root=document.documentElement;
  ['maroonDeep','maroon','goldBright','parchment','ivory','ink','inkSoft'].forEach(function(k){root.style.setProperty('--'+k.replace(/([A-Z])/g,'-$1').toLowerCase().replace(/^-/,''),c[k]);});
  document.title='Member Directory — '+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){var k=el.getAttribute('data-config');if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});

  var supabaseClient=null,allMembers=[],searchQuery='',roleFilter='';

  function firstName(n){return!n||!n.trim()?'Member':n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove('checking-session');}
  function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function formatDate(iso){if(!iso)return'\u2014';return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
  function roleLabel(r){return r==='president'?'President':r==='vp'?'VP':r==='secretary'?'Secretary':r==='fin_secretary'?'Financial Secretary':r==='treasurer'?'Treasurer':r==='welfare_officer'?'Welfare Officer':r==='pro'?'PRO':r==='admin'?'Admin':'Member';}
  function roleBadge(m){var cls=m.role==='admin'?'badge-admin':'badge-role';return'<span class="badge '+cls+'">'+escapeHtml(roleLabel(m.role))+'</span>';}

  function filteredList(){
    var list=allMembers.slice();
    if(roleFilter)list=list.filter(function(m){return m.role===roleFilter;});
    if(searchQuery){var q=searchQuery.toLowerCase();list=list.filter(function(m){return(m.full_name||'').toLowerCase().indexOf(q)!==-1;});}
    return list;
  }

  function renderList(){
    document.getElementById('list-loading').hidden=true;
    var content=document.getElementById('list-content');
    content.hidden=false;
    var list=filteredList();
    document.getElementById('count-text').textContent='Showing '+list.length+' of '+allMembers.length+' members';
    if(!list.length){
      content.innerHTML='<div class="empty-state"><p>No members found.</p></div>';
      return;
    }
    content.innerHTML='<div class="member-list">'+list.map(function(m){
      return'<button type="button" class="member-row" data-id="'+escapeHtml(m.id)+'"><span class="name">'+escapeHtml(m.full_name)+'</span>'+roleBadge(m)+'</button>';
    }).join('')+'</div>';
    content.querySelectorAll('.member-row').forEach(function(btn){
      btn.addEventListener('click',function(){openMemberModal(btn.getAttribute('data-id'));});
    });
  }

  var backdrop=document.getElementById('modal-backdrop'),modal=document.getElementById('member-modal');
  function openMemberModal(id){
    var m=allMembers.find(function(x){return x.id===id;});
    if(!m)return;
    document.getElementById('modal-name').textContent=m.full_name;
    var html='<p class="modal-detail">'+roleBadge(m)+'</p>'+
      '<p class="modal-detail"><strong>Date joined:</strong> '+escapeHtml(formatDate(m.date_joined))+'</p>';
    if(m.phone!=null&&m.phone!=='')html+='<p class="modal-detail"><strong>Phone:</strong> '+escapeHtml(m.phone)+'</p>';
    if(m.address!=null&&m.address!=='')html+='<p class="modal-detail"><strong>Address:</strong> '+escapeHtml(m.address)+'</p>';
    document.getElementById('modal-body').innerHTML=html;
    modal.hidden=false;backdrop.hidden=false;
    requestAnimationFrame(function(){modal.classList.add('open');backdrop.classList.add('open');modal.setAttribute('aria-hidden','false');});
  }
  function closeModal(){
    modal.classList.remove('open');backdrop.classList.remove('open');modal.setAttribute('aria-hidden','true');
    setTimeout(function(){modal.hidden=true;backdrop.hidden=true;},200);
  }
  document.getElementById('modal-close').addEventListener('click',closeModal);
  backdrop.addEventListener('click',closeModal);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();});

  document.getElementById('search-input').addEventListener('input',function(){searchQuery=this.value.trim();renderList();});
  document.getElementById('role-filter').addEventListener('change',function(){roleFilter=this.value;renderList();});

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf('YOUR-')===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}
  document.getElementById('sign-out-btn').addEventListener('click',async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace('../../index.html');});

  (async function init(){
    if(!supabaseClient){window.location.replace('../../auth/login.html');return;}
    var sessionResult=await supabaseClient.auth.getSession();
    var session=sessionResult.data&&sessionResult.data.session;
    if(!session){window.location.replace('../../auth/login.html');return;}
    var profileResult=await supabaseClient.from('profiles').select('full_name, status').eq('id',session.user.id).single();
    if(profileResult.error||!profileResult.data||profileResult.data.status!=='active'){await supabaseClient.auth.signOut();window.location.replace('../../auth/login.html');return;}
    document.getElementById('member-name').textContent=firstName(profileResult.data.full_name);
    var r=await supabaseClient.from('member_directory').select('id, full_name, role, date_joined, phone, address').order('full_name',{ascending:true});
    allMembers=r.data||[];
    renderList();
    revealPage();
  })();
})();
(function(){
  var moreBtn=document.getElementById('nav-more-btn'),drawer=document.getElementById('more-drawer'),backdrop=document.getElementById('drawer-backdrop');
  if(!moreBtn)return;
  function openDrawer(){drawer.hidden=false;backdrop.hidden=false;requestAnimationFrame(function(){drawer.classList.add('open');backdrop.classList.add('open');});}
  function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');setTimeout(function(){drawer.hidden=true;backdrop.hidden=true;},250);}
  moreBtn.addEventListener('click',function(){drawer.classList.contains('open')?closeDrawer():openDrawer();});
  backdrop.addEventListener('click',closeDrawer);
})();
</script>
</body>
</html>
