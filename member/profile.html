<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1C;--maroon:#6B1F35;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);min-height:100vh;padding-bottom:76px;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);}
  .brand-mark{width:28px;height:28px;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--gold-bright);color:var(--maroon-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-size:12px;font-weight:700;
    flex-shrink:0;
  }
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;white-space:nowrap;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);}
  .member-page{padding:28px 20px 32px;max-width:560px;margin:0 auto;}
  .page-heading{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--maroon);margin-bottom:24px;text-align:center;}
  .profile-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--maroon);border-radius:10px;padding:28px 24px 32px;box-shadow:0 4px 24px -8px rgba(36,16,25,0.1);}
  .profile-header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px;}
  .avatar{width:88px;height:88px;border-radius:50%;background:rgba(92,58,68,0.15);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin-bottom:14px;letter-spacing:0.04em;}
  .profile-name{font-family:var(--font-display);font-size:clamp(24px,5vw,28px);font-weight:600;color:var(--maroon);margin-bottom:10px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge-role{background:rgba(107,31,53,0.1);color:var(--maroon);text-transform:none;letter-spacing:0;}
  .badge-admin{background:rgba(201,162,39,0.22);color:var(--maroon);text-transform:none;}
  .badge-active{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-pending{background:rgba(183,121,31,0.15);color:var(--amber);}
  .badge-inactive,.badge-suspended{background:rgba(92,58,68,0.12);color:var(--ink-soft);}
  .info-block{margin-bottom:18px;}
  .info-block .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--maroon);margin-bottom:4px;}
  .info-block .val{font-size:15px;color:var(--ink);line-height:1.55;}
  .info-block .note{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:4px;}
  .info-block .val.readonly{color:var(--ink-soft);}
  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0;}
  .stat-mini{background:var(--parchment);border-radius:8px;padding:14px 12px;text-align:center;}
  .stat-mini .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:6px;}
  .stat-mini .val{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--maroon);line-height:1.3;}
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field input{width:100%;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(107,31,53,0.2);border-radius:8px;background:var(--parchment);}
  .form-field input:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}
  .field-error{display:none;font-size:12.5px;color:var(--error);margin-top:6px;}
  .field-error.visible{display:block;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease;}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);}
  .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-secondary{background:transparent;border:1px solid rgba(107,31,53,0.3);color:var(--maroon);box-shadow:none;}
  .btn-secondary:hover,.btn-secondary:focus-visible{background:rgba(107,31,53,0.06);transform:none;box-shadow:none;}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;}
  .btn-row .btn{flex:1;min-width:120px;}
  .edit-actions{display:none;}
  .edit-actions.visible{display:flex;}
  .view-actions.visible{display:flex;}
  .view-actions{display:none;justify-content:center;}
  .success-banner{display:none;position:relative;background:rgba(240,204,92,0.18);border:1px solid rgba(201,162,39,0.45);border-radius:8px;padding:12px 40px 12px 14px;font-size:14px;color:var(--maroon-deep);margin-bottom:16px;}
  .success-banner.visible{display:block;}
  .success-banner-dismiss{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--maroon);font-size:18px;padding:4px;}
  .error-banner{display:none;background:rgba(180,35,24,0.08);border:1px solid rgba(180,35,24,0.25);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--error);margin-bottom:16px;}
  .error-banner.visible{display:block;}
  .spinner{width:16px;height:16px;border:2px solid rgba(62,15,28,0.2);border-top-color:var(--maroon-deep);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .member-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;background:var(--maroon-deep);border-top:1px solid rgba(201,162,39,0.25);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));min-height:76px;}
  .member-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:rgba(255,251,243,0.7);background:none;border:none;cursor:pointer;padding:6px 4px;font-family:var(--font-body);}
  .member-nav-item svg{width:22px;height:22px;}
  .member-nav-item.active{color:var(--gold-bright);}
  body.checking-session .member-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.member-page{padding:24px 16px 28px;}.stats-row{grid-template-columns:1fr;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.spinner,.btn:hover,.btn:focus-visible{transform:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../index.html" class="brand"><picture><source srcset="../assets/st-augustine-choir-crest.webp" type="image/webp"><img src="../assets/st-augustine-choir-crest.png" alt="" class="brand-mark-img"></picture><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><span class="header-avatar" id="header-avatar" aria-hidden="true"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="member-page">
  <h1 class="page-heading">My Profile</h1>
  <div id="success-banner" class="success-banner" role="status">Profile updated.<button type="button" class="success-banner-dismiss" id="dismiss-success" aria-label="Dismiss">&times;</button></div>
  <div id="error-banner" class="error-banner" role="alert"></div>
  <div class="profile-card" id="profile-card" hidden>
    <div class="profile-header">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <h2 class="profile-name" id="display-name"></h2>
      <div class="badge-row" id="badge-row"></div>
    </div>
    <div id="view-mode">
      <div class="info-block"><p class="lbl">Email</p><p class="val" id="view-email"></p><p class="note">Email cannot be changed</p></div>
      <div class="info-block"><p class="lbl">Phone</p><p class="val" id="view-phone"></p></div>
      <div class="info-block"><p class="lbl">Address</p><p class="val" id="view-address"></p></div>
      <div class="info-block"><p class="lbl">Date Joined</p><p class="val readonly" id="view-joined"></p></div>
      <div class="info-block"><p class="lbl">Role</p><p class="val readonly" id="view-role"></p></div>
      <div class="info-block"><p class="lbl">Status</p><p class="val readonly" id="view-status"></p></div>
    </div>
    <div id="edit-mode" hidden>
      <div class="form-field"><label for="edit-name">Full Name</label><input type="text" id="edit-name" autocomplete="name"><p class="field-error" id="error-name"></p></div>
      <div class="form-field"><label for="edit-phone">Phone</label><input type="tel" id="edit-phone" autocomplete="tel" placeholder="080XXXXXXXX"><p class="field-error" id="error-phone"></p></div>
      <div class="form-field"><label for="edit-address">Address</label><input type="text" id="edit-address" autocomplete="street-address"><p class="field-error" id="error-address"></p></div>
      <div class="info-block"><p class="lbl">Email</p><p class="val readonly" id="edit-email"></p><p class="note">Email cannot be changed</p></div>
      <div class="info-block"><p class="lbl">Date Joined</p><p class="val readonly" id="edit-joined"></p></div>
      <div class="info-block"><p class="lbl">Role</p><p class="val readonly" id="edit-role"></p></div>
      <div class="info-block"><p class="lbl">Status</p><p class="val readonly" id="edit-status"></p></div>
    </div>
    <div class="stats-row">
      <div class="stat-mini"><p class="lbl">Attendance Rate</p><p class="val" id="stat-attendance">—</p></div>
      <div class="stat-mini"><p class="lbl">Dues Summary</p><p class="val" id="stat-dues">—</p></div>
    </div>
    <div class="view-actions visible" id="view-actions">
      <button type="button" class="btn" id="edit-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 00-3-3L5 17v3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg> Edit Profile</button>
    </div>
    <div class="btn-row edit-actions" id="edit-actions">
      <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
      <button type="button" class="btn" id="save-btn">Save</button>
    </div>
  </div>
</main>

  <a href="dashboard.html" class="member-nav-item" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </a>
  <a href="events/index.html" class="member-nav-item" data-nav="events">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13l1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 18.8l-2.4 1.4.5-2.6-1.9-1.8 2.6-.4L12 13z" fill="currentColor"/></svg>
    <span>Events</span>
  </a>
  <a href="profile.html" class="member-nav-item" data-nav="profile">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 20v-1a6 6 0 0112 0v1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Profile</span>
  </a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";
  var c=FAITHBASE_CONFIG.colors,root=document.documentElement;
  root.style.setProperty('--maroon-deep',c.maroonDeep);root.style.setProperty('--maroon',c.maroon);
  root.style.setProperty('--gold-bright',c.goldBright);root.style.setProperty('--parchment',c.parchment);
  root.style.setProperty('--ivory',c.ivory);root.style.setProperty('--ink',c.ink);root.style.setProperty('--ink-soft',c.inkSoft);
  document.title='My Profile — '+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){var k=el.getAttribute('data-config');if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});
  document.getElementById('dismiss-success').addEventListener('click',function(){document.getElementById('success-banner').classList.remove('visible');});

  var supabaseClient=null,profile=null,userEmail='',duesConfig=[],duesPayments=[],joinedYear,joinedMonth;

  function firstName(n){return!n||!n.trim()?'Member':n.trim().split(/\s+/)[0];}
  function getInitials(name){
    if (!name || !name.trim()) return '?';
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }
  function revealPage(){document.body.classList.remove('checking-session');}
  function formatNaira(a){return'\u20A6'+Number(a||0).toLocaleString('en-NG');}
  function formatDate(iso){if(!iso)return'\u2014';return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
  function initials(name){var p=(name||'').trim().split(/\s+/).filter(Boolean);if(p.length>=2)return(p[0][0]+p[p.length-1][0]).toUpperCase();return(p[0]&&p[0][0]?p[0][0]:'M').toUpperCase();}
  function roleLabel(r){return r==='president'?'President':r==='vp'?'VP':r==='secretary'?'Secretary':r==='fin_secretary'?'Financial Secretary':r==='treasurer'?'Treasurer':r==='welfare_officer'?'Welfare Officer':r==='pro'?'PRO':r==='admin'?'Admin':'Member';}
  function statusLabel(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'Unknown';}

  function validatePhone(phone){
    var c=phone.replace(/[\s\-()]/g,'');
    if(!/^(\+?234|0)[789][01]\d{8}$/.test(c))return'Enter a valid Nigerian phone number.';
    return'';
  }

  function expectedAmountForMonth(y,m){
    var first=new Date(y,m-1,1),app=null;
    for(var i=0;i<duesConfig.length;i++){var eff=new Date(duesConfig[i].effective_from);if(eff<=first)app=duesConfig[i];else break;}
    return app?Number(app.amount):null;
  }
  function hasPayment(y,m){return duesPayments.some(function(p){return Number(p.period_year)===y&&Number(p.period_month)===m;});}
  function getMonthState(y,m){
    var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
    if(y<joinedYear||(y===joinedYear&&m<joinedMonth))return'before-joined';
    if(y>cy||(y===cy&&m>cm))return'not-due';
    if(hasPayment(y,m))return'paid';
    if(expectedAmountForMonth(y,m)===null)return'not-configured';
    return'outstanding';
  }

  function computeDuesSummary(){
    var cy=new Date().getFullYear(),months=0,total=0;
    for(var m=1;m<=12;m++){
      if(getMonthState(cy,m)==='outstanding'){months++;total+=expectedAmountForMonth(cy,m)||0;}
    }
    return{months:months,total:total};
  }

  function renderBadges(){
    var roleCls=profile.role==='admin'?'badge-admin':'badge-role';
    document.getElementById('badge-row').innerHTML=
      '<span class="badge '+roleCls+'">'+roleLabel(profile.role)+'</span>'+
      '<span class="badge badge-'+(profile.status||'inactive')+'">'+statusLabel(profile.status)+'</span>';
  }

  function fillView(){
    document.getElementById('avatar').textContent=initials(profile.full_name);
    document.getElementById('display-name').textContent=profile.full_name||'';
    document.getElementById('view-email').textContent=userEmail||'\u2014';
    document.getElementById('view-phone').textContent=profile.phone||'\u2014';
    document.getElementById('view-address').textContent=profile.address||'\u2014';
    document.getElementById('view-joined').textContent=formatDate(profile.date_joined||profile.created_at);
    document.getElementById('view-role').textContent=roleLabel(profile.role);
    document.getElementById('view-status').textContent=statusLabel(profile.status);
    renderBadges();
  }

  function fillEdit(){
    document.getElementById('edit-name').value=profile.full_name||'';
    document.getElementById('edit-phone').value=profile.phone||'';
    document.getElementById('edit-address').value=profile.address||'';
    document.getElementById('edit-email').textContent=userEmail||'\u2014';
    document.getElementById('edit-joined').textContent=formatDate(profile.date_joined||profile.created_at);
    document.getElementById('edit-role').textContent=roleLabel(profile.role);
    document.getElementById('edit-status').textContent=statusLabel(profile.status);
  }

  function setMode(editing){
    document.getElementById('view-mode').hidden=editing;
    document.getElementById('edit-mode').hidden=!editing;
    document.getElementById('view-actions').classList.toggle('visible',!editing);
    document.getElementById('edit-actions').classList.toggle('visible',editing);
    if(editing)fillEdit();
    else fillView();
  }

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf('YOUR-')===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById('sign-out-btn').addEventListener('click',async function(){try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}window.location.replace('../index.html');});
  document.getElementById('edit-btn').addEventListener('click',function(){setMode(true);});
  document.getElementById('cancel-btn').addEventListener('click',function(){setMode(false);});

  document.getElementById('save-btn').addEventListener('click',async function(){
    document.getElementById('error-banner').classList.remove('visible');
    ['error-name','error-phone','error-address'].forEach(function(id){document.getElementById(id).classList.remove('visible');document.getElementById(id).textContent='';});
    var name=document.getElementById('edit-name').value.trim();
    var phone=document.getElementById('edit-phone').value.trim();
    var address=document.getElementById('edit-address').value.trim();
    var valid=true;
    if(!name){document.getElementById('error-name').textContent='Full name is required.';document.getElementById('error-name').classList.add('visible');valid=false;}
    var phoneErr=validatePhone(phone);
    if(phoneErr){document.getElementById('error-phone').textContent=phoneErr;document.getElementById('error-phone').classList.add('visible');valid=false;}
    if(!address){document.getElementById('error-address').textContent='Address is required.';document.getElementById('error-address').classList.add('visible');valid=false;}
    if(!valid)return;
    var btn=document.getElementById('save-btn');
    btn.disabled=true;btn.innerHTML='<span class="spinner" aria-hidden="true"></span> Saving\u2026';
    var r=await supabaseClient.from('profiles').update({full_name:name,phone:phone,address:address}).eq('id',profile.id);
    btn.disabled=false;btn.textContent='Save';
    if(r.error){document.getElementById('error-banner').textContent=r.error.message;document.getElementById('error-banner').classList.add('visible');return;}
    profile.full_name=name;profile.phone=phone;profile.address=address;
    document.getElementById('member-name').textContent=firstName(name);

    document.getElementById('header-avatar').textContent = getInitials(name);
    setMode(false);
    document.getElementById('success-banner').classList.add('visible');
  });

  (async function init(){
    if(!supabaseClient){window.location.replace('../auth/login.html');return;}
    var sessionResult=await supabaseClient.auth.getSession();
    var session=sessionResult.data&&sessionResult.data.session;
    if(!session){window.location.replace('../auth/login.html');return;}
    var userResult=await supabaseClient.auth.getUser();
    userEmail=userResult.data&&userResult.data.user?userResult.data.user.email:'';
    var profileResult=await supabaseClient.from('profiles').select('id, full_name, phone, address, role, status, date_joined, created_at').eq('id',session.user.id).single();
    profile=profileResult.data;
    if(profileResult.error||!profile||profile.status!=='active'){await supabaseClient.auth.signOut();window.location.replace('../auth/login.html');return;}
    document.getElementById('member-name').textContent=firstName(profile.full_name);

    document.getElementById('header-avatar').textContent = getInitials(profile.full_name);
    var joined=new Date(profile.date_joined||profile.created_at);
    joinedYear=joined.getFullYear();joinedMonth=joined.getMonth()+1;
    var cy=new Date().getFullYear();
    var results=await Promise.all([
      supabaseClient.from('attendance').select('status').eq('member_id',profile.id),
      supabaseClient.from('dues_config').select('amount, effective_from').order('effective_from',{ascending:true}),
      supabaseClient.from('dues_payments').select('period_month, period_year').eq('member_id',profile.id).eq('period_year',cy)
    ]);
    var attendance=results[0].data||[];
    duesConfig=results[1].data||[];
    duesPayments=results[2].data||[];
    var present=attendance.filter(function(a){return a.status==='present';}).length;
    var rate=attendance.length?Math.round((present/attendance.length)*100):0;
    var dues=computeDuesSummary();
    document.getElementById('stat-attendance').textContent=rate+'%';
    document.getElementById('stat-dues').textContent=dues.months+' mo \u00b7 '+formatNaira(dues.total);
    fillView();
    document.getElementById('profile-card').hidden=false;
    revealPage();
  })();
})();
/* ── Member bottom nav (shared pattern) ── */
(function(){
  "use strict";
  var path = window.location.pathname;
  var active = null;
  if (path.indexOf('/dashboard.html') !== -1) active = 'home';
  else if (path.indexOf('/events') !== -1) active = 'events';
  else if (path.indexOf('/profile.html') !== -1) active = 'profile';
  document.querySelectorAll('.member-nav-item[data-nav]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-nav') === active);
  });
})();
</script>
