<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — St. Augustine Choir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --maroon-deep:  #3E0F1C;
    --maroon:       #6B1F35;
    --maroon-light: #8A2E45;
    --gold:         #C9A227;
    --gold-bright:  #F0CC5C;
    --parchment:    #F7EFE0;
    --ivory:        #FFFBF3;
    --ink:          #241019;
    --ink-soft:     #5C3A44;
    --error:        #B42318;
    --success:      #2D6A4F;
    --amber:        #B7791F;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--parchment);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:76px;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}

  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:var(--maroon-deep);
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:20px;font-weight:600;
    color:var(--ivory);
    letter-spacing:0.01em;
  }
  .brand-mark{width:28px;height:28px;flex-shrink:0;color:var(--gold-bright);}
  .brand-mark svg{width:100%;height:100%;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{
    font-size:14px;font-weight:600;color:var(--gold-bright);
    padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;
    background:transparent;cursor:pointer;white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);border-color:var(--gold-bright);}
  .header-signin:disabled{opacity:0.7;cursor:not-allowed;}

  .member-page{padding:28px 20px 32px;max-width:720px;margin:0 auto;}
  .page-heading{
    font-family:var(--font-display);
    font-weight:600;font-size:32px;
    color:var(--maroon);
    margin-bottom:24px;
  }

  .tabs-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin-bottom:24px;
    border-bottom:1px solid rgba(107,31,53,0.15);
    scrollbar-width:thin;
    scrollbar-color:rgba(107,31,53,0.25) transparent;
  }
  .tabs-scroll::-webkit-scrollbar{height:4px;}
  .tabs-scroll::-webkit-scrollbar-thumb{background:rgba(107,31,53,0.25);border-radius:4px;}
  .tabs{
    display:flex;
    flex-wrap:nowrap;
    min-width:min-content;
  }
  .tab-btn{
    flex:0 0 auto;
    padding:12px 14px;
    background:none;border:none;border-bottom:2px solid transparent;
    font-family:var(--font-body);font-size:14px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
    margin-bottom:-1px;
    white-space:nowrap;
  }
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--gold);}
  .tab-btn:hover,.tab-btn:focus-visible{color:var(--maroon);}

  .doc-list{display:flex;flex-direction:column;gap:12px;}
  .doc-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-left:3px solid var(--maroon);
    border-radius:10px;
    padding:16px 18px;
    flex-wrap:wrap;
  }
  .doc-row-main{flex:1;min-width:180px;}
  .doc-row h3{
    font-family:var(--font-display);
    font-size:19px;font-weight:600;
    color:var(--maroon);
    line-height:1.25;
    margin-bottom:8px;
  }
  .doc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .doc-meta{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .row-error{
    display:none;
    font-size:12.5px;
    color:var(--error);
    margin-top:8px;
    line-height:1.45;
  }
  .row-error.visible{display:block;}

  .badge{
    flex-shrink:0;
    font-size:11px;font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge-category{background:rgba(107,31,53,0.1);color:var(--maroon);text-transform:none;letter-spacing:0;}
  .badge-executive{background:rgba(201,162,39,0.22);color:var(--maroon);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--font-body);font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;border:none;cursor:pointer;
    background:var(--gold-bright);color:var(--maroon-deep);
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;flex-shrink:0;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);
  }
  .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;box-shadow:none;}

  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{width:48px;height:48px;color:var(--gold);margin:0 auto 16px;opacity:0.7;display:block;}
  .empty-state p{font-size:15px;line-height:1.6;}

  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-row{
    height:96px;border-radius:10px;
    background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .member-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    display:flex;justify-content:space-around;align-items:stretch;
    background:var(--maroon-deep);
    border-top:1px solid rgba(201,162,39,0.25);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    min-height:76px;
  }
  .member-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-size:11px;font-weight:600;
    color:rgba(255,251,243,0.7);
    background:none;border:none;cursor:pointer;
    padding:6px 4px;font-family:var(--font-body);
    transition:color .15s ease;
  }
  .member-nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-nav-item:hover,.member-nav-item:focus-visible{color:var(--gold-bright);}
  .member-drawer-backdrop{
    position:fixed;inset:0;background:rgba(36,16,25,0.45);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .member-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .member-drawer{
    position:fixed;bottom:0;left:0;right:0;z-index:80;
    background:var(--ivory);border-radius:16px 16px 0 0;
    border-top:3px solid var(--maroon);
    padding:20px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    transform:translateY(100%);transition:transform .25s ease;
    box-shadow:0 -8px 32px -8px rgba(36,16,25,0.2);
  }
  .member-drawer.open{transform:translateY(0);}
  .member-drawer h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-drawer-links{display:flex;flex-direction:column;gap:4px;}
  .member-drawer-links a{display:block;padding:12px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);transition:background .15s ease;}
  .member-drawer-links a:hover,.member-drawer-links a:focus-visible{background:rgba(107,31,53,0.08);color:var(--maroon);}

  body.checking-session .member-page{visibility:hidden;}

  @media (max-width:720px){
    .site-header{padding:14px 18px;}
    .header-actions{gap:8px;}
    .header-member-name{font-size:13px;}
    .header-signin{padding:8px 14px;font-size:13px;}
    .member-page{padding:24px 16px 28px;}
    .page-heading{font-size:28px;}
    .tab-btn{font-size:13px;padding:10px 12px;}
    .doc-row{align-items:stretch;}
    .doc-row .btn{width:100%;margin-top:4px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .skeleton-row{animation:none;background:rgba(107,31,53,0.08);}
    .member-drawer,.member-drawer-backdrop{transition:none;}
    .btn:hover,.btn:focus-visible{transform:none;}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var c = FAITHBASE_CONFIG.colors;
  root.style.setProperty('--maroon-deep',  c.maroonDeep);
  root.style.setProperty('--maroon',       c.maroon);
  root.style.setProperty('--maroon-light', c.maroonLight);
  root.style.setProperty('--gold',         c.gold);
  root.style.setProperty('--gold-bright',  c.goldBright);
  root.style.setProperty('--parchment',    c.parchment);
  root.style.setProperty('--ivory',        c.ivory);
  root.style.setProperty('--ink',          c.ink);
  root.style.setProperty('--ink-soft',     c.inkSoft);

  document.title = 'Documents — ' + FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){
    var key = el.getAttribute('data-config');
    if (FAITHBASE_CONFIG[key] !== undefined) el.textContent = FAITHBASE_CONFIG[key];
  });

  var memberNameEl = document.getElementById('member-name');
  var signOutBtn = document.getElementById('sign-out-btn');
  var supabaseClient = null;
  var allDocuments = [];
  var activeCategory = 'all';

  function firstName(fullName){
    if (!fullName || !fullName.trim()) return 'Member';
    return fullName.trim().split(/\s+/)[0];
  }

  function revealPage(){
    document.body.classList.remove('checking-session');
  }

  function redirectToLogin(){
    window.location.replace('../../auth/login.html');
  }

  function escapeHtml(str){
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function categoryLabel(cat){
    if (cat === 'constitution') return 'Constitution';
    if (cat === 'minutes') return 'Minutes';
    if (cat === 'financial') return 'Financial';
    if (cat === 'correspondence') return 'Correspondence';
    if (cat === 'certificate') return 'Certificate';
    if (cat === 'other') return 'Other';
    return cat || 'Other';
  }

  function formatFileSize(bytes){
    if (bytes === null || bytes === undefined) return '—';
    var n = Number(bytes);
    if (isNaN(n) || n <= 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function formatDate(iso){
    return new Date(iso).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  function emptyStateHtml(message){
    return '<div class="empty-state">' +
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 3H8a2 2 0 00-2 2v14a2 2 0 002 2h8a2 2 0 002-2V7l-4-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4M10 13h4M10 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
      '<p>' + escapeHtml(message) + '</p></div>';
  }

  function renderDocumentRow(doc){
    var execBadge = doc.access_level === 'executives_only'
      ? '<span class="badge badge-executive">Executive Only</span>'
      : '';
    return '<div class="doc-row" data-doc-id="' + escapeHtml(doc.id) + '">' +
      '<div class="doc-row-main">' +
      '<h3>' + escapeHtml(doc.title) + '</h3>' +
      '<div class="doc-badges">' +
      '<span class="badge badge-category">' + escapeHtml(categoryLabel(doc.category)) + '</span>' +
      execBadge +
      '</div>' +
      '<p class="doc-meta">' + escapeHtml(formatFileSize(doc.file_size)) +
      ' &middot; Uploaded ' + escapeHtml(formatDate(doc.created_at)) + '</p>' +
      '<p class="row-error" id="error-' + escapeHtml(doc.id) + '" role="alert"></p>' +
      '</div>' +
      '<button type="button" class="btn download-btn" data-doc-id="' + escapeHtml(doc.id) + '">Download</button>' +
      '</div>';
  }

  function renderList(){
    var loading = document.getElementById('docs-loading');
    var content = document.getElementById('docs-content');
    loading.hidden = true;
    content.hidden = false;

    var list = activeCategory === 'all'
      ? allDocuments
      : allDocuments.filter(function(d){ return d.category === activeCategory; });

    if (!list.length){
      var msg = (activeCategory === 'all' && !allDocuments.length)
        ? 'No documents have been uploaded yet.'
        : 'No documents in this category yet.';
      content.innerHTML = emptyStateHtml(msg);
      return;
    }

    content.innerHTML = '<div class="doc-list">' + list.map(renderDocumentRow).join('') + '</div>';

    content.querySelectorAll('.download-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ handleDownload(btn); });
    });
  }

  async function handleDownload(btn){
    var docId = btn.getAttribute('data-doc-id');
    var doc = allDocuments.find(function(d){ return d.id === docId; });
    if (!doc || !doc.file_url) return;

    var errEl = document.getElementById('error-' + docId);
    if (errEl){ errEl.textContent = ''; errEl.classList.remove('visible'); }

    btn.disabled = true;
    btn.textContent = 'Preparing\u2026';

    try {
      var result = await supabaseClient.storage
        .from('documents')
        .createSignedUrl(doc.file_url, 60);

      if (result.error || !result.data || !result.data.signedUrl){
        if (errEl){
          errEl.textContent = 'Couldn\u2019t prepare this download. Try again.';
          errEl.classList.add('visible');
        }
        return;
      }

      window.open(result.data.signedUrl, '_blank', 'noopener,noreferrer');
    } catch (e){
      if (errEl){
        errEl.textContent = 'Couldn\u2019t prepare this download. Try again.';
        errEl.classList.add('visible');
      }
    } finally {
      btn.disabled = false;
      btn.textContent = 'Download';
    }
  }

  function switchTab(category){
    activeCategory = category;
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      var active = btn.getAttribute('data-category') === category;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', String(active));
    });
    renderList();
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      switchTab(btn.getAttribute('data-category'));
    });
  });

  try {
    var url = FAITHBASE_CONFIG.supabase.url;
    var key = FAITHBASE_CONFIG.supabase.anonKey;
    if (url && key && url.indexOf('YOUR-') === -1){
      supabaseClient = supabase.createClient(url, key);
    }
  } catch (e) {}

  signOutBtn.addEventListener('click', async function(){
    signOutBtn.disabled = true;
    signOutBtn.textContent = 'Signing out\u2026';
    try { if (supabaseClient) await supabaseClient.auth.signOut(); } catch (e) {}
    window.location.replace('../../index.html');
  });

  (async function init(){
    if (!supabaseClient){ redirectToLogin(); return; }

    try {
      var sessionResult = await supabaseClient.auth.getSession();
      var session = sessionResult.data && sessionResult.data.session;
      if (!session){ redirectToLogin(); return; }

      var profileResult = await supabaseClient
        .from('profiles')
        .select('full_name, role, status')
        .eq('id', session.user.id)
        .single();

      var profile = profileResult.data;
      if (profileResult.error || !profile || profile.status !== 'active'){
        await supabaseClient.auth.signOut();
        redirectToLogin();
        return;
      }

      memberNameEl.textContent = firstName(profile.full_name);

      var docsResult = await supabaseClient
        .from('documents')
        .select('id, title, category, file_url, file_name, file_size, access_level, created_at')
        .order('created_at', { ascending: false });

      allDocuments = docsResult.data || [];
      renderList();
      revealPage();
    } catch (e){
      if (supabaseClient){ try { await supabaseClient.auth.signOut(); } catch (err) {} }
      redirectToLogin();
    }
  })();
})();

(function(){
  "use strict";
  var moreBtn = document.getElementById('nav-more-btn');
  var drawer = document.getElementById('more-drawer');
  var backdrop = document.getElementById('drawer-backdrop');
  if (!moreBtn || !drawer || !backdrop) return;

  function openDrawer(){
    drawer.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function(){
      drawer.classList.add('open');
      backdrop.classList.add('open');
    });
    drawer.setAttribute('aria-hidden', 'false');
    moreBtn.setAttribute('aria-expanded', 'true');
  }

  function closeDrawer(){
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    moreBtn.setAttribute('aria-expanded', 'false');
    setTimeout(function(){
      drawer.hidden = true;
      backdrop.hidden = true;
    }, 250);
  }

  moreBtn.addEventListener('click', function(){
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  var path = window.location.pathname;
  var active = 'home';
  if (path.indexOf('/meetings') !== -1) active = 'meetings';
  else if (path.indexOf('/dues') !== -1) active = 'dues';
  else if (path.indexOf('/events') !== -1) active = 'events';
  document.querySelectorAll('.member-nav-item[data-nav]').forEach(function(el){
    if (el.getAttribute('data-nav') === active) el.classList.add('active');
    else if (el.getAttribute('data-nav') !== 'more') el.classList.remove('active');
  });
})();
</script>
</body>
</html>
