<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--maroon-light:#8A2E45;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--amber:#B7791F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:76px;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);letter-spacing:0.01em;}
  .brand-mark{width:28px;height:28px;flex-shrink:0;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;white-space:nowrap;transition:background .18s ease,color .18s ease,border-color .18s ease;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);border-color:var(--gold-bright);}
  .header-signin:disabled{opacity:0.7;cursor:not-allowed;}
  .member-page{padding:24px 20px 32px;max-width:720px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:20px;transition:color .15s ease;}
  .back-link:hover,.back-link:focus-visible{color:var(--maroon-deep);}
  .back-link svg{width:18px;height:18px;flex-shrink:0;}
  .detail-title{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,5vw,34px);color:var(--maroon);margin-bottom:12px;line-height:1.15;}
  .detail-meta{font-size:15px;color:var(--ink-soft);line-height:1.65;margin-bottom:20px;}
  .detail-card{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--maroon);border-radius:10px;padding:22px 24px;margin-bottom:20px;box-shadow:0 2px 12px -6px rgba(36,16,25,0.08);}
  .detail-card h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:14px;}
  .detail-card-body{font-size:15px;line-height:1.75;color:var(--ink-soft);white-space:pre-wrap;}
  .rsvp-section{background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-top:3px solid var(--gold);border-radius:10px;padding:22px 24px;margin-bottom:20px;}
  .rsvp-section h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .rsvp-buttons{display:flex;flex-direction:column;gap:10px;}
  .rsvp-btn{font-family:var(--font-body);font-size:15px;font-weight:600;padding:14px 20px;border-radius:999px;border:2px solid rgba(107,31,53,0.2);background:var(--parchment);color:var(--maroon);cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .rsvp-btn:hover,.rsvp-btn:focus-visible{border-color:var(--gold);background:rgba(201,162,39,0.12);}
  .rsvp-btn.selected{background:var(--maroon);border-color:var(--maroon);color:var(--ivory);}
  .rsvp-btn.selected:hover,.rsvp-btn.selected:focus-visible{background:var(--maroon-deep);border-color:var(--maroon-deep);}
  .rsvp-btn:disabled{opacity:0.6;cursor:not-allowed;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state svg{width:48px;height:48px;color:var(--gold);margin:0 auto 16px;opacity:0.7;display:block;}
  .empty-state h1{font-family:var(--font-display);font-size:26px;color:var(--maroon);margin-bottom:10px;}
  .empty-state p{font-size:15px;margin-bottom:20px;line-height:1.6;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:15px;font-weight:600;padding:14px 30px;border-radius:999px;border:none;cursor:pointer;background:var(--gold-bright);color:var(--maroon-deep);transition:transform .15s ease,box-shadow .15s ease;}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);}
  .skeleton-block{height:120px;border-radius:10px;margin-bottom:16px;background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .member-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;align-items:stretch;background:var(--maroon-deep);border-top:1px solid rgba(201,162,39,0.25);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));min-height:76px;}
  .member-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:rgba(255,251,243,0.7);background:none;border:none;cursor:pointer;padding:6px 4px;font-family:var(--font-body);transition:color .15s ease;}
  .member-nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-nav-item:hover,.member-nav-item:focus-visible{color:var(--gold-bright);}
  .member-drawer-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .member-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .member-drawer{position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--ivory);border-radius:16px 16px 0 0;border-top:3px solid var(--maroon);padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -8px 32px -8px rgba(36,16,25,0.2);}
  .member-drawer.open{transform:translateY(0);}
  .member-drawer h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-drawer-links{display:flex;flex-direction:column;gap:4px;}
  .member-drawer-links a{display:block;padding:12px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);transition:background .15s ease;}
  .member-drawer-links a:hover,.member-drawer-links a:focus-visible{background:rgba(107,31,53,0.08);color:var(--maroon);}
  body.checking-session .member-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.header-actions{gap:8px;}.header-member-name{font-size:13px;}.header-signin{padding:8px 14px;font-size:13px;}.member-page{padding:20px 16px 28px;}.detail-card{padding:18px 20px;}.rsvp-section{padding:18px 20px;}}
  @media (min-width:480px){.rsvp-buttons{flex-direction:row;flex-wrap:wrap;}.rsvp-btn{flex:1;min-width:140px;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.skeleton-block,.member-drawer,.member-drawer-backdrop{animation:none;transition:none;}.btn:hover,.btn:focus-visible{transform:none;}}
</style>
</head>
<body class="checking-session">
<header class="site-header">
  <a href="../../index.html" class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span><span data-config="communityShortName">St. Augustine Choir</span></a>
  <div class="header-actions"><span class="header-member-name" id="member-name"></span><button type="button" class="header-signin" id="sign-out-btn">Sign Out</button></div>
</header>
<main class="member-page">
  <div id="loading-view"><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
  <div id="detail-view" hidden>
    <a href="index.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to Events</a>
    <h1 class="detail-title" id="event-title"></h1>
    <p class="detail-meta" id="event-meta"></p>
    <div class="detail-card" id="description-section" hidden>
      <h2>About</h2>
      <div class="detail-card-body" id="event-description"></div>
    </div>
    <div class="rsvp-section" id="rsvp-section" hidden>
      <h2>Your RSVP</h2>
      <div class="rsvp-buttons">
        <button type="button" class="rsvp-btn" data-response="attending">Attending</button>
        <button type="button" class="rsvp-btn" data-response="not_attending">Not Attending</button>
        <button type="button" class="rsvp-btn" data-response="maybe">Maybe</button>
      </div>
    </div>
  </div>
  <div id="not-found-view" hidden>
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <h1>Event not found</h1>
      <p>This event may have been removed or the link is no longer valid.</p>
      <a href="index.html" class="btn">Back to Events</a>
    </div>
  </div>
</main>
<nav class="member-nav" aria-label="Main navigation">
  <a href="../dashboard.html" class="member-nav-item" data-nav="home"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Home</span></a>
  <a href="../meetings/index.html" class="member-nav-item" data-nav="meetings"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16M9 14l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Meetings</span></a>
  <a href="../dues/index.html" class="member-nav-item" data-nav="dues"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M7 14h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Dues</span></a>
  <a href="index.html" class="member-nav-item active" data-nav="events"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13l1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 18.8l-2.4 1.4.5-2.6-1.9-1.8 2.6-.4L12 13z" fill="currentColor"/></svg><span>Events</span></a>
  <button type="button" class="member-nav-item" data-nav="more" id="nav-more-btn" aria-expanded="false" aria-controls="more-drawer"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="1.5" fill="currentColor"/><circle cx="12" cy="6" r="1.5" fill="currentColor"/><circle cx="18" cy="6" r="1.5" fill="currentColor"/><circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/><circle cx="18" cy="18" r="1.5" fill="currentColor"/></svg><span>More</span></button>
</nav>
<div class="member-drawer-backdrop" id="drawer-backdrop" hidden></div>

  <h2>More</h2>
  <div class="member-drawer-links">
    <a href="../announcements/index.html">Announcements</a>
    <a href="../welfare/index.html">Welfare</a>
    <a href="../documents/index.html">Documents</a>
    <a href="../directory/index.html">Directory</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";
  var eventId=new URLSearchParams(window.location.search).get("id");
  var supabaseClient=null,currentUserId=null,currentResponse=null;

  var root=document.documentElement,c=FAITHBASE_CONFIG.colors;
  ["maroonDeep","maroon","maroonLight","gold","goldBright","parchment","ivory","ink","inkSoft"].forEach(function(k,i){
    var vars=["maroon-deep","maroon","maroon-light","gold","gold-bright","parchment","ivory","ink","ink-soft"];
    root.style.setProperty("--"+vars[i],c[k]);
  });
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});

  var loadingView=document.getElementById("loading-view");
  var detailView=document.getElementById("detail-view");
  var notFoundView=document.getElementById("not-found-view");

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function redirectToLogin(){window.location.replace("../../auth/login.html");}
  function formatEventDate(iso){return new Date(iso).toLocaleString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});}

  function updateRsvpUI(){
    document.querySelectorAll(".rsvp-btn").forEach(function(btn){
      var sel=btn.getAttribute("data-response")===currentResponse;
      btn.classList.toggle("selected",sel);
      btn.setAttribute("aria-pressed",String(sel));
    });
  }

  function renderDetail(event){
    document.getElementById("event-title").textContent=event.title;
    document.getElementById("event-meta").textContent=formatEventDate(event.event_date)+(event.location?" · "+event.location:"");
    if(event.description&&event.description.trim()){
      document.getElementById("event-description").textContent=event.description.trim();
      document.getElementById("description-section").hidden=false;
    }
    if(event.rsvp_required){
      document.getElementById("rsvp-section").hidden=false;
      updateRsvpUI();
    }
    document.title=(event.title||"Event")+" — "+FAITHBASE_CONFIG.communityName;
    loadingView.hidden=true;notFoundView.hidden=true;detailView.hidden=false;
    revealPage();
  }

  function showNotFound(){
    loadingView.hidden=true;detailView.hidden=true;notFoundView.hidden=false;
    document.title="Event not found — "+FAITHBASE_CONFIG.communityName;
    revealPage();
  }

  document.querySelectorAll(".rsvp-btn").forEach(function(btn){
    btn.addEventListener("click",async function(){
      if(!eventId||!currentUserId)return;
      var response=btn.getAttribute("data-response");
      document.querySelectorAll(".rsvp-btn").forEach(function(b){b.disabled=true;});
      var r=await supabaseClient.from("event_rsvps").upsert(
        {event_id:eventId,member_id:currentUserId,response:response},
        {onConflict:"event_id,member_id"}
      );
      document.querySelectorAll(".rsvp-btn").forEach(function(b){b.disabled=false;});
      if(r.error)return;
      currentResponse=response;
      updateRsvpUI();
    });
  });

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){
    this.disabled=true;this.textContent="Signing out\u2026";
    try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}
    window.location.replace("../../index.html");
  });

  (async function init(){
    if(!supabaseClient||!eventId){showNotFound();return;}
    try{
      var sessionResult=await supabaseClient.auth.getSession();
      var session=sessionResult.data&&sessionResult.data.session;
      if(!session){redirectToLogin();return;}
      currentUserId=session.user.id;

      var profileResult=await supabaseClient.from("profiles").select("full_name,status").eq("id",session.user.id).single();
      var profile=profileResult.data;
      if(profileResult.error||!profile||profile.status!=="active"){await supabaseClient.auth.signOut();redirectToLogin();return;}
      document.getElementById("member-name").textContent=firstName(profile.full_name);

      var eventResult=await supabaseClient.from("events")
        .select("id, title, event_date, location, description, rsvp_required, status")
        .eq("id",eventId)
        .eq("status","scheduled")
        .maybeSingle();

      if(eventResult.error||!eventResult.data){showNotFound();return;}
      var event=eventResult.data;

      if(event.rsvp_required){
        var rsvpResult=await supabaseClient.from("event_rsvps")
          .select("response")
          .eq("event_id",eventId)
          .eq("member_id",currentUserId)
          .maybeSingle();
        if(rsvpResult.data&&rsvpResult.data.response)currentResponse=rsvpResult.data.response;
      }

      renderDetail(event);
    }catch(e){
      if(supabaseClient){try{await supabaseClient.auth.signOut();}catch(err){}}
      redirectToLogin();
    }
  })();
})();

(function(){
  "use strict";
  var moreBtn=document.getElementById("nav-more-btn"),drawer=document.getElementById("more-drawer"),backdrop=document.getElementById("drawer-backdrop");
  if(!moreBtn||!drawer||!backdrop)return;
  function openDrawer(){drawer.hidden=false;backdrop.hidden=false;requestAnimationFrame(function(){drawer.classList.add("open");backdrop.classList.add("open");});drawer.setAttribute("aria-hidden","false");moreBtn.setAttribute("aria-expanded","true");}
  function closeDrawer(){drawer.classList.remove("open");backdrop.classList.remove("open");drawer.setAttribute("aria-hidden","true");moreBtn.setAttribute("aria-expanded","false");setTimeout(function(){drawer.hidden=true;backdrop.hidden=true;},250);}
  moreBtn.addEventListener("click",function(){if(drawer.classList.contains("open"))closeDrawer();else openDrawer();});
  backdrop.addEventListener("click",closeDrawer);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&drawer.classList.contains("open"))closeDrawer();});
  var path=window.location.pathname,active="home";
  if(path.indexOf("/meetings")!==-1)active="meetings";
  else if(path.indexOf("/dues")!==-1)active="dues";
  else if(path.indexOf("/events")!==-1)active="events";
  document.querySelectorAll(".member-nav-item[data-nav]").forEach(function(el){
    if(el.getAttribute("data-nav")===active)el.classList.add("active");
    else if(el.getAttribute("data-nav")!=="more")el.classList.remove("active");
  });
})();
</script>
</body>
</html>
