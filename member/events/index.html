<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — St. Augustine Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon-deep:#3E0F1D;--maroon:#6B1F35;--maroon-light:#8A2E45;--gold:#C9A227;--gold-bright:#F0CC5C;--parchment:#F7EFE0;--ivory:#FFFBF3;--ink:#241019;--ink-soft:#5C3A44;--error:#B42318;--success:#2D6A4F;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Work Sans',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);color:var(--ink);background:var(--parchment);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:76px;}
  a{color:inherit;text-decoration:none;} :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--maroon-deep);border-bottom:1px solid rgba(201,162,39,0.25);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ivory);letter-spacing:0.01em;}
  .brand-mark{width:28px;height:28px;flex-shrink:0;color:var(--gold-bright);} .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{font-size:14px;font-weight:600;color:var(--gold-bright);padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;background:transparent;cursor:pointer;white-space:nowrap;transition:background .18s ease,color .18s ease,border-color .18s ease;}
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);border-color:var(--gold-bright);}
  .header-signin:disabled{opacity:0.7;cursor:not-allowed;}
  .member-page{padding:28px 20px 32px;max-width:720px;margin:0 auto;}
  .page-heading{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--maroon);margin-bottom:24px;}
  .view-toggle{display:flex;background:var(--ivory);border:1px solid rgba(107,31,53,0.15);border-radius:999px;padding:4px;margin-bottom:24px;}
  .view-toggle-btn{flex:1;padding:10px 16px;background:none;border:none;border-radius:999px;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:background .15s ease,color .15s ease;}
  .view-toggle-btn.active{background:var(--maroon);color:var(--ivory);}
  .view-toggle-btn:hover:not(.active),.view-toggle-btn:focus-visible:not(.active){color:var(--maroon);}
  .view-panel{display:none;} .view-panel.active{display:block;}
  .event-list{display:flex;flex-direction:column;gap:12px;}
  .event-row{display:block;background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-left:3px solid var(--maroon);border-radius:10px;padding:16px 18px;transition:box-shadow .15s ease,transform .15s ease;}
  .event-row:hover,.event-row:focus-visible{box-shadow:0 4px 16px -6px rgba(36,16,25,0.15);transform:translateY(-1px);}
  .event-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .event-row h3{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--maroon);line-height:1.25;}
  .event-meta{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .badge{flex-shrink:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge-rsvp{background:rgba(201,162,39,0.22);color:var(--maroon);}
  .cal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .cal-nav{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--ivory);border:1px solid rgba(107,31,53,0.15);border-radius:8px;cursor:pointer;color:var(--maroon);flex-shrink:0;}
  .cal-nav:hover,.cal-nav:focus-visible{background:rgba(201,162,39,0.15);border-color:var(--gold);}
  .cal-nav svg{width:20px;height:20px;}
  .cal-month-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--maroon);text-align:center;flex:1;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
  .cal-dow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);text-align:center;padding:6px 2px;}
  .cal-cell{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 4px;border-radius:8px;background:var(--ivory);border:1px solid rgba(107,31,53,0.08);font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--ink);position:relative;}
  .cal-cell.empty{background:transparent;border-color:transparent;min-height:44px;}
  .cal-cell.feast{background:rgba(240,204,92,0.45);border-color:rgba(201,162,39,0.5);color:var(--maroon-deep);}
  .cal-cell.has-events{cursor:pointer;}
  .cal-cell.has-events:hover,.cal-cell.has-events:focus-visible{background:rgba(201,162,39,0.12);border-color:rgba(201,162,39,0.35);}
  .cal-cell.selected{outline:2px solid var(--maroon);outline-offset:-2px;}
  .cal-cell.feast.has-events:hover,.cal-cell.feast.has-events:focus-visible{background:rgba(240,204,92,0.6);}
  .cal-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:4px;flex-shrink:0;}
  .cal-day-list{margin-top:8px;}
  .cal-day-list h3{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--maroon);margin-bottom:12px;}
  .cal-day-events{display:flex;flex-direction:column;gap:8px;}
  .cal-day-event{display:block;background:var(--ivory);border:1px solid rgba(107,31,53,0.12);border-radius:8px;padding:12px 14px;transition:background .15s ease;}
  .cal-day-event:hover,.cal-day-event:focus-visible{background:rgba(201,162,39,0.1);}
  .cal-day-event strong{display:block;font-size:15px;font-weight:600;color:var(--maroon);margin-bottom:2px;}
  .cal-day-event span{font-size:13px;color:var(--ink-soft);}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state svg{width:48px;height:48px;color:var(--gold);margin:0 auto 16px;opacity:0.7;display:block;}
  .empty-state p{font-size:15px;}
  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-row{height:96px;border-radius:10px;background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .member-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;align-items:stretch;background:var(--maroon-deep);border-top:1px solid rgba(201,162,39,0.25);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));min-height:76px;}
  .member-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:rgba(255,251,243,0.7);background:none;border:none;cursor:pointer;padding:6px 4px;font-family:var(--font-body);transition:color .15s ease;}
  .member-nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-nav-item:hover,.member-nav-item:focus-visible{color:var(--gold-bright);}
  .member-drawer-backdrop{position:fixed;inset:0;background:rgba(36,16,25,0.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .member-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .member-drawer{position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--ivory);border-radius:16px 16px 0 0;border-top:3px solid var(--maroon);padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -8px 32px -8px rgba(36,16,25,0.2);}
  .member-drawer.open{transform:translateY(0);}
  .member-drawer h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-drawer-links{display:flex;flex-direction:column;gap:4px;}
  .member-drawer-links a{display:block;padding:12px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);transition:background .15s ease;}
  .member-drawer-links a:hover,.member-drawer-links a:focus-visible{background:rgba(107,31,53,0.08);color:var(--maroon);}
  body.checking-session .member-page{visibility:hidden;}
  @media (max-width:720px){.site-header{padding:14px 18px;}.header-actions{gap:8px;}.header-member-name{font-size:13px;}.header-signin{padding:8px 14px;font-size:13px;}.member-page{padding:24px 16px 28px;}.page-heading{font-size:28px;}.cal-cell{min-height:44px;font-size:13px;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.skeleton-row,.member-drawer,.member-drawer-backdrop{animation:none;transition:none;}.event-row:hover,.event-row:focus-visible{transform:none;}}
</style>
</head>

<script>
(function(){
  "use strict";
  var root=document.documentElement,c=FAITHBASE_CONFIG.colors;
  ["maroonDeep","maroon","maroonLight","gold","goldBright","parchment","ivory","ink","inkSoft"].forEach(function(k,i){
    var vars=["maroon-deep","maroon","maroon-light","gold","gold-bright","parchment","ivory","ink","ink-soft"];
    root.style.setProperty("--"+vars[i],c[k]);
  });
  document.title="Events — "+FAITHBASE_CONFIG.communityName;
  document.querySelectorAll("[data-config]").forEach(function(el){var k=el.getAttribute("data-config");if(FAITHBASE_CONFIG[k]!==undefined)el.textContent=FAITHBASE_CONFIG[k];});

  var supabaseClient=null;
  var upcomingEvents=[],calendarEvents=[],feastDate=null;
  var calYear,calMonth,selectedDayKey=null;
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

  function firstName(n){return!n||!n.trim()?"Member":n.trim().split(/\s+/)[0];}
  function revealPage(){document.body.classList.remove("checking-session");}
  function redirectToLogin(){window.location.replace("../../auth/login.html");}
  function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function formatEventDate(iso){return new Date(iso).toLocaleString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});}
  function formatTime(iso){return new Date(iso).toLocaleString("en-GB",{hour:"numeric",minute:"2-digit",hour12:true});}
  function dateKey(y,m,d){return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  function eventDayKey(iso){var dt=new Date(iso);return dateKey(dt.getFullYear(),dt.getMonth()+1,dt.getDate());}
  function isFeastDay(m,d){if(!feastDate)return false;var f=new Date(feastDate);return f.getMonth()+1===m&&f.getDate()===d;}

  function eventsOnDay(y,m,d){
    var key=dateKey(y,m,d);
    return calendarEvents.filter(function(ev){return eventDayKey(ev.event_date)===key;});
  }

  function renderList(){
    var el=document.getElementById("list-content");
    if(!upcomingEvents.length){
      el.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><p>No upcoming events right now.</p></div>';
      return;
    }
    el.innerHTML='<div class="event-list">'+upcomingEvents.map(function(ev){
      var badge=ev.rsvp_required?'<span class="badge badge-rsvp">RSVP Required</span>':"";
      return'<a href="detail.html?id='+encodeURIComponent(ev.id)+'" class="event-row">'+
        '<div class="event-row-top"><h3>'+escapeHtml(ev.title)+'</h3>'+badge+'</div>'+
        '<p class="event-meta">'+escapeHtml(formatEventDate(ev.event_date))+
        (ev.location?' &middot; '+escapeHtml(ev.location):'')+'</p></a>';
    }).join("")+'</div>';
  }

  function renderDayList(y,m,d){
    var listEl=document.getElementById("cal-day-list");
    var evts=eventsOnDay(y,m,d);
    if(!evts.length){listEl.hidden=true;listEl.innerHTML="";return;}
    var label=new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    listEl.innerHTML='<h3>'+escapeHtml(label)+'</h3><div class="cal-day-events">'+
      evts.map(function(ev){
        return'<a href="detail.html?id='+encodeURIComponent(ev.id)+'" class="cal-day-event"><strong>'+escapeHtml(ev.title)+'</strong><span>'+escapeHtml(formatTime(ev.event_date))+'</span></a>';
      }).join("")+'</div>';
    listEl.hidden=false;
  }

  function renderCalendar(){
    document.getElementById("cal-month-title").textContent=MONTHS[calMonth]+" "+calYear;
    var first=new Date(calYear,calMonth,1);
    var startDow=first.getDay();
    var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
    var html=DOW.map(function(d){return'<div class="cal-dow">'+d+'</div>';}).join("");
    var cell=0;
    for(var i=0;i<startDow;i++){html+='<div class="cal-cell empty" aria-hidden="true"></div>';cell++;}
    for(var day=1;day<=daysInMonth;day++){
      var evts=eventsOnDay(calYear,calMonth+1,day);
      var hasEv=evts.length>0;
      var feast=isFeastDay(calMonth+1,day);
      var key=dateKey(calYear,calMonth+1,day);
      var cls="cal-cell"+(feast?" feast":"")+(hasEv?" has-events":"")+(selectedDayKey===key?" selected":"");
      if(hasEv){
        html+='<button type="button" class="'+cls+'" data-day-key="'+key+'" data-y="'+calYear+'" data-m="'+(calMonth+1)+'" data-d="'+day+'" aria-label="'+MONTHS[calMonth]+' '+day+', '+(evts.length)+' event'+(evts.length===1?"":"s")+'">'+
          day+(hasEv?'<span class="cal-dot" aria-hidden="true"></span>':"")+'</button>';
      }else{
        html+='<div class="'+cls+'" aria-hidden="true">'+day+'</div>';
      }
      cell++;
    }
    while(cell%7!==0){html+='<div class="cal-cell empty" aria-hidden="true"></div>';cell++;}
    document.getElementById("cal-grid").innerHTML=html;
    if(selectedDayKey){
      var parts=selectedDayKey.split("-");
      renderDayList(Number(parts[0]),Number(parts[1]),Number(parts[2]));
    }
  }

  document.getElementById("cal-grid").addEventListener("click",function(e){
    var btn=e.target.closest("button[data-day-key]");
    if(!btn)return;
    selectedDayKey=btn.getAttribute("data-day-key");
    renderCalendar();
  });

  document.getElementById("cal-prev").addEventListener("click",function(){
    calMonth--;
    if(calMonth<0){calMonth=11;calYear--;}
    selectedDayKey=null;
    document.getElementById("cal-day-list").hidden=true;
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click",function(){
    calMonth++;
    if(calMonth>11){calMonth=0;calYear++;}
    selectedDayKey=null;
    document.getElementById("cal-day-list").hidden=true;
    renderCalendar();
  });

  var tabList=document.getElementById("tab-list"),tabCal=document.getElementById("tab-calendar");
  var panelList=document.getElementById("panel-list"),panelCal=document.getElementById("panel-calendar");
  function switchView(view){
    var cal=view==="calendar";
    tabList.classList.toggle("active",!cal);tabCal.classList.toggle("active",cal);
    tabList.setAttribute("aria-selected",String(!cal));tabCal.setAttribute("aria-selected",String(cal));
    panelList.classList.toggle("active",!cal);panelCal.classList.toggle("active",cal);
    panelList.hidden=cal;panelCal.hidden=!cal;
    if(cal)renderCalendar();
  }
  tabList.addEventListener("click",function(){switchView("list");});
  tabCal.addEventListener("click",function(){switchView("calendar");});

  try{var u=FAITHBASE_CONFIG.supabase.url,k=FAITHBASE_CONFIG.supabase.anonKey;if(u&&k&&u.indexOf("YOUR-")===-1)supabaseClient=supabase.createClient(u,k);}catch(e){}

  document.getElementById("sign-out-btn").addEventListener("click",async function(){
    this.disabled=true;this.textContent="Signing out\u2026";
    try{if(supabaseClient)await supabaseClient.auth.signOut();}catch(e){}
    window.location.replace("../../index.html");
  });

  (async function init(){
    if(!supabaseClient){redirectToLogin();return;}
    try{
      var sessionResult=await supabaseClient.auth.getSession();
      var session=sessionResult.data&&sessionResult.data.session;
      if(!session){redirectToLogin();return;}
      var profileResult=await supabaseClient.from("profiles").select("full_name,status").eq("id",session.user.id).single();
      var profile=profileResult.data;
      if(profileResult.error||!profile||profile.status!=="active"){await supabaseClient.auth.signOut();redirectToLogin();return;}
      document.getElementById("member-name").textContent=firstName(profile.full_name);

      var now=new Date().toISOString();
      var results=await Promise.all([
        supabaseClient.from("events").select("id, title, event_date, location, rsvp_required").eq("status","scheduled").gte("event_date",now).order("event_date",{ascending:true}),
        supabaseClient.from("events").select("id, title, event_date, location, rsvp_required").eq("status","scheduled").order("event_date",{ascending:true}),
        supabaseClient.from("community_settings").select("feast_date").limit(1).maybeSingle()
      ]);

      upcomingEvents=results[0].data||[];
      calendarEvents=results[1].data||[];
      feastDate=results[2].data&&results[2].data.feast_date?results[2].data.feast_date:null;

      var today=new Date();
      calYear=today.getFullYear();calMonth=today.getMonth();

      document.getElementById("page-loading").hidden=true;
      document.getElementById("page-content").hidden=false;
      renderList();
      revealPage();
    }catch(e){
      if(supabaseClient){try{await supabaseClient.auth.signOut();}catch(err){}}
      redirectToLogin();
    }
  })();
})();

(function(){
  "use strict";
  var moreBtn=document.getElementById("nav-more-btn"),drawer=document.getElementById("more-drawer"),backdrop=document.getElementById("drawer-backdrop");
  if(!moreBtn||!drawer||!backdrop)return;
  function openDrawer(){drawer.hidden=false;backdrop.hidden=false;requestAnimationFrame(function(){drawer.classList.add("open");backdrop.classList.add("open");});drawer.setAttribute("aria-hidden","false");moreBtn.setAttribute("aria-expanded","true");}
  function closeDrawer(){drawer.classList.remove("open");backdrop.classList.remove("open");drawer.setAttribute("aria-hidden","true");moreBtn.setAttribute("aria-expanded","false");setTimeout(function(){drawer.hidden=true;backdrop.hidden=true;},250);}
  moreBtn.addEventListener("click",function(){if(drawer.classList.contains("open"))closeDrawer();else openDrawer();});
  backdrop.addEventListener("click",closeDrawer);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&drawer.classList.contains("open"))closeDrawer();});
  var path=window.location.pathname,active="home";
  if(path.indexOf("/meetings")!==-1)active="meetings";
  else if(path.indexOf("/dues")!==-1)active="dues";
  else if(path.indexOf("/events")!==-1)active="events";
  document.querySelectorAll(".member-nav-item[data-nav]").forEach(function(el){
    if(el.getAttribute("data-nav")===active)el.classList.add("active");
    else if(el.getAttribute("data-nav")!=="more")el.classList.remove("active");
  });
})();
</script>
