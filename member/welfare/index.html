<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welfare — St. Augustine Choir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --maroon-deep:  #3E0F1C;
    --maroon:       #6B1F35;
    --maroon-light: #8A2E45;
    --gold:         #C9A227;
    --gold-bright:  #F0CC5C;
    --parchment:    #F7EFE0;
    --ivory:        #FFFBF3;
    --ink:          #241019;
    --ink-soft:     #5C3A44;
    --error:        #B42318;
    --success:      #2D6A4F;
    --amber:        #B7791F;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--parchment);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:76px;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}

  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:var(--maroon-deep);
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:20px;font-weight:600;
    color:var(--ivory);
    letter-spacing:0.01em;
  }
  .brand-mark{width:28px;height:28px;flex-shrink:0;color:var(--gold-bright);}
  .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{
    font-size:14px;font-weight:600;color:var(--gold-bright);
    padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;
    background:transparent;cursor:pointer;white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);border-color:var(--gold-bright);}
  .header-signin:disabled{opacity:0.7;cursor:not-allowed;}

  .member-page{padding:28px 20px 32px;max-width:720px;margin:0 auto;}
  .page-heading{
    font-family:var(--font-display);
    font-weight:600;font-size:32px;
    color:var(--maroon);
    margin-bottom:24px;
  }

  .tabs{
    display:flex;
    border-bottom:1px solid rgba(107,31,53,0.15);
    margin-bottom:24px;
  }
  .tab-btn{
    flex:1;padding:12px 8px;
    background:none;border:none;border-bottom:2px solid transparent;
    font-family:var(--font-body);font-size:15px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
    margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--gold);}
  .tab-btn:hover:not(:disabled),.tab-btn:focus-visible:not(:disabled){color:var(--maroon);}
  .tab-btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
    color:var(--ink-soft);
  }

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .notice-card{
    background:rgba(240,204,92,0.12);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:20px;
    font-size:14.5px;
    font-weight:500;
    line-height:1.55;
    color:var(--maroon);
  }

  .form-card{
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-top:3px solid var(--maroon);
    border-radius:10px;
    padding:24px 22px;
  }
  .form-field{margin-bottom:18px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
  .form-field select,.form-field textarea{
    width:100%;
    font-family:var(--font-body);
    font-size:15px;
    padding:12px 14px;
    border:1px solid rgba(107,31,53,0.2);
    border-radius:8px;
    background:var(--parchment);
    color:var(--ink);
  }
  .form-field textarea{min-height:120px;resize:vertical;line-height:1.55;}
  .form-field select:focus,.form-field textarea:focus{
    outline:none;border-color:var(--maroon);
    box-shadow:0 0 0 3px rgba(107,31,53,0.12);
  }
  .field-error{display:none;font-size:12.5px;color:var(--error);margin-top:6px;}
  .field-error.visible{display:block;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--font-body);font-size:14px;font-weight:600;
    padding:12px 22px;border-radius:999px;border:none;cursor:pointer;
    background:var(--gold-bright);color:var(--maroon-deep);
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 10px 24px -8px rgba(240,204,92,0.55);
  }
  .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;box-shadow:none;}

  .success-inline{
    display:none;
    background:rgba(45,106,79,0.1);
    border:1px solid rgba(45,106,79,0.25);
    border-radius:8px;
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    color:var(--success);
    margin-bottom:18px;
  }
  .success-inline.visible{display:block;}

  .case-list{display:flex;flex-direction:column;gap:12px;}
  .case-row{
    display:block;
    width:100%;
    text-align:left;
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-left:3px solid var(--maroon);
    border-radius:10px;
    padding:16px 18px;
    cursor:pointer;
    font-family:var(--font-body);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .case-row.open-case{border-left-color:var(--gold);}
  .case-row:hover,.case-row:focus-visible{
    box-shadow:0 4px 16px -6px rgba(36,16,25,0.15);
    transform:translateY(-1px);
  }
  .case-row-top{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:8px;
  }
  .case-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .case-meta{font-size:13.5px;color:var(--ink-soft);}

  .badge{
    flex-shrink:0;
    font-size:11px;font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge-type{background:rgba(107,31,53,0.1);color:var(--maroon);text-transform:none;letter-spacing:0;}
  .badge-open{background:rgba(183,121,31,0.15);color:var(--amber);}
  .badge-visited{background:rgba(107,31,53,0.12);color:var(--maroon);}
  .badge-resolved{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-closed{background:rgba(92,58,68,0.12);color:var(--ink-soft);}

  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{width:48px;height:48px;color:var(--gold);margin:0 auto 16px;opacity:0.7;}
  .empty-state p{font-size:15px;}

  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-row{
    height:88px;border-radius:10px;
    background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(36,16,25,0.55);z-index:90;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(0.95);
    z-index:100;background:var(--ivory);
    border-radius:12px;border-top:3px solid var(--maroon);
    padding:28px 24px;
    width:calc(100% - 40px);max-width:440px;max-height:90vh;overflow-y:auto;
    opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 20px 48px -12px rgba(36,16,25,0.35);
  }
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .modal h2{font-family:var(--font-display);font-size:22px;color:var(--maroon);margin-bottom:12px;}
  .modal-summary{
    background:var(--parchment);border-radius:8px;
    padding:14px 16px;margin-bottom:20px;
    font-size:14px;line-height:1.6;color:var(--ink-soft);
  }
  .modal-summary strong{color:var(--ink);}
  .readonly-field{margin-bottom:12px;font-size:14px;line-height:1.55;}
  .readonly-field .lbl{font-size:12px;font-weight:600;color:var(--maroon);display:block;margin-bottom:2px;}
  .readonly-field .desc{white-space:pre-wrap;}
  .modal-actions{display:flex;gap:12px;margin-top:8px;}
  .modal-actions .btn{flex:1;margin-top:0;}
  .modal-cancel{
    background:transparent!important;
    border:1px solid rgba(107,31,53,0.3)!important;
    color:var(--maroon)!important;
    box-shadow:none!important;
    transform:none!important;
  }

  .member-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    display:flex;justify-content:space-around;align-items:stretch;
    background:var(--maroon-deep);
    border-top:1px solid rgba(201,162,39,0.25);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    min-height:76px;
  }
  .member-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-size:11px;font-weight:600;
    color:rgba(255,251,243,0.7);
    background:none;border:none;cursor:pointer;
    padding:6px 4px;font-family:var(--font-body);
    transition:color .15s ease;
  }
  .member-nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-nav-item:hover,.member-nav-item:focus-visible{color:var(--gold-bright);}
  .member-drawer-backdrop{
    position:fixed;inset:0;background:rgba(36,16,25,0.45);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .member-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .member-drawer{
    position:fixed;bottom:0;left:0;right:0;z-index:80;
    background:var(--ivory);border-radius:16px 16px 0 0;
    border-top:3px solid var(--maroon);
    padding:20px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    transform:translateY(100%);transition:transform .25s ease;
    box-shadow:0 -8px 32px -8px rgba(36,16,25,0.2);
  }
  .member-drawer.open{transform:translateY(0);}
  .member-drawer h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-drawer-links{display:flex;flex-direction:column;gap:4px;}
  .member-drawer-links a{display:block;padding:12px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);transition:background .15s ease;}
  .member-drawer-links a:hover,.member-drawer-links a:focus-visible{background:rgba(107,31,53,0.08);color:var(--maroon);}

  body.checking-session .member-page{visibility:hidden;}

  @media (max-width:720px){
    .site-header{padding:14px 18px;}
    .header-actions{gap:8px;}
    .header-member-name{font-size:13px;}
    .header-signin{padding:8px 14px;font-size:13px;}
    .member-page{padding:24px 16px 28px;}
    .page-heading{font-size:28px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .skeleton-row{animation:none;background:rgba(107,31,53,0.08);}
    .member-drawer,.member-drawer-backdrop,.modal,.modal-backdrop{transition:none;}
    .case-row:hover,.case-row:focus-visible,.btn:hover,.btn:focus-visible{transform:none;}
  }
</style>
</head>

  <div class="tab-panel active" role="tabpanel" id="panel-submit" aria-labelledby="tab-submit">
    <div class="form-card">
      <div id="submit-success" class="success-inline" role="status">Your welfare request has been submitted.</div>
      <form id="submit-form" novalidate>
        <div class="form-field">
          <label for="welfare-type">Welfare Type</label>
          <select id="welfare-type" required>

        <div class="form-field">
          <label for="description">Description</label>
          <textarea id="description" required placeholder="Please describe your situation or need&hellip;"></textarea>
          <p class="field-error" id="error-description"></p>
        </div>
        <button type="submit" class="btn" id="submit-btn">Submit Request</button>
      </form>
    </div>
  </div>

  <div class="tab-panel" role="tabpanel" id="panel-requests" aria-labelledby="tab-requests" hidden>
    <div id="open-notice" class="notice-card" hidden>
      You have an open welfare request. You can submit a new one once it&rsquo;s resolved or closed.
    </div>
    <div id="requests-loading" class="skeleton-list" aria-hidden="true">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
    <div id="requests-content" hidden></div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var c = FAITHBASE_CONFIG.colors;
  root.style.setProperty('--maroon-deep',  c.maroonDeep);
  root.style.setProperty('--maroon',       c.maroon);
  root.style.setProperty('--maroon-light', c.maroonLight);
  root.style.setProperty('--gold',         c.gold);
  root.style.setProperty('--gold-bright',  c.goldBright);
  root.style.setProperty('--parchment',    c.parchment);
  root.style.setProperty('--ivory',        c.ivory);
  root.style.setProperty('--ink',          c.ink);
  root.style.setProperty('--ink-soft',     c.inkSoft);

  document.title = 'Welfare — ' + FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){
    var key = el.getAttribute('data-config');
    if (FAITHBASE_CONFIG[key] !== undefined) el.textContent = FAITHBASE_CONFIG[key];
  });

  var memberNameEl = document.getElementById('member-name');
  var signOutBtn = document.getElementById('sign-out-btn');
  var supabaseClient = null;
  var currentUserId = null;
  var cases = [];
  var hasOpenCase = false;

  var tabSubmit = document.getElementById('tab-submit');
  var tabRequests = document.getElementById('tab-requests');
  var panelSubmit = document.getElementById('panel-submit');
  var panelRequests = document.getElementById('panel-requests');

  var backdrop = document.getElementById('modal-backdrop');
  var caseModal = document.getElementById('case-modal');

  function firstName(fullName){
    if (!fullName || !fullName.trim()) return 'Member';
    return fullName.trim().split(/\s+/)[0];
  }

  function revealPage(){
    document.body.classList.remove('checking-session');
  }

  function redirectToLogin(){
    window.location.replace('../../auth/login.html');
  }

  function escapeHtml(str){
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatNaira(amount){
    if (amount === null || amount === undefined) return '';
    return '\u20A6' + Number(amount).toLocaleString('en-NG');
  }

  function formatDate(iso){
    return new Date(iso).toLocaleString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    }).replace(',', '').replace(/ at /, ' at ');
  }

  function typeLabel(type){
    if (type === 'sick') return 'Sick';
    if (type === 'bereaved') return 'Bereaved';
    if (type === 'celebrating') return 'Celebrating';
    if (type === 'other') return 'Other';
    return type || 'Unknown';
  }

  function statusLabel(status){
    if (status === 'open') return 'Open';
    if (status === 'visited') return 'Visited';
    if (status === 'resolved') return 'Resolved';
    if (status === 'closed') return 'Closed';
    return status || 'Unknown';
  }

  function statusBadgeClass(status){
    if (status === 'open') return 'badge-open';
    if (status === 'visited') return 'badge-visited';
    if (status === 'resolved') return 'badge-resolved';
    return 'badge-closed';
  }

  function showFieldError(id, msg){
    var el = document.getElementById(id);
    if (!el) return;
    if (msg){ el.textContent = msg; el.classList.add('visible'); }
    else { el.textContent = ''; el.classList.remove('visible'); }
  }

  function clearFormErrors(){
    showFieldError('error-type', '');
    showFieldError('error-description', '');
  }

  function updateOpenCaseState(){
    hasOpenCase = cases.some(function(c){ return c.status === 'open'; });
    tabSubmit.disabled = hasOpenCase;
    tabSubmit.setAttribute('aria-disabled', String(hasOpenCase));
    document.getElementById('open-notice').hidden = !hasOpenCase;
  }

  function switchTab(tab){
    var isRequests = tab === 'requests';
    tabSubmit.classList.toggle('active', !isRequests);
    tabRequests.classList.toggle('active', isRequests);
    tabSubmit.setAttribute('aria-selected', String(!isRequests));
    tabRequests.setAttribute('aria-selected', String(isRequests));
    panelSubmit.classList.toggle('active', !isRequests);
    panelRequests.classList.toggle('active', isRequests);
    panelSubmit.hidden = isRequests;
    panelRequests.hidden = !isRequests;
    if (isRequests) renderRequestsList();
  }

  tabSubmit.addEventListener('click', function(){
    if (tabSubmit.disabled) return;
    switchTab('submit');
  });
  tabRequests.addEventListener('click', function(){ switchTab('requests'); });

  function emptyStateHtml(message){
    return '<div class="empty-state">' +
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 11c0 5.5-7 10-7 10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' +
      '<p>' + escapeHtml(message) + '</p></div>';
  }

  function renderCaseRow(c){
    var isOpen = c.status === 'open';
    return '<button type="button" class="case-row' + (isOpen ? ' open-case' : '') + '" data-case-id="' + escapeHtml(c.id) + '">' +
      '<div class="case-row-top">' +
      '<div class="case-badges">' +
      '<span class="badge badge-type">' + escapeHtml(typeLabel(c.welfare_type)) + '</span>' +
      '<span class="badge ' + statusBadgeClass(c.status) + '">' + escapeHtml(statusLabel(c.status)) + '</span>' +
      '</div></div>' +
      '<p class="case-meta">Reported ' + escapeHtml(formatDate(c.created_at)) + '</p>' +
      '</button>';
  }

  function renderRequestsList(){
    var loading = document.getElementById('requests-loading');
    var content = document.getElementById('requests-content');
    loading.hidden = true;
    content.hidden = false;

    if (!cases.length){
      content.innerHTML = emptyStateHtml('You have not submitted any welfare requests yet.');
      return;
    }

    content.innerHTML = '<div class="case-list">' + cases.map(renderCaseRow).join('') + '</div>';

    content.querySelectorAll('.case-row').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-case-id');
        var found = cases.find(function(c){ return c.id === id; });
        if (found) openCaseModal(found);
      });
    });
  }

  async function fetchCases(){
    var loading = document.getElementById('requests-loading');
    var content = document.getElementById('requests-content');
    loading.hidden = false;
    content.hidden = true;

    var result = await supabaseClient
      .from('welfare_cases')
      .select('id, welfare_type, description, status, amount_disbursed, created_at')
      .eq('member_id', currentUserId)
      .order('created_at', { ascending: false });

    if (result.error){
      cases = [];
    } else {
      cases = result.data || [];
    }

    updateOpenCaseState();
    renderRequestsList();
  }

  function openModal(){
    caseModal.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function(){
      caseModal.classList.add('open');
      backdrop.classList.add('open');
      caseModal.setAttribute('aria-hidden', 'false');
    });
  }

  function closeModal(){
    caseModal.classList.remove('open');
    backdrop.classList.remove('open');
    caseModal.setAttribute('aria-hidden', 'true');
    setTimeout(function(){
      caseModal.hidden = true;
      backdrop.hidden = true;
    }, 200);
  }

  function openCaseModal(c){
    document.getElementById('modal-title').textContent = typeLabel(c.welfare_type) + ' Request';
    var html =
      '<div class="readonly-field"><span class="lbl">Welfare Type</span>' + escapeHtml(typeLabel(c.welfare_type)) + '</div>' +
      '<div class="readonly-field"><span class="lbl">Description</span><span class="desc">' + escapeHtml(c.description || '') + '</span></div>' +
      '<div class="readonly-field"><span class="lbl">Status</span>' + escapeHtml(statusLabel(c.status)) + '</div>';
    if (c.amount_disbursed !== null && c.amount_disbursed !== undefined){
      html += '<div class="readonly-field"><span class="lbl">Amount Disbursed</span>' + escapeHtml(formatNaira(c.amount_disbursed)) + '</div>';
    }
    document.getElementById('modal-body').innerHTML = html;
    openModal();
  }

  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  backdrop.addEventListener('click', closeModal);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && caseModal.classList.contains('open')) closeModal();
  });

  document.getElementById('submit-form').addEventListener('submit', async function(e){
    e.preventDefault();
    clearFormErrors();
    if (hasOpenCase) return;

    var welfareType = document.getElementById('welfare-type').value;
    var description = document.getElementById('description').value.trim();
    var valid = true;

    if (!welfareType){
      showFieldError('error-type', 'Please select a welfare type.');
      valid = false;
    }
    if (!description){
      showFieldError('error-description', 'Please provide a description.');
      valid = false;
    }
    if (!valid) return;

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting\u2026';

    var result = await supabaseClient.from('welfare_cases').insert({
      welfare_type: welfareType,
      description: description,
      member_id: currentUserId,
      reported_by: currentUserId
    });

    btn.disabled = false;
    btn.textContent = 'Submit Request';

    if (result.error){
      showFieldError('error-description', result.error.message || 'Failed to submit request.');
      return;
    }

    document.getElementById('submit-form').reset();
    document.getElementById('submit-success').classList.add('visible');
    setTimeout(function(){
      document.getElementById('submit-success').classList.remove('visible');
    }, 3500);

    await fetchCases();
    switchTab('requests');
  });

  try {
    var url = FAITHBASE_CONFIG.supabase.url;
    var key = FAITHBASE_CONFIG.supabase.anonKey;
    if (url && key && url.indexOf('YOUR-') === -1){
      supabaseClient = supabase.createClient(url, key);
    }
  } catch (e) {}

  signOutBtn.addEventListener('click', async function(){
    signOutBtn.disabled = true;
    signOutBtn.textContent = 'Signing out\u2026';
    try { if (supabaseClient) await supabaseClient.auth.signOut(); } catch (e) {}
    window.location.replace('../../index.html');
  });

  (async function init(){
    if (!supabaseClient){ redirectToLogin(); return; }

    try {
      var sessionResult = await supabaseClient.auth.getSession();
      var session = sessionResult.data && sessionResult.data.session;
      if (!session){ redirectToLogin(); return; }

      currentUserId = session.user.id;

      var profileResult = await supabaseClient
        .from('profiles')
        .select('full_name, role, status')
        .eq('id', session.user.id)
        .single();

      var profile = profileResult.data;
      if (profileResult.error || !profile || profile.status !== 'active'){
        await supabaseClient.auth.signOut();
        redirectToLogin();
        return;
      }

      memberNameEl.textContent = firstName(profile.full_name);
      await fetchCases();

      if (hasOpenCase){
        switchTab('requests');
      }

      revealPage();
    } catch (e){
      if (supabaseClient){ try { await supabaseClient.auth.signOut(); } catch (err) {} }
      redirectToLogin();
    }
  })();
})();

(function(){
  "use strict";
  var moreBtn = document.getElementById('nav-more-btn');
  var drawer = document.getElementById('more-drawer');
  var backdrop = document.getElementById('drawer-backdrop');
  if (!moreBtn || !drawer || !backdrop) return;

  function openDrawer(){
    drawer.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function(){
      drawer.classList.add('open');
      backdrop.classList.add('open');
    });
    drawer.setAttribute('aria-hidden', 'false');
    moreBtn.setAttribute('aria-expanded', 'true');
  }

  function closeDrawer(){
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    moreBtn.setAttribute('aria-expanded', 'false');
    setTimeout(function(){
      drawer.hidden = true;
      backdrop.hidden = true;
    }, 250);
  }

  moreBtn.addEventListener('click', function(){
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  var path = window.location.pathname;
  var active = 'home';
  if (path.indexOf('/meetings') !== -1) active = 'meetings';
  else if (path.indexOf('/dues') !== -1) active = 'dues';
  else if (path.indexOf('/events') !== -1) active = 'events';
  document.querySelectorAll('.member-nav-item[data-nav]').forEach(function(el){
    if (el.getAttribute('data-nav') === active) el.classList.add('active');
    else if (el.getAttribute('data-nav') !== 'more') el.classList.remove('active');
  });
})();
</script>
</body>
