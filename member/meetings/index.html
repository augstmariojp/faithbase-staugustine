<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetings — St. Augustine Choir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --maroon-deep:  #3E0F1C;
    --maroon:       #6B1F35;
    --maroon-light: #8A2E45;
    --gold:         #C9A227;
    --gold-bright:  #F0CC5C;
    --parchment:    #F7EFE0;
    --ivory:        #FFFBF3;
    --ink:          #241019;
    --ink-soft:     #5C3A44;
    --error:        #B42318;
    --success:      #2D6A4F;
    --amber:        #B7791F;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--parchment);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:76px;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}

  /* ── Header ─────────────────────────────────────────────────── */
  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:var(--maroon-deep);
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:20px;font-weight:600;
    color:var(--ivory);
    letter-spacing:0.01em;
  }
  .brand-mark{width:28px;height:28px;flex-shrink:0;color:var(--gold-bright);}
  .brand-mark svg{width:100%;height:100%;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-signin{
    font-size:14px;font-weight:600;color:var(--gold-bright);
    padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;
    background:transparent;cursor:pointer;white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);border-color:var(--gold-bright);}
  .header-signin:disabled{opacity:0.7;cursor:not-allowed;}

  /* ── Page layout ────────────────────────────────────────────── */
  .member-page{padding:28px 20px 32px;max-width:720px;margin:0 auto;}
  .page-heading{
    font-family:var(--font-display);
    font-weight:600;font-size:32px;
    color:var(--maroon);
    margin-bottom:24px;
  }

  /* ── Tabs ───────────────────────────────────────────────────── */
  .tabs{
    display:flex;
    border-bottom:1px solid rgba(107,31,53,0.15);
    margin-bottom:24px;
  }
  .tab-btn{
    flex:1;padding:12px 8px;
    background:none;border:none;border-bottom:2px solid transparent;
    font-family:var(--font-body);font-size:15px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
    margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--gold);}
  .tab-btn:hover,.tab-btn:focus-visible{color:var(--maroon);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ── Attendance summary ─────────────────────────────────────── */
  .attendance-summary{
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  .attendance-summary p{font-size:14.5px;font-weight:600;color:var(--maroon);margin-bottom:10px;}
  .progress-track{
    height:8px;background:rgba(107,31,53,0.12);
    border-radius:4px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--gold);
    border-radius:4px;
    transition:width .4s ease;
  }

  /* ── Meeting rows ───────────────────────────────────────────── */
  .meeting-list{display:flex;flex-direction:column;gap:12px;}
  .meeting-row{
    display:block;
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-left:3px solid var(--maroon);
    border-radius:10px;
    padding:16px 18px;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .meeting-row:hover,.meeting-row:focus-visible{
    box-shadow:0 4px 16px -6px rgba(36,16,25,0.15);
    transform:translateY(-1px);
  }
  .meeting-row-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    margin-bottom:6px;
  }
  .meeting-row h3{
    font-family:var(--font-display);
    font-size:19px;font-weight:600;
    color:var(--maroon);
    line-height:1.25;
  }
  .meeting-meta{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:6px;}
  .meeting-preview{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}

  /* ── Badges ─────────────────────────────────────────────────── */
  .badge{
    flex-shrink:0;
    font-size:11px;font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge-present{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-absent{background:rgba(180,35,24,0.1);color:var(--error);}
  .badge-excused{background:rgba(183,121,31,0.15);color:var(--amber);}

  /* ── Empty / loading ────────────────────────────────────────── */
  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{width:48px;height:48px;color:var(--gold);margin:0 auto 16px;opacity:0.7;}
  .empty-state p{font-size:15px;}

  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-row{
    height:96px;border-radius:10px;
    background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  /* ── Bottom navigation ──────────────────────────────────────── */
  .member-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    display:flex;justify-content:space-around;align-items:stretch;
    background:var(--maroon-deep);
    border-top:1px solid rgba(201,162,39,0.25);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    min-height:76px;
  }
  .member-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-size:11px;font-weight:600;
    color:rgba(255,251,243,0.7);
    background:none;border:none;cursor:pointer;
    padding:6px 4px;font-family:var(--font-body);
    transition:color .15s ease;
  }
  .member-nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-nav-item:hover,.member-nav-item:focus-visible{color:var(--gold-bright);}
  .member-drawer-backdrop{
    position:fixed;inset:0;background:rgba(36,16,25,0.45);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .member-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .member-drawer{
    position:fixed;bottom:0;left:0;right:0;z-index:80;
    background:var(--ivory);border-radius:16px 16px 0 0;
    border-top:3px solid var(--maroon);
    padding:20px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    transform:translateY(100%);transition:transform .25s ease;
    box-shadow:0 -8px 32px -8px rgba(36,16,25,0.2);
  }
  .member-drawer.open{transform:translateY(0);}
  .member-drawer h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--maroon);margin-bottom:16px;}
  .member-drawer-links{display:flex;flex-direction:column;gap:4px;}
  .member-drawer-links a{display:block;padding:12px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);transition:background .15s ease;}
  .member-drawer-links a:hover,.member-drawer-links a:focus-visible{background:rgba(107,31,53,0.08);color:var(--maroon);}

  body.checking-session .member-page{visibility:hidden;}

  @media (max-width:720px){
    .site-header{padding:14px 18px;}
    .header-actions{gap:8px;}
    .header-member-name{font-size:13px;}
    .header-signin{padding:8px 14px;font-size:13px;}
    .member-page{padding:24px 16px 28px;}
    .page-heading{font-size:28px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .skeleton-row{animation:none;background:rgba(107,31,53,0.08);}
    .member-drawer,.member-drawer-backdrop,.progress-fill{transition:none;}
    .meeting-row:hover,.meeting-row:focus-visible{transform:none;}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var c = FAITHBASE_CONFIG.colors;
  root.style.setProperty('--maroon-deep',  c.maroonDeep);
  root.style.setProperty('--maroon',       c.maroon);
  root.style.setProperty('--maroon-light', c.maroonLight);
  root.style.setProperty('--gold',         c.gold);
  root.style.setProperty('--gold-bright',  c.goldBright);
  root.style.setProperty('--parchment',    c.parchment);
  root.style.setProperty('--ivory',        c.ivory);
  root.style.setProperty('--ink',          c.ink);
  root.style.setProperty('--ink-soft',     c.inkSoft);

  document.title = 'Meetings — ' + FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){
    var key = el.getAttribute('data-config');
    if (FAITHBASE_CONFIG[key] !== undefined) el.textContent = FAITHBASE_CONFIG[key];
  });

  var memberNameEl = document.getElementById('member-name');
  var signOutBtn = document.getElementById('sign-out-btn');
  var supabaseClient = null;
  var currentUserId = null;
  var pastLoaded = false;

  function firstName(fullName){
    if (!fullName || !fullName.trim()) return 'Member';
    return fullName.trim().split(/\s+/)[0];
  }

  function revealPage(){
    document.body.classList.remove('checking-session');
  }

  function redirectToLogin(){
    window.location.replace('../../auth/login.html');
  }

  function formatMeetingDate(iso){
    var d = new Date(iso);
    return d.toLocaleString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    }).replace(',', '').replace(/ at /, ' at ');
  }

  function agendaPreview(text){
    if (!text) return '';
    var trimmed = text.trim();
    if (trimmed.length <= 80) return trimmed;
    return trimmed.slice(0, 80).trim() + '\u2026';
  }

  function escapeHtml(str){
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function badgeHtml(status){
    if (!status) return '';
    var cls = 'badge-present';
    var label = 'Present';
    if (status === 'absent'){ cls = 'badge-absent'; label = 'Absent'; }
    else if (status === 'excused'){ cls = 'badge-excused'; label = 'Excused'; }
    return '<span class="badge ' + cls + '">' + label + '</span>';
  }

  function emptyStateHtml(message){
    return '<div class="empty-state">' +
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
      '<p>' + escapeHtml(message) + '</p></div>';
  }

  function renderUpcomingRow(meeting){
    return '<a href="detail.html?id=' + encodeURIComponent(meeting.id) + '" class="meeting-row">' +
      '<h3>' + escapeHtml(meeting.title) + '</h3>' +
      '<p class="meeting-meta">' + escapeHtml(formatMeetingDate(meeting.meeting_date)) +
      (meeting.location ? ' &middot; ' + escapeHtml(meeting.location) : '') + '</p>' +
      (meeting.agenda ? '<p class="meeting-preview">' + escapeHtml(agendaPreview(meeting.agenda)) + '</p>' : '') +
      '</a>';
  }

  function renderPastRow(meeting, attendanceStatus){
    return '<a href="detail.html?id=' + encodeURIComponent(meeting.id) + '" class="meeting-row">' +
      '<div class="meeting-row-top">' +
      '<h3>' + escapeHtml(meeting.title) + '</h3>' +
      (attendanceStatus ? badgeHtml(attendanceStatus) : '') +
      '</div>' +
      '<p class="meeting-meta">' + escapeHtml(formatMeetingDate(meeting.meeting_date)) +
      (meeting.location ? ' &middot; ' + escapeHtml(meeting.location) : '') + '</p>' +
      (meeting.agenda ? '<p class="meeting-preview">' + escapeHtml(agendaPreview(meeting.agenda)) + '</p>' : '') +
      '</a>';
  }

  async function loadUpcoming(){
    var loading = document.getElementById('upcoming-loading');
    var content = document.getElementById('upcoming-content');
    loading.hidden = false;
    content.hidden = true;

    var now = new Date().toISOString();
    var result = await supabaseClient
      .from('meetings')
      .select('id, title, meeting_date, location, agenda')
      .gte('meeting_date', now)
      .eq('status', 'scheduled')
      .order('meeting_date', { ascending: true });

    loading.hidden = true;
    content.hidden = false;

    if (result.error || !result.data || result.data.length === 0){
      content.innerHTML = emptyStateHtml('No meetings scheduled yet');
      return;
    }

    content.innerHTML = '<div class="meeting-list">' +
      result.data.map(renderUpcomingRow).join('') + '</div>';
  }

  async function loadPast(){
    if (pastLoaded) return;
    pastLoaded = true;

    var loading = document.getElementById('past-loading');
    var content = document.getElementById('past-content');
    var summary = document.getElementById('attendance-summary');
    loading.hidden = false;
    content.hidden = true;

    var now = new Date().toISOString();

    var attendanceResult = await supabaseClient
      .from('attendance')
      .select('meeting_id, status')
      .eq('member_id', currentUserId);

    var attendanceRows = attendanceResult.data || [];
    var presentCount = attendanceRows.filter(function(r){ return r.status === 'present'; }).length;
    var totalCount = attendanceRows.length;
    var rate = totalCount > 0 ? Math.round((presentCount / totalCount) * 100) : 0;

    if (totalCount > 0){
      summary.hidden = false;
      document.getElementById('attendance-rate-text').textContent = 'Your attendance rate: ' + rate + '%';
      document.getElementById('attendance-bar').style.width = rate + '%';
    }

    var attendanceMap = {};
    attendanceRows.forEach(function(r){
      attendanceMap[r.meeting_id] = r.status;
    });

    var result = await supabaseClient
      .from('meetings')
      .select('id, title, meeting_date, location, agenda, status')
      .or('status.eq.completed,meeting_date.lt.' + now)
      .order('meeting_date', { ascending: false });

    loading.hidden = true;
    content.hidden = false;

    if (result.error || !result.data || result.data.length === 0){
      content.innerHTML = emptyStateHtml('No past meetings yet');
      return;
    }

    content.innerHTML = '<div class="meeting-list">' +
      result.data.map(function(m){
        return renderPastRow(m, attendanceMap[m.id]);
      }).join('') + '</div>';
  }

  /* ── Tabs ── */
  var tabUpcoming = document.getElementById('tab-upcoming');
  var tabPast = document.getElementById('tab-past');
  var panelUpcoming = document.getElementById('panel-upcoming');
  var panelPast = document.getElementById('panel-past');

  function switchTab(tab){
    var isPast = tab === 'past';
    tabUpcoming.classList.toggle('active', !isPast);
    tabPast.classList.toggle('active', isPast);
    tabUpcoming.setAttribute('aria-selected', String(!isPast));
    tabPast.setAttribute('aria-selected', String(isPast));
    panelUpcoming.classList.toggle('active', !isPast);
    panelPast.classList.toggle('active', isPast);
    panelUpcoming.hidden = isPast;
    panelPast.hidden = !isPast;
    if (isPast) loadPast();
  }

  tabUpcoming.addEventListener('click', function(){ switchTab('upcoming'); });
  tabPast.addEventListener('click', function(){ switchTab('past'); });

  try {
    var url = FAITHBASE_CONFIG.supabase.url;
    var key = FAITHBASE_CONFIG.supabase.anonKey;
    if (url && key && url.indexOf('YOUR-') === -1){
      supabaseClient = supabase.createClient(url, key);
    }
  } catch (e) {}

  signOutBtn.addEventListener('click', async function(){
    signOutBtn.disabled = true;
    signOutBtn.textContent = 'Signing out\u2026';
    try { if (supabaseClient) await supabaseClient.auth.signOut(); } catch (e) {}
    window.location.replace('../../index.html');
  });

  (async function init(){
    if (!supabaseClient){ redirectToLogin(); return; }

    try {
      var sessionResult = await supabaseClient.auth.getSession();
      var session = sessionResult.data && sessionResult.data.session;
      if (!session){ redirectToLogin(); return; }

      currentUserId = session.user.id;

      var profileResult = await supabaseClient
        .from('profiles')
        .select('full_name, role, status')
        .eq('id', session.user.id)
        .single();

      var profile = profileResult.data;
      if (profileResult.error || !profile || profile.status !== 'active'){
        await supabaseClient.auth.signOut();
        redirectToLogin();
        return;
      }

      memberNameEl.textContent = firstName(profile.full_name);
      await loadUpcoming();
      revealPage();
    } catch (e){
      if (supabaseClient){ try { await supabaseClient.auth.signOut(); } catch (err) {} }
      redirectToLogin();
    }
  })();
})();

/* ── Member bottom nav (shared pattern) ── */
(function(){
  "use strict";
  var moreBtn = document.getElementById('nav-more-btn');
  var drawer = document.getElementById('more-drawer');
  var backdrop = document.getElementById('drawer-backdrop');
  if (!moreBtn || !drawer || !backdrop) return;

  function openDrawer(){
    drawer.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function(){
      drawer.classList.add('open');
      backdrop.classList.add('open');
    });
    drawer.setAttribute('aria-hidden', 'false');
    moreBtn.setAttribute('aria-expanded', 'true');
  }

  function closeDrawer(){
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    moreBtn.setAttribute('aria-expanded', 'false');
    setTimeout(function(){
      drawer.hidden = true;
      backdrop.hidden = true;
    }, 250);
  }

  moreBtn.addEventListener('click', function(){
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  var path = window.location.pathname;
  var active = 'home';
  if (path.indexOf('/meetings') !== -1) active = 'meetings';
  else if (path.indexOf('/dues') !== -1) active = 'dues';
  else if (path.indexOf('/events') !== -1) active = 'events';
  document.querySelectorAll('.member-nav-item[data-nav]').forEach(function(el){
    if (el.getAttribute('data-nav') === active) el.classList.add('active');
    else if (el.getAttribute('data-nav') !== 'more') el.classList.remove('active');
  });
})();
</script>
