<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dues — St. Augustine Choir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --maroon-deep:  #3E0F1C;
    --maroon:       #6B1F35;
    --maroon-light: #8A2E45;
    --gold:         #C9A227;
    --gold-bright:  #F0CC5C;
    --parchment:    #F7EFE0;
    --ivory:        #FFFBF3;
    --ink:          #241019;
    --ink-soft:     #5C3A44;
    --error:        #B42318;
    --success:      #2D6A4F;
    --amber:        #B7791F;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--parchment);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:76px;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}

  /* ── Header ─────────────────────────────────────────────────── */
  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:var(--maroon-deep);
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:20px;font-weight:600;
    color:var(--ivory);
    letter-spacing:0.01em;
  }
  .brand-mark{width:28px;height:28px;flex-shrink:0;color:var(--gold-bright);}
  .brand-mark svg{width:100%;height:100%;}
  .brand-mark-img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .header-member-name{font-size:14px;font-weight:600;color:var(--gold-bright);white-space:nowrap;}
  .header-avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--gold-bright);color:var(--maroon-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-size:12px;font-weight:700;
    flex-shrink:0;
  }
  .header-signin{
    font-size:14px;font-weight:600;color:var(--gold-bright);
    padding:9px 18px;border:1px solid rgba(240,204,92,0.5);border-radius:999px;
    background:transparent;cursor:pointer;white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .header-signin:hover,.header-signin:focus-visible{background:var(--gold-bright);color:var(--maroon-deep);border-color:var(--gold-bright);}
  .header-signin:disabled{opacity:0.7;cursor:not-allowed;}

  /* ── Page layout ────────────────────────────────────────────── */
  .member-page{padding:28px 20px 32px;max-width:720px;margin:0 auto;}
  .page-heading{
    font-family:var(--font-display);
    font-weight:600;font-size:32px;
    color:var(--maroon);
    margin-bottom:24px;
  }

  /* ── Current month card ─────────────────────────────────────── */
  .current-card{
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-top:3px solid var(--maroon);
    border-radius:10px;
    padding:24px 22px;
    margin-bottom:24px;
    text-align:center;
    box-shadow:0 4px 24px -8px rgba(36,16,25,0.1);
  }
  .current-card .month-label{
    font-family:var(--font-display);
    font-size:22px;font-weight:600;
    color:var(--maroon);
    margin-bottom:8px;
  }
  .current-card .amount{
    font-size:28px;font-weight:700;
    color:var(--ink);
    margin-bottom:16px;
    letter-spacing:0.01em;
  }
  .status-badge-lg{
    display:inline-block;
    font-size:13px;font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:10px 22px;
    border-radius:999px;
  }
  .status-badge-lg.paid{background:rgba(45,106,79,0.15);color:var(--success);}
  .status-badge-lg.outstanding{background:rgba(180,35,24,0.12);color:var(--error);}

  /* ── Year selector ──────────────────────────────────────────── */
  .year-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:20px;flex-wrap:wrap;
  }
  .year-row label{font-size:14px;font-weight:600;color:var(--maroon);}
  .year-row select{
    font-family:var(--font-body);font-size:15px;font-weight:600;
    color:var(--ink);background:var(--ivory);
    border:1px solid rgba(107,31,53,0.2);border-radius:8px;
    padding:10px 14px;min-width:120px;cursor:pointer;
  }
  .year-row select:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(107,31,53,0.12);}

  /* ── Month grid ─────────────────────────────────────────────── */
  .month-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:24px;
  }
  .month-cell{
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.1);
    border-radius:10px;
    padding:14px 10px 12px;
    text-align:center;
    min-height:88px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  }
  .month-cell .month-name{
    font-size:12px;font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
  }
  .month-cell .month-icon{
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;
  }
  .month-cell .month-amount{
    font-size:11px;font-weight:600;
    color:var(--error);
    line-height:1.2;
  }
  .month-cell .month-note{
    font-size:10px;color:var(--ink-soft);
    line-height:1.2;font-style:italic;
  }
  .month-cell.neutral .month-icon{color:rgba(92,58,68,0.35);font-weight:400;font-size:20px;}
  .month-cell.paid .month-icon{color:var(--success);}
  .month-cell.outstanding .month-icon{color:var(--error);}
  .month-cell.unconfigured .month-note{color:var(--ink-soft);}

  /* ── Outstanding total ──────────────────────────────────────── */
  .outstanding-total{
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-radius:10px;
    padding:16px 20px;
    margin-bottom:28px;
    font-size:15px;font-weight:600;
    color:var(--maroon);
    text-align:center;
  }
  .outstanding-total span{color:var(--error);}

  /* ── Levies ─────────────────────────────────────────────────── */
  .section-heading{
    font-family:var(--font-display);
    font-size:22px;font-weight:600;
    color:var(--maroon);
    margin-bottom:16px;
  }
  .levy-list{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;}
  .levy-row{
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.12);
    border-left:3px solid var(--gold);
    border-radius:10px;
    padding:16px 18px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .levy-row h3{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--maroon);margin-bottom:4px;}
  .levy-meta{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

  /* ── Badges ─────────────────────────────────────────────────── */
  .badge{
    flex-shrink:0;
    font-size:11px;font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge-present{background:rgba(45,106,79,0.12);color:var(--success);}
  .badge-absent{background:rgba(180,35,24,0.1);color:var(--error);}

  /* ── Empty / loading / note ─────────────────────────────────── */
  .empty-state{
    text-align:center;
    padding:32px 20px;
    color:var(--ink-soft);
    background:var(--ivory);
    border:1px solid rgba(107,31,53,0.1);
    border-radius:10px;
    margin-bottom:28px;
  }
  .empty-state p{font-size:15px;}

  .skeleton-list{display:flex;flex-direction:column;gap:12px;}
  .skeleton-list[hidden],.skeleton-grid[hidden]{display:none!important;}
  .skeleton-row{
    height:96px;border-radius:10px;
    background:linear-gradient(90deg,rgba(107,31,53,0.06) 25%,rgba(107,31,53,0.12) 50%,rgba(107,31,53,0.06) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  .skeleton-row.tall{height:140px;}
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .page-note{
    font-size:13px;
    font-style:italic;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.65;
    padding:0 8px;
  }

  /* ── Bottom navigation ──────────────────────────────────────── */
  .member-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    display:flex;justify-content:space-around;align-items:stretch;
    background:var(--maroon-deep);
    border-top:1px solid rgba(201,162,39,0.25);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    min-height:76px;
  }
  .member-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-size:11px;font-weight:600;
    color:rgba(255,251,243,0.7);
    background:none;border:none;cursor:pointer;
    padding:6px 4px;font-family:var(--font-body);
    transition:color .15s ease;
  }
  .member-nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .member-nav-item.active{color:var(--gold-bright);}
  .member-nav-item:hover,.member-nav-item:focus-visible{color:var(--gold-bright);}
  body.checking-session .member-page{visibility:hidden;}

  @media (max-width:720px){
    .site-header{padding:14px 18px;}
    .header-actions{gap:8px;}
    .header-member-name{font-size:13px;}
    .header-signin{padding:8px 14px;font-size:13px;}
    .member-page{padding:24px 16px 28px;}
    .page-heading{font-size:28px;}
    .month-grid{grid-template-columns:repeat(3,1fr);gap:10px;}
    .month-cell{padding:12px 8px 10px;min-height:80px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .skeleton-row{animation:none;background:rgba(107,31,53,0.08);}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var c = FAITHBASE_CONFIG.colors;
  root.style.setProperty('--maroon-deep',  c.maroonDeep);
  root.style.setProperty('--maroon',       c.maroon);
  root.style.setProperty('--maroon-light', c.maroonLight);
  root.style.setProperty('--gold',         c.gold);
  root.style.setProperty('--gold-bright',  c.goldBright);
  root.style.setProperty('--parchment',    c.parchment);
  root.style.setProperty('--ivory',        c.ivory);
  root.style.setProperty('--ink',          c.ink);
  root.style.setProperty('--ink-soft',     c.inkSoft);

  document.title = 'Dues — ' + FAITHBASE_CONFIG.communityName;
  document.querySelectorAll('[data-config]').forEach(function(el){
    var key = el.getAttribute('data-config');
    if (FAITHBASE_CONFIG[key] !== undefined) el.textContent = FAITHBASE_CONFIG[key];
  });

  var MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  var supabaseClient = null;
  var currentUserId = null;
  var profile = null;
  var duesConfig = [];
  var duesPayments = [];
  var levyPayments = [];
  var activeLevies = [];
  var joinedYear = null;
  var joinedMonth = null;

  function firstName(fullName){
    if (!fullName || !fullName.trim()) return 'Member';
    return fullName.trim().split(/\s+/)[0];
  }
  function getInitials(name){
    if (!name || !name.trim()) return '?';
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  function revealPage(){
    document.body.classList.remove('checking-session');
  }

  function redirectToLogin(){
    window.location.replace('../../auth/login.html');
  }

  function formatNaira(amount){
    if (amount === null || amount === undefined) return '—';
    return '\u20A6' + Number(amount).toLocaleString('en-NG');
  }

  function escapeHtml(str){
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function paymentKey(year, month){
    return year + '-' + month;
  }

  function hasPayment(year, month){
    return duesPayments.some(function(p){
      return Number(p.period_year) === year && Number(p.period_month) === month;
    });
  }

  function expectedAmountForMonth(year, month){
    var firstOfMonth = new Date(year, month - 1, 1);
    var applicable = null;
    for (var i = 0; i < duesConfig.length; i++){
      var effective = new Date(duesConfig[i].effective_from);
      if (effective <= firstOfMonth){
        applicable = duesConfig[i];
      } else {
        break;
      }
    }
    return applicable ? Number(applicable.amount) : null;
  }

  function getMonthState(year, month){
    var now = new Date();
    var currentYear = now.getFullYear();
    var currentMonth = now.getMonth() + 1;

    if (year < joinedYear || (year === joinedYear && month < joinedMonth)){
      return 'before-joined';
    }
    if (year > currentYear || (year === currentYear && month > currentMonth)){
      return 'not-due';
    }
    if (hasPayment(year, month)){
      return 'paid';
    }
    if (expectedAmountForMonth(year, month) === null){
      return 'not-configured';
    }
    return 'outstanding';
  }

  function renderCurrentCard(){
    var now = new Date();
    var cy = now.getFullYear();
    var cm = now.getMonth() + 1;
    var expected = expectedAmountForMonth(cy, cm);
    var paid = hasPayment(cy, cm);
    var state = getMonthState(cy, cm);

    document.getElementById('current-month-label').textContent = MONTH_NAMES[cm - 1] + ' ' + cy;
    document.getElementById('current-amount').textContent =
      expected !== null ? formatNaira(expected) : 'Not configured';

    var badge = document.getElementById('current-status');
    if (state === 'paid'){
      badge.textContent = 'Paid';
      badge.className = 'status-badge-lg paid';
    } else if (state === 'outstanding'){
      badge.textContent = 'Outstanding';
      badge.className = 'status-badge-lg outstanding';
    } else if (state === 'not-configured'){
      badge.textContent = 'Not configured';
      badge.className = 'status-badge-lg outstanding';
      badge.style.background = 'rgba(92,58,68,0.1)';
      badge.style.color = 'var(--ink-soft)';
    } else {
      badge.textContent = paid ? 'Paid' : 'Outstanding';
      badge.className = 'status-badge-lg ' + (paid ? 'paid' : 'outstanding');
    }
  }

  function renderMonthGrid(year){
    var grid = document.getElementById('month-grid');
    var outstandingSum = 0;
    var html = '';

    for (var m = 1; m <= 12; m++){
      var state = getMonthState(year, m);
      var cellClass = 'month-cell';
      var icon = '';
      var sub = '';

      if (state === 'before-joined' || state === 'not-due'){
        cellClass += ' neutral';
        icon = '\u2014';
      } else if (state === 'paid'){
        cellClass += ' paid';
        icon = '<svg viewBox="0 0 24 24" fill="none" width="24" height="24" aria-hidden="true"><path d="M6 12l4 4 8-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      } else if (state === 'outstanding'){
        cellClass += ' outstanding';
        icon = '<svg viewBox="0 0 24 24" fill="none" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>';
        var amt = expectedAmountForMonth(year, m);
        sub = '<span class="month-amount">' + escapeHtml(formatNaira(amt)) + '</span>';
        outstandingSum += amt;
      } else {
        cellClass += ' unconfigured';
        icon = '\u2014';
        sub = '<span class="month-note">not configured</span>';
      }

      html += '<div class="' + cellClass + '" aria-label="' + MONTH_NAMES[m - 1] + ' ' + year + ': ' + state + '">' +
        '<span class="month-name">' + MONTH_LABELS[m - 1] + '</span>' +
        '<span class="month-icon">' + icon + '</span>' +
        sub + '</div>';
    }

    grid.innerHTML = html;
    document.getElementById('outstanding-total').innerHTML =
      'Outstanding this year: <span>' + escapeHtml(formatNaira(outstandingSum)) + '</span>';
  }

  function renderLevies(){
    var section = document.getElementById('levies-section');
    if (!activeLevies.length){
      section.innerHTML = '<div class="empty-state"><p>No active levies right now</p></div>';
      return;
    }

    var paidLevyIds = {};
    levyPayments.forEach(function(lp){
      paidLevyIds[lp.levy_id] = true;
    });

    section.innerHTML = '<div class="levy-list">' + activeLevies.map(function(levy){
      var paid = !!paidLevyIds[levy.id];
      var dueStr = levy.due_date
        ? new Date(levy.due_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
        : '';
      return '<article class="levy-row">' +
        '<div><h3>' + escapeHtml(levy.title) + '</h3>' +
        '<p class="levy-meta">' + escapeHtml(formatNaira(levy.amount)) +
        (dueStr ? ' &middot; Due ' + escapeHtml(dueStr) : '') + '</p></div>' +
        '<span class="badge ' + (paid ? 'badge-present' : 'badge-absent') + '">' +
        (paid ? 'Paid' : 'Outstanding') + '</span></article>';
    }).join('') + '</div>';
  }

  function populateYearSelect(){
    var select = document.getElementById('year-select');
    var nowYear = new Date().getFullYear();
    var startYear = joinedYear || nowYear;
    select.innerHTML = '';
    for (var y = nowYear; y >= startYear; y--){
      var opt = document.createElement('option');
      opt.value = String(y);
      opt.textContent = String(y);
      if (y === nowYear) opt.selected = true;
      select.appendChild(opt);
    }
    select.addEventListener('change', function(){
      renderMonthGrid(Number(this.value));
    });
  }

  try {
    var url = FAITHBASE_CONFIG.supabase.url;
    var key = FAITHBASE_CONFIG.supabase.anonKey;
    if (url && key && url.indexOf('YOUR-') === -1){
      supabaseClient = supabase.createClient(url, key);
    }
  } catch (e) {}

  document.getElementById('sign-out-btn').addEventListener('click', async function(){
    this.disabled = true;
    this.textContent = 'Signing out\u2026';
    try { if (supabaseClient) await supabaseClient.auth.signOut(); } catch (e) {}
    window.location.replace('../../index.html');
  });

  (async function init(){
    if (!supabaseClient){ redirectToLogin(); return; }

    try {
      var sessionResult = await supabaseClient.auth.getSession();
      var session = sessionResult.data && sessionResult.data.session;
      if (!session){ redirectToLogin(); return; }

      currentUserId = session.user.id;

      var profileResult = await supabaseClient
        .from('profiles')
        .select('full_name, date_joined, status')
        .eq('id', session.user.id)
        .single();

      profile = profileResult.data;
      if (profileResult.error || !profile || profile.status !== 'active'){
        await supabaseClient.auth.signOut();
        redirectToLogin();
        return;
      }

      document.getElementById('member-name').textContent = firstName(profile.full_name);


      document.getElementById('header-avatar').textContent = getInitials(profile.full_name);

      var joined = profile.date_joined ? new Date(profile.date_joined) : new Date();
      joinedYear = joined.getFullYear();
      joinedMonth = joined.getMonth() + 1;

      var results = await Promise.all([
        supabaseClient.from('dues_config').select('amount, effective_from').order('effective_from', { ascending: true }),
        supabaseClient.from('dues_payments').select('period_year, period_month').eq('member_id', currentUserId),
        supabaseClient.from('levies').select('id, title, amount, due_date').eq('status', 'active').order('due_date', { ascending: true }),
        supabaseClient.from('levy_payments').select('levy_id').eq('member_id', currentUserId)
      ]);

      duesConfig = (results[0].data) || [];
      duesPayments = (results[1].data) || [];
      activeLevies = (results[2].data) || [];
      levyPayments = (results[3].data) || [];

      document.getElementById('page-loading').hidden = true;
      document.getElementById('page-content').hidden = false;

      populateYearSelect();
      renderCurrentCard();
      renderMonthGrid(new Date().getFullYear());
      renderLevies();
      revealPage();
    } catch (e){
      if (supabaseClient){ try { await supabaseClient.auth.signOut(); } catch (err) {} }
      redirectToLogin();
    }
  })();
})();

/* ── Member bottom nav (shared pattern) ── */
(function(){
  "use strict";
  var path = window.location.pathname;
  var active = null;
  if (path.indexOf('/dashboard.html') !== -1) active = 'home';
  else if (path.indexOf('/events') !== -1) active = 'events';
  else if (path.indexOf('/profile.html') !== -1) active = 'profile';
  document.querySelectorAll('.member-nav-item[data-nav]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-nav') === active);
  });
})();
</script>
</body>
